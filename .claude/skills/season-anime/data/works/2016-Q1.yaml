    synopsis: ゲームをこよなく愛するひきこもり・佐藤和真（カズマ）の人生は、交通事故（！？）によりあっけなく幕を閉じた……はずだった。だが、目を覚ますと女神を名乗る美少女・アクアは告げた。「ねぇ、ちょっといい話があるんだけど。異世界に行かない？ 1つだけあなたの好きなものを持って行っていいわよ」「……じゃあ、あんたで」RPGゲームのような異世界で、憧れの冒険者生活エンジョイ！ めざせ勇者！ ……と舞い上がったのも束の間、異世界に転生したカズマの目下緊急の難問は、生活費を工面することだった！ しかも、トラブルメーカーの駄女神・アクア、中二病をこじらせた魔法使い・めぐみん、妄想ノンストップな女騎士・ダクネスという、能力だけは高いのにとんでもなく残念な3人とパーティを組むことになって、さらなるカズマの受難は続く。そして、カズマ達パーティはついに魔王軍にも目をつけられて―――！？ 平凡な冒険者・カズマが過ごす異世界ライフの明日はどっち！？
