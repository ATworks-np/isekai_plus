    synopsis: 吉田小麦は元気が取り柄でちょっぴりドジな中学二年生。クラスメイトで親友の西園寺ここなや、男装アイドルの如月ツカサとともにアイドル活動をしているが、人気急上昇中のここなや男装のカリスマのツカサとは違い、小麦のお仕事は地元商店街でのライブなど地味なものばかり。それでもある「夢」を持ち、楽しくアイドルと女子中学生の両立生活を送っていた。そんなある日、小麦の前に傷ついた謎の生物・うさPが現れる。小麦が手当をしてあげると、その優しさを見込んだうさPは小麦にまじかるな力を使える伝説の女の子になってほしいとお願いしてくる。わけあって渋々伝説の女の子になった小麦は、突然現れた奇妙な怪人と戦うことに! 『まじかるナース』と名乗った小麦は以降、次々と現れる怪人と戦うはめになってしまう。そんな中、『まじかるメイド』や『まじかるシスター』も現れてみつどもえのバトルに!? 小麦は『女子中学生』『アイドル』『まじかるナース』の一人三役をこなせるのか。そしてバトルと「夢」の行く末は......!?
