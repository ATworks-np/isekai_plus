    synopsis: もうすぐ中学二年生になる朝日奈みらいは、春休みのある夜、 空から謎の物体が近くの公園に落ちていくところを発見します。 「もしかして魔法つかいかも！」と期待に胸をふくらませるみらいは、翌朝、ワクワクしながら、 幼い頃からずっとかわいがっている クマのぬいぐるみ「モフルン」と一緒に公園に向かいます。 するとそこで目にしたのは…ほうきにまたがって宙に浮く女の子…！ リコと名乗るその女の子は、なんと魔法つかい！！ みらいは、魔法つかいに興味津々でリコを質問攻めに。 リコは“ある物”を探しにみらいの住む世界にやってきたらしいのです。 さらに、よく見ると二人は同じペンダントをつけていて…。 そんな中、闇の魔法つかい・ドクロクシーの仲間・バッティが二人の前に現れます！ 「リンクルストーン・エメラルド」を渡せとリコに迫りますが、 どうやらリコも、「リンクルストーン・エメラルド」を探しているらしくて…。 バッティの闇の魔法で生まれた怪物ヨクバールに追い詰められたその時… みらいとリコ、そしてモフルンが手をつなぎ、魔法の言葉 『キュアップ・ラパパ！』ととなえると、ペンダントが光輝きます。 そして、伝説の魔法つかい「プリキュア」が誕生するのです…！！！
