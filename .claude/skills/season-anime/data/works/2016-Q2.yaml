      height: 620
    synopsis: |-
      □星宮エイジの部屋 ( 10年前 )
      画用紙にクレヨンで絵を描いている幼いエイジ。

      「 もし――例えどんな願いでも叶うとしたら。君は何を願う? 」

      部屋にはアニメのヒーロー、ダイアクジャーの絵本や人形が転がっている。
      絵を描いている幼いエイジの頭上には、謎の人影、DAISYが浮いている。
      『 歌手になりたい 』 、 『 お金が欲しい 』 、 『 永遠の命が欲しい 』 。色んな願いがあるだろう。
      きっとそれは、自分にとって幸せな願い。でもエイジは少し違った。描き上がったダイアクジャーの落書き。

      傍らには、 『 ダイアクジャーになって世界を支配したいです 』 の文字。
      幼いエイジ、頭上の人影を見上げる。

      「 10年前。エイジが願ったのは『世界の滅亡』だった 」

      幼いエイジの口が、何か、願いを唱える。
