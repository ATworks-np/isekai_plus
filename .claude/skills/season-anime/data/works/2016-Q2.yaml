    synopsis: |-
      ネトゲに女なんかいない、そう思っていた時期が私にもありました。

      ネトゲの女キャラに告白！→残念！　ネカマでした☆
      そんな悲しい黒歴史を秘めた少年・英騎（ルシアン）が、今度はネトゲ内で女キャラに告白された。
      まさか黒歴史の再来!?　と思いきや―――。

      「ま、マジで？　本当にリアル女!?」
      「うわー！　ルシアンだ！本当にルシアンですよー！」

      相手であるアコ＝玉置亜子は本物の美少女で、しかも……

      「いた、ルシアン！　おはようルシアン！」
      「ちょっおまっ！　やめて死ぬ！　恥ずかしさで死ぬから…！」

      こいつ、リアルとネトゲの区別が付いていない……だと……!?
      ヤバい！　俺のリアルが死滅してしまう……!!

      英騎は彼女を何とかまともな人間に更生させようと、ギルドの仲間たちと動き出すが―――

      残念で楽しい日常≒ネトゲライフが始まる！
