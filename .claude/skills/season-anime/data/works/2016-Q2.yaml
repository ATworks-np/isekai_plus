      width: 467
      height: 620
    synopsis: |-
      奇想天外な事件に巻き込まれた依頼人たち。
      主人公の新人弁護士、成歩堂龍一 ( なるほどうりゅういち ) が彼らの容疑を晴らすために立ち上がる。

      被告人は有罪なのか、無罪なのか …… 。
      成歩堂は依頼人を信じ、ライバル検事らと法廷で熱いバトルを繰り広げる。
      絶体絶命のピンチに追い込まれ、万事休すかという瞬間、
      「 異議あり! 」 の言葉と共にわずかな証拠から、ムジュンを突き、華麗なる逆転劇を巻き起こす !

      成歩堂の師匠で美人弁護士の綾里千尋 ( あやさとちひろ ) 、助手の綾里真宵 ( あやさとまよい )
      ライバル検事の御剣怜侍 ( みつるぎれいじ ) をはじめ、
      多数の個性豊かなキャラクターたちによる、
      コミカルな掛け合いを交えたエピソードにも注目 !
      アニメでは成歩堂と仲間たちの
      子供の頃からの繋がり、友情も深く描かれる。

      ねじ曲げられた真実を、師匠ゆずりの発想の逆転で、
      ゆさぶり、異議を唱え、真実を導き出す。

      アニメ界に新しい風を吹き込む
      痛快な謎解き法廷バトルに乞うご期待 !
