      width: 640
      height: 883
    synopsis: 17代伊達政宗と政宗を支える歴代の当主が織りなす戦国青春グラフティ。舞台は「伊達氏発祥の地」福島県伊達市。時は戦国時代、敵に囲まれた絶体絶命の伊達政宗(14)。初陣に際し伊達家ゆかりの梁川八幡神社に必勝祈願をする。すると氏神である龍が現れ、冥界の扉を開くという“冥龍眼”と16個の宝玉を手に入れる。しかし、それをつけ狙う謎の忍び集団からの奇襲を受ける政宗。絶体絶命と思った瞬間“冥龍眼”の力が解印し、突如謎の男が現れる。その男は強大な力で敵を圧倒するが、さらなる政宗のピンチを救うために“必殺技!ご先祖合体”を繰り出す。“冥龍眼”は伊達家の歴代当主16人を現世に復活させ、彼等と政宗を合体させる事で圧倒的な力を生み出すという神宝であった。そして、最初に現れた漢こそ、伝説の伊達家創主朝宗その人であった。眼下の下に“冥龍眼”を仕込み、伊達の未来の為襲い掛かる敵と戦う政宗とご先祖の活躍を描く戦国青春グラフティ“政宗ダテニクル”ここに開幕!
