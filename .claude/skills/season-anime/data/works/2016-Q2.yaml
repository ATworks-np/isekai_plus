    synopsis: 現代の裏側に存在する禍野（マガノ）には異形の化け物「ケガレ」が巣食う。それを祓い清め、人々を守るのが陰陽師である。才能がありながらも陰陽師になることを拒む焔魔堂（えんまどう）ろくろは神託により陰陽師の夫婦に与えられる「双星（そうせい）」の称号を得る。同じく双星となった化野紅緒（あだしのべにお）は全てのケガレを祓うことを理想に掲げる少女であった。双星として戦いに巻き込まれていく中で、強くなりたいと真に願い戦い続ける紅緒を目の当たりにしたろくろは、「雛月の悲劇（ひいなつきのひげき）」以降戦うことから逃げ続けていた自分の弱さと向き合う様になる。紅緒に刺激され目を逸らし続けていた過去と向き合ったろくろは再び陰陽師として戦うことを決意し、二人は共に「双星の陰陽師」として強大なケガレへと立ち向かうー。
