    synopsis: |-
      U.C. 0096―。

      『シャアの反乱』から3年、一年戦争から続く戦乱の世は、表面上には平穏を取り戻しているかのように見えた。工業スペースコロニー〈インダストリアル7〉に住む少年バナージ・リンクスは、ある日、オードリー・バーンと名乗る謎の少女と出会う。

      彼女は、ビスト財団とネオ・ジオン残党軍『袖付き』による『ラプラスの箱』の取引を止めようと、単身行動を起こしたのだ。彼女に対し、協力するバナージ。だが、同じく取引を妨害するため乗り込んだ地球連邦軍と『袖付き』との戦闘により、コロニーは戦場と化してしまう。

      オードリーを探して戦火を走り抜けるバナージは、『ラプラスの箱』の鍵となる純白のモビルスーツ、ユニコーンガンダムとの運命的な出会いを果たす。
