    synopsis: 二十世紀に地球を襲った大災害・落星雨(インベルティア)により多くの都市が壊滅したが、隕石から発見された未知の元素である万応素(マナ)は、人類の科学技術を発展させ、《星脈世代(ジェネステラ)》と呼ばれる特異な力を持った新人類を生み出すこととなった。世界最大の総合バトルトーナメント《星武祭(フェスタ)》の舞台、水上学園都市“六花”、通称・アスタリスクでは、毎年六つの学園が覇を競っていた。タッグ戦《鳳凰星武祭(フェニクス)》に出場した星導館学園の天霧綾斗は《華焔の魔女(グリューエンローゼ)》ユリスと共に大会制覇を目指す。
