    synopsis: |-
      未来での戦いも終わり中学3年生になったうさぎ達は、つかの間の平和な日々を取り戻していた。
      そんな折、予知夢をみる衛とレイ。不穏な気配が漂い始める。

      東京湾の埋立地に立てられた新設の私立無限学園に通う生徒が、次々に怪物に襲われる先祖返り現象が起こる。
      早速うさぎ達は偵察を開始。私立無限学園は既に新たなる敵デス・バスターズの支配下に ・ ・ ・ 。
      更に新たな二人のセーラー戦士が出現しとまどう、うさぎ達。

      私立無限学園で出会った天才レーサー天王はるかに、ドキドキが止まらず惹かれていくうさぎ。
      一方、ちびうさは無限学園創設者の娘、土萠ほたると知り合い、親しくなる。
      やがて土萠ほたるの隠された秘密が明らかになっていく ・ ・ ・
