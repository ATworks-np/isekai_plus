      神出鬼没、攻撃不能、生きとし生けるものすべてを喰らい尽す、超生物・影鰐。主人公・番場宗介は、謎の製薬会社・猿楽製薬による“影鰐兵器化計画”の事故に巻き込まれ、影鰐のクローンに取り憑かれてしまった。
      怪物・影鰐のクローンをその身に潜め、逃亡者となった番場に襲いかかる数々の事件。執拗に彼を追う猿楽製薬との決死の追走劇、そして新たに影鰐を追う人物との対決。事態が混迷を極める中で、再び影鰐を追う番場。奇獣の始祖、影鰐を倒すことは出来るのか―。
