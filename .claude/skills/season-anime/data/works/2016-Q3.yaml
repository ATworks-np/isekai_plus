    synopsis: 交易と肥沃な大地に支えられた大国パルスは、異教徒の国・ルシタニアの侵攻によって、一夜にして、その永きに渡る平和をおびやかされた。パルスとルシタニアの戦いにおいて、初陣にして大敗を経験し、帰るべき土地を奪われて亡国の王子となった少年。アルスラーンは、「戦士の中の戦士（マルダーンフ・マルダーン）」の異名を持つ最強の騎士・ダリューンと、たったふたりで奪われた王都エクバターナを取り戻すための旅を始める。そんな二人のもとに、ナルサス、エラム、ギーヴ、ファランギース、アルフリード、ジャスワント――苛酷な戦いを切り抜ける中、力強い仲間たちがが次々と集う。また、アルスラーン自身も、さまざまな経験を積むことで、ただ守られるだけの頼りない存在から、周囲を守り導く存在へと、たくましく成長していくのだった。しかし、王都は未だ遠い。シンドゥラの王位継承争いにまつわる戦いを無事乗り切り、パルスの土地へと凱旋したアルスラーンたちの前には、銀仮面の猛将・ヒルメスが立ちふさがる。そしてヒルメスをなんとか退け、ふたたび王都を目指そうというときには、さらなる脅威がパルスの土地に迫っていた。今、新しい適しの幕が開く。風塵の乱舞する戦場で、少年は何を見るのか……！
