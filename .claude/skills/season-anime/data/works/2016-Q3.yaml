    thumbnail:
      url: https://img2.animatetimes.com/2022/06/629efd596f24b_cc139a5c6e969de14ea947b889bb505b.jpg
      width: 471
      height: 640
    synopsis: |-
      実家の下町の定食屋「ゆきひら」を手伝う日々を送っていた幸平創真は、中学校卒業と同時に、ある料理学校への編入を父・城一郎に薦められる。それは日本屈指の料理学校「遠月茶寮料理學園」……卒業到達率10％以下の超エリート校だった。厳しい試験、脱落者続出の地獄の宿泊研修、退学を賭けた食戟。様々な試練を乗り越え、料理の腕を磨いていく創真。同じ志を持つ仲間や、同世代の実力者たちと出会い、一人の人間としても確実に成長を続けていた。

      ――そして迎えた秋。
      一年生の中でも選ばれた者しか出場を許されない遠月伝統「秋の選抜」、その出場切符を創真は手にする。「秋の選抜」予選のお題は“カレー料理”。優勝候補でスパイスの使い手、葉山アキラの作るカレーにスパイスの奥深さを知った創真は葉山の宣戦布告に受けて立つべく、スパイスと格闘。予選当日の朝まで試行錯誤して調理に臨み、葉山と同じ“香りの爆弾”という発想に行き着いたが、結果は葉山94点、創真93点と僅差で葉山が一位に。葉山に敗れはしたものの、見事に本選出場を決めた創真。

      悔しさを滲ませながらも、さらに強くなることを心に誓い、かくして迎える「秋の選抜」本選。トーナメントに肩を並べたのは、創真、恵、タクミ、緋沙子、アリス、黒木場、葉山、美作、の８名。
      次なる創真の相手は……!?　そして、てっぺんを取るのは……!?
