      height: 574
    synopsis: あらゆる分野の超一流の高校生を集めて、育て上げるために設立された、政府公認の特権的な学園「私立希望ヶ峰学園」。この学園には、超高校級の才能が集まる「本科」と、高い学費を払えば誰でも入れる「予備学科」が存在していた。才能だけではなく、性格も個性的な本科77期生。しかし彼らは才能のみに固執することなく、「人生に大切なことは才能ではなく、人との関わりで人格を磨き、思い出を作ることである」ということを学び、それぞれ普通の高校生らしく学園生活を謳歌していく。しかし、水面下では謎のプロジェクトの遂行、学園による学科差別が横行していた。そして、才能を渇望した予備学科の少年・日向創。彼に起こる運命的な出会いが、学園を、未来を予測もつかない方向へ導いてしまう。これは、人類史上最大最悪の絶望的事件に至るまでの物語。絶望で終わる、希望の物語。
