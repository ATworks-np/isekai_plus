    synopsis: 西暦2016年――。釜谷市にある「天万神社」で、巫女のアルバイトをしていた中学2年生、皇（すめらぎ）まとい。幼少の頃に母と生き別れになった彼女は、父方の祖父母の家に長年預けられており、三ヶ月前からようやく父である伸吾とふたりで暮らし始めた。そんな境遇からか、まといは平凡で穏やかな日常に憧れていた。まといの親友で、バイト仲間である草薙（くさなぎ）ゆまは、「天万神社」の神主一族に生まれた次期巫女候補であった。彼女は、一族が悪霊を払うための「退魔行」を先祖代々行っていたことを知り、まといを誘って「退魔行」にまつわる儀式「神懸りの儀」にチャレンジしようとする。だが、異変が生じたのはゆまの方ではなく――。平凡で普通の生活を求めていた少女に与えられたのは、神を纏って悪霊を払う能力!?皇まとい、誰にも邪魔されない穏やかな日々を取り戻すため、退魔活動（タイカツ）に励みます！
