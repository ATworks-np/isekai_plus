      width: 451
      height: 640
    synopsis: |-
      主人公の少年・新海ハル（中１）は、選ばれし人間だけが扱える"アプリドライヴ"を手に入れ、検索アプリのモンスター・ガッチモンと出会う。
      ガッチモンによると、スマホの奥に広がるインターネットの海で、今"凶悪なるラスボス人工知能・リヴァイアサン"がとんでもないことを企んでいるらしい。
      日々、友達に比べて自分はどこか脇役っぽいと感じていたハルは、その騒動を巡って、初めて大きな一歩を踏み出す。
      「なるんだ！ボクがホントの主人公に！」その決意のもと、ガッチモンとペアリングし、バディとなったハルは、"アプモンチップ"となって現実世界に出てきたガッチモンを、"アプリドライヴ"によって実体化="アプリアライズ"させて、敵のアプモンに立ち向かう！
      他のアプモンの力を借りる"アプリンク"。
      そして、新たなアプモンに進化する"アプ合体"を駆使し、ハルは騒動を起こすアプモンとアツく戦い、ネットの海に潜む人工知能について知っていく。すべての鍵を握るのは優しさ。
      仲間とともに現実と向き合い、自分の人生の選択をしていく新感覚バディストーリー。
