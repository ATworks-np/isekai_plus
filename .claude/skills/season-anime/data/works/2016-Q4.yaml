    synopsis: 説明しよう！主人公のトキオは、現代の東京に住む中学2年生。ある日突然、24世紀の組織・時空管理局の隊員に任命され、驚きの事実を知る！実は、教科書に書かれている歴史はすべてウソで、過去には教科書よりもむちゃくちゃ面白い真実の歴史=真歴史が眠っているというのだ！たとえば、絶世の美女といわれたクレオパトラは、本当は・・・クレ夫とパトラという漫才師だった！そして、正義の味方の桃太郎は、本当は・・・鬼よりも鬼な男だった！トキオは、隊員のカレンと共に24機ものボカンメカを駆使しながら真歴史を探すことに！24機のボカンメカは組み合わせによって変身したり合体したりビックリドッキリな力を発揮する！ そんなトキオたちの前に立ちはだかるのが、タイムボカンシリーズでおなじみの三悪である！今回の三人はビマージョ、ツブヤッキー、スズッキー！その名もAKUDAMA(アクダーマ)世界最大の教科書会社ヒストリーパラダイス社に雇われ、教科書通りの歴史を守るためにこき使われているのであった！果たして、次に明らかになるのは、いったいどんな真歴史だ！？
