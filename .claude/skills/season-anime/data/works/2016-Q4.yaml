      width: 514
      height: 620
    synopsis: |-
      17年前、アフリカ。神の兵と呼ばれた不死身の兵士が、米軍によって拿捕された。世界で初めて、“亜人”の存在が実証された瞬間だった。その特徴は、不死。病死、事故死、どのような状況下で死亡しようとも即座に身体を再生し、完璧な状態で復活する。それはまさに人類の夢であり、その利用価値は無限に考えられた。その後、亜人は世界で46体、日本では2体が確認された。

      しかし、「死ななければ、分からない」亜人はその性質上、発見が難しく、世界にはもっと多くの亜人がいると推測された。高校生・永井圭は、下校中トラックによる追突され死亡。しかし、直後に蘇生を果たす。国内3例目の亜人であることが判明した圭は、警察及び亜人管理委員会、さらには、賞金を狙うすべての人間から追われる身となる。山奥へと逃げ込んだ圭は、幼なじみの少年・海斗の力を借り、緊急配備が敷かれた警察の包囲網を突破。さらなる逃走を図る。

      同刻、日本国の管理下にあった２例目の亜人・田中が、“帽子”と呼ばれる男の幇助により脱走。この者らは直ちに人類へのテロ活動を開始した。亜人管理委員会の責任者・戸崎は、永井圭の捕獲と、亜人らが起こしたテロ行為の鎮圧に奔走する。そして、手がかりとなる、圭の妹・永井慧理子に目を付ける。だが、そこにはすでに人類への復讐を誓う別の亜人とＩＢＭと呼ばれる謎の黒い物体が侵入していた……。
