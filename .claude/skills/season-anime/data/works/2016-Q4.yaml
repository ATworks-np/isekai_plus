    synopsis: |-
      ここは人とモンスターが共存する世界。モンスターを狩る者たちはハンターと呼ばれた。
      そのハンターの世界の片隅に、モンスターと絆を結び共に生きる者「ライダー」がいた。
      ライダーは、モンスターの秘められた力を目覚めさせることが出来る「絆石」を持ち、絆を結んだモンスター「オトモン」と密かに暮らしていた。

      ライダーの村「ハクム村」に住む少年リュートは、冒険を共にしたナビルーや幼なじみのシュヴァルとリリア、ハンターであるリヴェルトなどの人々、 そしてオトモンであるレウスとの絆により奇跡をおこし黒の凶気から世界を救い、世界一のライダーとなった。

      そんなある日、同じライダーであるアユリアが「ブラックライダーズ」を名乗る謎のライダー達に連れ去られたことを知る。彼らの真の目的とは一体…。

