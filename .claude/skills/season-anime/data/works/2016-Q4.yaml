    synopsis: 自分とじゃ萌えないのに・・・私がモテてどうすんだーーー!!?高校生・芹沼花依は、男の子同士が仲良くしているのを見たり妄想したりするのが大好きな腐女子。ある日、大好きなアニメキャラが死んだショックで体重が激減し、それがきっかけで美少女に変身。すると、校内の4人の美少年からデートの誘いを受けてしまう。まさかのモテ期到来に、果たして花依は!?
