    synopsis: 池袋――幼少期にこの街で過ごした高校2年生の穂村すず子が戻ってきた。｢ずっと友達だよ！｣幼いころに仲良しだった森川千夏と誓った大切な記憶。その千夏とまた会えるかもしれない…それだけですず子の胸は高鳴る。転入した高校にもすぐには溶け込めず、早々に浮いた存在となっていたある日、｢WIXOSS｣を覚えれば友達ができるかも……そう思って学校帰りに立ち寄ったカードショップでデッキセットを購入する。家に帰りカードデッキを開封すると、カードの中に描かれた少女が動きだし、口を開く。｢ようこそ、セレクター｣selectorとして選ばれた人間は、自分の記憶のすべてが詰まった5枚のコインを賭けたバトルに参加しなければならない。コインをすべて取り戻し勝利すればこのゲームから脱出できる。逆にコインを全て失い、敗北すると、そのペナルティーとして──。｢Lostorage｣―――この不条理なゲームに巻き込まれる事となったすず子の運命は！？そして、すず子と時を同じくして、千夏の手にも……
