      width: 357
      height: 501
    synopsis: この世界には「舞武器（ブブキ）」と言う秘密がある。「舞武器」とは…太古に空から堕ちた巨人（ブランキ）の破片を人が手に入れ、契約を結び、武器として鍛えたモノをそう呼ぶ。「舞武器」は意志を持ち、契約者を守り、そして 共に戦う。「舞武器」と契約した者は舞武器使いと呼ばれていた。彼らは歴史の影で、時には為政者を支え、滅ぼし、時代とともに生きてきたのだ。動乱、紛争 の影には常に「舞武器」使い達がいた―――。 10年前、未曽有の大災害によって壊滅寸前にまで追い込まれた関東平野、その追悼式典が行われている新宿に一人の少年が降り立つ。彼の名は「一希東」。幼なじみの「朝吹黄金」からの呼びかけによってこの地に足を踏み入れた彼は大災害と、とある縁によって結ばれていた。その縁の対極に立つ、大災害の原因を知る舞武器使いの少女「礼央子」。 果たして「舞武器」とはなんなのか？東と礼央子の間にある因縁とは？　そして隠された大災害の真実とは？　東が舞武器使いと太古の巨人の凍った時を再び動かし始める……。
