      マジきゅんな学園生活、スタート!!

      芸術が魔法になる世界―。
      人々を感動させる魔法芸術の使い手はアルティスタと呼ばれ、
      ショービジネスなどの世界で活躍している。

      魔法芸術家(アルティスタ)の卵たちが集まる私立星ノ森魔法芸術高校に
      異例の転校生として通うことになった「愛ヶ咲 小花」。

