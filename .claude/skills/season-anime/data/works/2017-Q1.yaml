      魔女学校の中でほうきの飛行授業や魔法にまつわる不思議な授業など、魔女学校ならではの授業の中でアッコやロッテ、スーシィたちが大騒動を巻き起こす！
      ルーナノヴァを巻き込んだアッコの魔女への第一歩が今から始まる―
