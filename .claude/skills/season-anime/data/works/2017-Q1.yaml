    synopsis: |-
      彼の国には龍が棲んでいる──神話によれば、古の人々との契約により、龍は人を助け、人は龍を助けるという…

      舞台は“龍の国”。主人公は、国の守護神 “龍”を虫歯菌から守る新米・歯医者の野ノ子。隣国との戦争が激化する中、ある日彼女は、龍の歯の上で気絶した敵国の少年兵を見つける。

      少年の名はベル。大きな災いの前に龍が起こすと言われる不思議な現象で、巨大な歯の中から生き返ったものだった。自らが置かれた状況に戸惑うベル。そして彼を励まし、彼を龍の歯医者として受け入れる野ノ子。

      激しい戦いに巻き込まれながら、二人はやがて自らの運命を受け入れて行くことに…かつてない壮大なスケールで描かれる冒険ファンタジー！
