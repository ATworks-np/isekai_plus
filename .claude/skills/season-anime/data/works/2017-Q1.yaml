    synopsis: 人間の住む「物質界(アッシャー)」と悪魔が住む「虚無界(ゲヘナ)」。 本来は干渉することすらない二つの次元だが、悪魔はあらゆる物質に憑依し、物質界に干渉していた。 しかし人間の中には、そんな悪魔を祓う『祓魔師』が存在した――。 魔神（サタン）の落胤として生まれた奥村燐は、己の出自を隠し祓魔師になることを決意。 正十字学園内部に存在する祓魔師養成機関・祓魔塾に通っていたが、地の王・アマイモン襲撃の際、魔神の落胤であることが露見してしまう。魔神の「青い炎」を恐れ、燐と距離を置く仲間たち……。 そんな最中、学園最深部に封印されていた「不浄王の左目」が何者かに盗まれてしまい、 燐たちは予期せぬ事態に巻き込まれていく――。
