      抵抗する術もなく巨人の餌となった母の最期を目の当たりにして、この世から巨人を一匹残らず駆逐することを誓ったエレン。しかし、過酷な戦いの中で彼自身が巨人の姿に変貌してしまう―。人類の自由を勝ち取るために巨人の力を振るうエレンは、ウォール・シーナのストヘス区において「女型の巨人」と激突。巨人同士の激しい戦闘は、辛くもエレンの勝利となった。

