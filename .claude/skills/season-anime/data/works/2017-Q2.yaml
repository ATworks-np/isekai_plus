    synopsis: |-
      下鴨神社、糺ノ森に暮らす下鴨家。
      狸界の頭領であった父 ・ 総一郎は、ある日何の前触れもなく狸鍋にされたのだが、
      その経緯は今も謎に包まれていた。

      残された四兄弟のなかでも偉大な父の 「阿呆の血」 を色濃く継いだ三男 ・ 矢三郎は、
      生真面目だが土壇場に弱い長兄 ・ 矢一郎、蛙の姿で井戸にこもっている次兄 ・ 矢二郎、
      臆病ですぐに尻尾を出す末弟・矢四郎、そしてタカラヅカ命の母に囲まれて、
      「面白きことは良きことなり」 を身上に、それなりに楽しく暮らしている。

      恩師で隠居中の大天狗 ・ 赤玉先生の世話を焼いたり、神通力を得た人間の美女 ・ 弁天に振り回されたり、
      はたまた五山送り火の夜空で宿敵 ・ 夷川家と空中決戦を繰り広げる日々の果てに、
      突如下鴨家を襲う絶体絶命の危機 !

      父が鍋にされた真相が明らかになるなか、固い絆で結ばれた一家の運命はいかに !
