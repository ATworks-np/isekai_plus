      height: 640
    synopsis: フェアリル（妖精）の『りっぷ』は、ビッグヒューマル（人間の世界）とリトルフェアリル（フェアリルの世界）の２つの世界を舞台にして、今日も仲間のフェアリルたちと一緒に夢に向かって一生懸命！そんなりっぷたちの新しいお友達『りん』は、望の妹『かれん』が偶然持っていたフェアリルシード（フェアリルの種）から生まれた、リンドウの花のフェアリル。ビッグヒューマルでは、かれんと一緒に『魔法の鏡』を使ってお話ししたり、変身したり。リトルフェアリルでは、りっぷたちも通う新しい学校『マジカルフェアリルスクール』で、たくさんのフェアリルたちと勉強したり、寮生活をしたり。この学校は通路が消えたり、肖像画が話したり、他にも不思議なことがいっぱい……？『魔法薬学』や『魔法洋裁学』など、リトルフェアリルにしかない授業や、個性的な先生もたくさん！　刺激的で楽しい毎日！けれど、フェアリルがビッグヒューマルで暮らすことは簡単ではなく、フェアリルを巡るトラブルもあって……。でもどんな時でも、りんとりっぷたちは、たくさんの仲間たちやバディたちと共に成長して、大切な夢を追いかける！
