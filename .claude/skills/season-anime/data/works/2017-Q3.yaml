    synopsis: 午前０時にだけアクセスできる「地獄通信」。ここに晴らせぬ怨みを書き込むと、地獄少女が現れて憎い相手を地獄に落としてくれる……。若者たちの間で広がった都市伝説のような噂だったが、実は本当の事だったのだ。少女の名前は、閻魔あい。依頼主の怨みの感情に共鳴した時、彼女は地獄少女として標的となった人間を地獄へと送り流す。……だがそこには伝説には語られていない、少女との契約が存在した。「人を呪わば穴二つ。相手を地獄に送る代わりに、あなたの魂も死後地獄に行く事になるわ、それでもいいの？」そして、ある時閻魔あいの前に、謎の少女・ミチルが姿を現すようになる。自分が誰なのか、なぜここにいるのかを思い出せない様子のミチルに、あいは語りかける。彼女は一体何者なのか？その秘められた過去を紐解いてゆく――。
