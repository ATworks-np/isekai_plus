    synopsis: |-
      ギャンブルの絶対的な掟。
      それは、勝負の果てに勝者と敗者が存在すること。
      勝者は富と栄誉を手にし、敗者は落伍者の烙印を押され、
      大いなる喪失を味わう。
      勝者が決するまでの静寂の中、本能は掻き立てられ、
      欲望は恍惚の境地に達する。
      資本主義の社会において、それはまさに人生の残酷なる縮図。
      人はなぜ、リスクを負う世界に心奪われるのか ?
      その狂気の先に目にするものとは。

      ギャンブルは狂っているほど面白い。さぁ、賭け狂いましょう??。
