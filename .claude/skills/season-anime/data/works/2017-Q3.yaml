    synopsis: オフィス街に程近い商店街の一角、雑居ビルの地下一階にその店はある。 猫の絵が描かれた看板が目印の、創業70年の老舗食堂「洋食のねこや」。 どこにでもありそうなこの洋食屋の扉は、週に一度“特別営業”の土曜日にだけ 「ある世界」とつながる。異世界の様々な場所に現れる扉を通じてやってくる、 生まれも文化も、種族すらもバラバラな「向こうの世界」の客たち。そんな彼らが 分け隔てなく料理に舌鼓を打てる、不思議な“魅力”がここ「異世界食堂」にはある。 この店で生まれる異世界と現代、食堂に集う人々と店主、 そして料理との一期一会を描く、温かい出会いの物語。
