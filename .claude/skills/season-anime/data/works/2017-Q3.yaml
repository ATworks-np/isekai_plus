    thumbnail:
      url: https://img2.animatetimes.com/2022/06/62a041d404f0c_c11d6af7f208d2a481acf8a8954f8408.jpg
      width: 567
      height: 800
    synopsis: 後日、「魔法少女事変」と称される、錬金術師キャロルの世界解剖計画を阻止してから数週間後。立花 響は最大最強の敵を相手に格闘し、為すがままに組み伏せられようとしていた。対する脅威――その名は「夏休みの宿題」。学生の本分という、避けられない運命はどうしようもなく過酷であり、抗いようもなく無慈悲である。どうして、こうなったのか？押し潰されそうな心のままに振り返ってみる響。海にも行った。山にも行った。新しくできた友達との約束だからと理由をつけて、あちこちの夏祭りを満喫し、夜はバカみたいに口を開けて花火を見上げた。お盆には学生寮を出て、千葉の実家に戻った。久しぶりの家族水いらず。「家族が揃ったら、やっぱり鍋だろうッ！」真夏だというのに、何年かぶりに顔を合わせた父親は、何年か前と変わらず浅薄・短慮を惜しげもなく披露し、そして響もまた、そんな父親のＣ調に同調して、母親と祖母の眉毛の形を見事なくらい「ハ」の字に変えさせた。少し前に――シンフォギアを身に纏わなければならない超常の事件も発生したが、結果、ちょっぴり世界史に詳しくなったような気になる響。担任から、自分の書く字はまるでヒエログラフと言われ続けてきたが、それがどんなものかようやく知り、さすがにそれはないとも理解した。かつてないほどに満ち足りた日々。クラスメイトのひとりは、「あんたの日常も、ようやく深夜のアニメみたいになってきたわね」と評してくれた。言ってることはよくわからなかったが、口ぶりからそれが悪い事ではないと伝わって嬉しかった。こんな毎日が、永遠に続けば……と願う響。――そう……あんなにもきらびやかな毎日を続けてしまったがためのツケは、いつか払わなければならない。夏休み後半、登校日。立花 響の新たな戦いの幕は、ここに切って落とされるのであった。
