    thumbnail:
      url: https://img2.animatetimes.com/news/visual/2017/1514632880_1_1_73d091376b2c82512c6d2d5cd46058fe.jpg
      width: 457
      height: 640
    synopsis: |-
      桜丘高校の入学式。合田美桜と芹沢春輝は桜の樹の下で出会う。

      「美しい桜って書いて、美桜」
      「俺は春輝。春が輝く」

      春生まれの二人は親近感を覚える。それ以来、気づいたらお互いは目で追うようになっていた。美術部の美桜は大人しく、映画研究部の春輝は快活で周りにはいつも誰かがいた。

      二人は全く違うタイプだが、いつの間にか一緒に下校する仲になっていた。付き合っていると勘違いされることもあるが、ずっと友達以上恋人未満の関係。

      本当はお互いに「好き」という気持ちを抱えながら―。いつも帰り道に寄る高台の階段に腰をかける二人。

      「春輝君って、好きな人とか、いる？」
      思わず聞いてしまった美桜に答える春輝。

      「好きなやつ、いるよ。…美桜は？」

      二人のその手の距離は10センチ。
      たった10センチなのに、その距離が縮まらない―。
