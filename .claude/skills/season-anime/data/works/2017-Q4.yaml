    synopsis: 巨大都市、ラッセルシティ。ガロの称号を持つ魔戒騎士・ソードは、魔界より現われ人間に憑依する魔獣・ホラーからその街を守るため、人知れず闘う日々を送っていた。ある時、ホラーを討滅する中で、ソードは「エルドラド」という謎のキーワードに遭遇する。そのキーワードに、ホラーが目論む巨大な陰謀を感じ取ったソードは、ホラー討滅だけでなく、「エルドラド」の意味を探すために調査を始める。そんななか、ソードはソフィという少女と出会う。ソフィもまた行方不明になった兄が残したメッセージ、「エルドラド」の意味を探し求めていた。兄を失ったソフィ、そしてソードもまた過去に妹を失っていた。「エルドラド」という言葉に引き寄せられた二人は、互いに見えない絆を感じ、行動を共にするようになる。そして、それぞれの想いが交錯する旅がはじまった―
