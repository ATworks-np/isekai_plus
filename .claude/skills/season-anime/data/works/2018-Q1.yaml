    synopsis: 超イケてる大人のお姉さんになりたい中学２年生の野乃はな。前髪を切り過ぎるわ遅刻はするわで転校初日は大失敗。でも、なんだか素敵な出会いもあったりまた明日からの日々に胸躍らせていたところ、空から降ってきた不思議な赤ちゃん「はぐたん」と、そのお世話係（？）のハムスター「ハリー」と出会います。そこへ「クライアス社」という悪い組織がはぐたんの持つ「ミライクリスタル」を狙って現れ、怪物を出して襲ってきたのです。はぐたんを守りたい！というはなの強い気持ちによって新たなミライクリスタルが生まれると、はなは元気のプリキュア・キュアエールに変身します。ミライクリスタルとは、この世界にあふれている明日をつくる力・アスパワワの結晶。これが奪われてしまうと、みんなの未来が無くなってしまいます。みんなの未来、そしてはぐたん。大切たいせつなものを守るためのキュアエールの物語が今幕を開けます。
