      width: 640
      height: 904
    synopsis: |-
      ハーレム王に俺はなるっ！
      私立駒王学園に通うバカでスケベな男子高校生イッセーこと兵藤一誠は、その身に強大な神器(セイクリッド・ギア)を宿していたがために命を奪われてしまうが、学園一の美少女にして、憧れの先輩であったリアス・グレモリーの手によって、悪魔として転生を果たす。しかしその代償はリアスの下僕悪魔として生きることだった！

      エロいけど、ポジティブで真っ直ぐな一誠が、ご主人様にして上級悪魔のリアスとその眷属の美少女悪魔たちに囲まれながら、いつの日か自らも上級悪魔となり、ハーレムを築くという夢を叶えるため、様々な敵を打ち倒していく努力と友情と熱血の学園バトルエンターテインメント！

      早朝から誘惑してくる朱乃、急接近してきた小猫、そしてますます積極的になったアーシアに、3人への対抗心を燃やすリアス。過激な争奪戦の中心にいる一誠は、幸福なエロエロライフに鼻の下を伸ばすばかりだった。

      平穏な日常を満喫する一方で、オカルト研究部のメンバーはバアル家とのレーティングゲームと一誠たちの修学旅行に向けて着々と準備を進めていた。修学旅行の行き先は、異なる神話体系が存在する京都。観光を楽しもうとする一誠たちだったが、到着するやいなやカオス・ブリゲードの一派と古都に棲まう妖怪たちの悶着に巻き込まれてしまう。一誠はリアスの愛する京都を守るため、新たな「可能性」を模索するが……。
