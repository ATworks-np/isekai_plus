    synopsis: ―その歌は星の運命すら変える。２大歌姫による幻奏叙事詩（ファンタジーオペラ） 舞台は架空の大陸ヌーナシア。無数の国々や文明が興り、繁栄し、争い、滅んでいった悠久の歴史が刻まれている。 緑豊かな辺境の村・ダンデラに住むリン（鈴木このみ）はちょっと？食いしん坊で元気な女の子。しっかり者で優しいお姉さんのメル（茅野愛衣）、発明オタクで世界一の科学者を目指している少年・アル（久野美咲）、厳しくも愛情深いおじいさんに囲まれ、のどかで平穏な暮らしをしている。 一方、華やかな王都で、民衆から愛される歌姫・フィーニス（田村ゆかり）。彼女は次期国王となる王子のお妃候補でありながら幾重もの壁に囲まれた王宮の奥深くで孤独な毎日を過ごしている。そんな対照的な2人にはほかの人間にはない、ある特別な力がある。傷を癒し、水を作り出し、火を灯す…　さまざまな奇跡を生む“歌”を歌うことができるのだ。 …運命は、歌の力を持つ2人を、それぞれ過酷な旅へ誘う。戦争の影が王国を覆いつくすと奇跡の歌の輝きさえ血の色に染まってゆく。愛する者たちの命が奪われ声なき悲鳴が石牢に響く。2人の運命が交わり最後に歌われる歌は絶望か、希望か、それとも・・・・。
