      発足し、授業において決められたレシピ以外で料理を作ることが許されなくなってしまった。
      薊のやり方に納得できない創真達は中枢美食機関セントラルに立ち向かう。

      そんな中、遠月最難関の1つと言われる進級試験の実施が創真たちの目前に迫っていた…。
