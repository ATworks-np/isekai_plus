    synopsis: |-
      本土から遠く離れた海に浮かぶ「浦島」
      そこは楽園と見まごう豊かな自然と、複雑な過去と因習に囚われた人々が息づく島だった。

      本土から見放され、忘れられつつあるこの地で
      半ば諦めを懐きながら生きる島の住人。

      そんな島に「タイムトラベラー」を自称するひとりの青年が流れ着く。
      「せつな」という名前と「ある使命」以外の記憶を失ったその青年は、
      凛音、夏蓮、紗羅という3人の少女たちと出会い、
      やがて島の未来を変えるべく奔走をはじめる。

      排他的な因習と数々の謎を秘めた浦島をめぐる
      青年と少女たちの物語がひも解かれるーー。
