      url: https://img2.animatetimes.com/2022/08/280711b29ed3b0159b650e78519fb8a3630d781d3575d7_70121702_5ac3619107fd09e3171829e373f05c3986939e18.jpg
      width: 780
      height: 548
    synopsis: 機関獣と、神秘的な古代のアイテムが織りなすバトル。軒轅剣シリーズ12作品中で人気の高い「外伝　蒼之濤（そうのとう）」（2004年）、そこにつながる物語を描く作品となる。時空をつかさどる古代神器『太一輪』（たいいちのわ）。その力によって、歴史は大きく変貌した。太白帝国は『機関獣』を量産し、強大な武力によって神州大地を掌握。更なる国土を求め、世界征服を目論んだ。太白歴99年、太白帝国と、それに抗う反抗軍との戦闘が各地で続いていた。遡ること3年前、帝国軍の襲撃によって両親を失った苻 殷(ふ いん)と苻 寧(ふ ねい)の姉妹、二人は村々を回る旅芸人で生計を立てていた。旅の途中、姉の殷(いん)は偶然、数百年間置き去りにされていた『天書(てんしょ)』を手にする。太白軍の攻撃に出くわした姉妹は、天書から現れた伝説の剣『軒轅剣(けんえんけん)』で太白軍を撃退する。一方そのころ、姉妹の幼馴染みの少年蒲 釗(ぷ しょう)は太白の奴隷となっていた。蒲釗は、自分の村を襲った帝国の戦闘装置“機関獣”に魅せられていく。反抗軍に加わった殷と寧の姉妹。軒轅剣を持つ姉の殷と、勝気な妹の寧、様々な能力を持つ反抗軍のメンバーで、反抗軍は次々と機関獣を撃退する。しかし、争いに疑問を感じながら妹をかばって戦う殷と、自立をあせって戦いたがる寧は、気持ちがすれ違っていた。戦いの中、殷、寧、釗の再会の時が訪れる。敵同士として相対した時、互いに死んだと思っていた３人の運命の歯車が大きく回転する。
