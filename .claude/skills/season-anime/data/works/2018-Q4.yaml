    synopsis: 2013年、スイスの原子核研究機構『CERN』──。ヒッグス粒子発見の影で、ある秘密プロジェクトが発足した。そのプロジェクトの名前は『ナイアンティック計画』。その目的は人間の精神に干渉する未知の物質を研究することにあった。 『エキゾチック・マター（XM）』と呼ばれる事になるその物質は、古来より人々の精神・能力に感応し、人類の歴史にさえ大きな影響を与えてきたのだった。世界各国の機関が、秘密裏にその研究に取り組んだ。XMは、人類の希望または脅威とされ、 大国や巨大企業による争奪戦が巻き起こってゆく。XMの力を受け入れ、人類の進化に利用しようとする『エンライテンド』。XMを脅威と見なし、コントロールしようとする『レジスタンス』。世界はふたつの陣営に別れ、今も争い続けている。この世界で起きている争いの背後には、XMの存在があったのだ。そして、2018年──。東京、そして世界を舞台に、XMをめぐる新たな戦いが幕をあける。アニメーション、オンライン位置情報ゲーム、そして現実がリンクする、かつて体験したことのない新たな「拡張現実エンターテインメント」が、始まる。
