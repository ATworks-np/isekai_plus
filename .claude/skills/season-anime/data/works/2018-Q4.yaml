      width: 449
      height: 640
    synopsis: 東京西部に位置する巨大な『学園都市』。 総人口230万人を数え、その約8割を学生が占めるこの都市では、超能力開発のための特殊なカリキュラムが実施され、学生たちの能力は『無能力(レベル0)』から『超能力(レベル5)』までの六段階で評価されていた。 とある高校生・上条当麻(かみじょう・とうま)も、学園都市に住む学生のひとり。彼は自分の右手に宿る力――異能の力なら神の加護すら打ち消す『幻想殺し(イマジンブレイカー)』のため、落第寸前の『無能力』の評価を受け、不幸まっしぐらの人生を送っていた。 そんな上条の学生生活は、夏休みのはじめに空から降ってきた純白のシスターによって、大きく変わってしまう。「魔術」の世界から逃げてきたという彼女――『禁書目録(インデックス)』との出会いに始まって、さまざまな事件に巻き込まれていく上条。 学園都市を統べる「科学」サイド、インデックスに連なる「魔術」サイド双方の事件を綱渡りで解決していくうちに、少しずつ人の輪を広げていくことに。そして、ついには魔術サイド、十字教最大宗派のローマ正教が、上条の存在に目を向けることになってしまう……。 魔術サイドに呼応するように、科学サイドたる学園都市も動きだす。しかし、にわかに対立を見せ始めた世界の動きに抗うように、立ち上がる者たちがいた。 上条とかかわったことで、大きく運命を変えた『ヒーロー』たち。彼らもまた、身を挺して世界と対峙する。上条当麻がそうしてきたように。科学と魔術が三度交わるとき、物語は大きく動き出す――!!
