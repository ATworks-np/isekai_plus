    synopsis: ついに“世界への門”が開く！少年サッカー日本代表“イナズマジャパン”がついに発表！ その中には、稲森明日人、灰崎凌兵、野坂悠馬の名前もあった。各校から選び抜かれた精鋭選手が集結する。さらに、海外のクラブチームでプレイしていた新たな仲間“一星充”を加え、 今まさに少年サッカー日本代表は、世界の荒波へと船出する。しかし、その先は予想をはるかに超える試練が待っていた。 謎のプレイヤー“オリオンの使徒”、策略、裏切り、衝突---。様々な思惑が渦巻く少年サッカー世界大会 FFI（フットボールフロンティア・インターナショナル）が今、始まる。日本よ！　世界へ羽ばたけ！
