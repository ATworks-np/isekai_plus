    synopsis: 「弦音」＝ツルネ 矢を放ったときに鳴る弦の音。 射手にとって美しい弦音を響かせることは喜びであり、その美しい音は人の心をとらえて離さない。 同一人物が、同じ道具を使ったとしても同じ弦音を発することはできず、まさに一期一会。 一射一射が、一生に一度のとである。 鳴宮湊にとって、弦音が全ての＜出会い＞の始まりとなった……。 果てのない弓の道を歩み始めるのは、若葉のように瑞々しい高校1年生の少年たち。 彼らは弓道を通して一生に一度、かけがえのない経験をし、＜仲間＞を手に入れていく。 木漏れ日のような、きらめく青春“弓道”アニメーション、開幕！
