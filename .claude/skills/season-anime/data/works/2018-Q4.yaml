      時に西暦2202年。あの壮大な片道16万8000光年にも及ぶイスカンダルへの大航海から宇宙戦艦ヤマトが帰還して、既に3年──。〈コスモリバースシステム〉により、かつての青い姿を取り戻した地球は、ガミラス帝国とも和平条約を締結。復興の傍ら、防衛のためと最新鋭戦艦アンドロメダを含む新鋭艦隊の整備が進められていた。

