    synopsis: 良家の子女が集う名門、私立百花王学園。ギャンブルで支配されたこの学園の頂点に君臨するのは、弱者の人生を支配し、政財界にすら影響力を持つ絶対的な支配者、生徒会だった。しかし、生徒会長の桃喰綺羅莉は突然、生徒会の解散・総選挙を宣言する。選挙のルールは一人一票。全生徒に学園の頂点を目指すチャンスが与えられる。カオスと悦楽を求める綺羅莉の思惑による選挙戦。さらに、その機に乗じ、新たな脅威が訪れる。百喰一族――綺羅莉と夢子に連なる者たちが。蛇喰夢子と友情を深めてきた鈴井涼太、早乙女芽亜里、皇 伊月の４名は、この仕組まれた総選挙の中、自らの信念をかけた闘いを迫られる。弱肉強食の学園で「餌」となるか、他を喰らい生態系の「長」となるか。ギリギリの選択が心を揺さぶる「究極の選挙バトルロイヤル」がいま始まる！
