    synopsis: |-
      荒城ユキヤ、たぶん14歳。
      普段はひとりでDJやってます。
      親の影響で、小さい頃からハウスミュージックを聴いてたから......
      プレイ動画もちょこちょこアップしたりして。
      誰かに何かを伝えたい。認められたい、必要とされたい。
      けど、傷つくのは怖い。どこか噛み合わない日常......

      ある日、視聴数を稼ぎたくてやったことが、取り返しのつかないことになってしまった。 『あの世界』からの生放送。 それをきっかけにボクは狙われ、人の願いと、想いの渦に巻き込まれていく。 自分ひとりではどうにもできない状況......
      でも、誰かと一緒なら――。
