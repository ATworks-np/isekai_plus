    synopsis: ぼくは自動的なんだよ。名を不気味な泡(ブギーポップ)という――。エンタテインメントノベルでNo.1シェアを誇るレーベル・電撃文庫に多大な影響を与えた、今なお色褪せることのない名作として、絶大な支持を集める人気タイトル「ブギーポップは笑わない」シリーズが、刊行から20年の節目となる年に待望のTVアニメ化決定！TVアニメを手掛けるのは、2015年に放送され、大ヒットを記録したTVアニメ「ワンパンマン」で、世界中のアニメユーザーを唸らせた監督・夏目真悟。そして同作のシリーズ構成と脚本を務めた鈴木智尋に、圧倒的なクオリティを実現させた日本屈指のアニメーションスタジオ・マッドハウスが集結し、世界に危機が迫ったとき、自動的に浮かび上がるヒーロー、ブギーポップを中心に繰り広げられるアクションファンタジーを見事に描き切る！
