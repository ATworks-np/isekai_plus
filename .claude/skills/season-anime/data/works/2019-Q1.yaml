    synopsis: とあるのどかな日。静けさを破り、一人の少女がカフェ『Rainy Color』の扉を蹴破る音が響く。彼女の名は、天見ヨーコ。このカフェのオーナーである、天見浩司の娘。 「約束くらい守れ！このクソオヤジーっ！」 そう叫ぶ先にある姿は、騒動の元凶である天見浩司の姿でした。自分達との旅行をすっぽかしただけでなく、自分はハワイ旅行に行こうとしている浩司に、ますます怒りの度合いを強めるヨーコ。だが、そこに現れた『Rainy Color』のマスコット犬であるレインの姿に、ヨーコが固まってしまう。実はヨーコは、犬が大の苦手だったのです。そして慌てて逃げた先には、浩司が荷物を詰めていたスーツケースが…。ガシャーン！スーツケースに足をひっかけたヨーコが盛大に転び、近くにあった浩司の壺が木っ端みじんに。そしてヨーコは、壺粉砕の罰として夏休みの間、『Rainy Color』の代理店長をする事になってしまうのでした…。 ヨーコ達の奮闘とともに、人のために何ができるかを描く、ほっと一息つけるハートフルストーリーが始まります。
