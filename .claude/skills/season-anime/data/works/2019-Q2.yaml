    synopsis: 俺の名前はダン・クーソー。 友達のウィントンやリア、そして犬のライトニングと一緒に「オーサム・ワン」という、イカした映像を撮ってネットにＵＰするクールなチームを組んでいるんだ！ そんな俺たちが、12年前に世界中を驚かせた「グレート・コリジョン」という事件が起きた場所へ行き、その謎を解いて映像に残そうとしていたら、光とともに現れた不思議な生き物に出会ったんだ！！ その不思議な生き物の名は「ドラゴ」！ ドラゴは竜の姿をし、普段は小さな球の形をしているんだけど巨大になったり、凄まじい威力の必殺技を出したりする。ドラゴが言うには、自分たちのような生き物のことを「爆丸」って言うんだって！ さらに不思議なことに、俺たちがドラゴたちと出会った同じ時、同じ瞬間に、世界中でもさまざまな種類の爆丸が見つかったんだ！ こうして世界中が爆丸ブームで盛り上がるんだけど、爆丸が持つ不思議な力に目を付けた悪い奴らが現れたりして、トラブルや事件もたくさん起きてしまう。 でも俺たち、オーサム・ワンとドラゴがいれば大丈夫！！　楽しんでいこうぜ！！
