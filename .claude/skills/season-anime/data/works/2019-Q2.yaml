    synopsis: ある日、黒船が天（そら）から降ってきた――。One day, a black ship fell from the sky... “刻（とき）を操る力”のある伝説の秘宝“時辰儀（じしんぎ）”をめぐって京の都で繰り広げられた“スサノオ事変”は、仮面の将軍・“無限斎（むげんさい）”こと吉田松陰の死をもって終結した。「俺達にはまだやるべき事がある」故郷の萩にて、かつての師・吉田松陰の墓参りを終えた高杉晋作と相棒の桂小五郎は、再び京の都に戻ってきた。師の教えを守らんとひた走る高杉の隣に、いつになく遠い目をする桂の姿......。その時、地響きとともに空が割れ、“時空の裂け目”から、破壊したはずの時辰儀が出現。“意思”を持ち始めた時辰儀が、制御不能の暴走を開始する!! さらに因縁の好敵手として立ちはだかるのは、先の戦で副長・土方歳三を失った新撰組!! 局長・近藤勇が口にしたのはなんと、新たな“無限斎”の存在だった――。戻すのか、変えるのか。「必ず、正しき刻の流れに戻してみせる」高杉の決意と、「ずっと、おまえに言えなかったことがある」揺れる桂の胸の内。やり直しの利かない運命（アンリセッタブル・クライシス）に翻弄され、志士たちの新たな物語が動き出す!
