    synopsis: かつて妖精は、“兵器”だった―。 この世界には、動物に憑依することで不思議な力を宿す、妖精が存在していた。 妖精が憑依した動物の臓器を摘出し人間に移植することで、妖精を分身として出現 させ、兵器として扱えるようになる。妖精を戦争の道具として自在に操る兵士た ち、彼らは『妖精兵』と呼ばれた。長きにわたる戦争が終結すると、彼らはその役 目を終え、行き場を失う。あるものは政府に、あるものはマフィアに、あるものは テロリストに。それぞれの生きる道を選択する。 戦争から9年の歳月が経つ。主人公のマーリヤは、妖精に関連する事件を捜査・鎮 圧する、違法妖精取締機関『ドロテア』に配属されたばかりの女の子。 未だ不安定な政治情勢の中、戦争によって受けた傷や過去を持つ犯罪者が現れ、 復讐のためテロを起こす。 これは、無秩序な戦後に抗い、それぞれの正義を求め戦う 『妖精兵』たちの物語―。
