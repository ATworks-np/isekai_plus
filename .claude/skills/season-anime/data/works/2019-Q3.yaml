    synopsis: パトリア大陸に生まれた民主主義国家【パトリア】。経済的不一致から【北部パトリアユニオン】と【南部パトリア連合】に分裂したこの国では、長きに渡る内戦が続いていた。劣勢に追い込まれた北部は、南部打倒のため、遂に禁忌の技術を用いてしまう。人間を異形の兵士へと造りかえるその術は、人の姿と引き換えに、神にも喩えられる力を得るというもの。その力により長き戦乱は、和平へと導かれる事となった。 【擬神兵】、それは【神】と称えられた救国の英雄。 時は経ち、戦争が過去へと移り変わる今。人の姿と引き換えに【擬神兵】となった者たちは、その過ぎたる力故、人々からただ【獣】と称ばれ、恐れ蔑まれる存在へと変わっていた。 元擬神兵部隊の隊長・【ハンク】は、【獣】に身を堕としたかつての戦友でもある【擬神兵】を殺す者【獣狩り】として旅を続けていた。擬神兵だった父の仇を探す少女【シャール】はハンクと出会い、父の死の意味を知る為、共に旅することを決意する。やがて知る、戦い続けなければならない本当の理由。そしてハンクが探す【獣を解き放った男】の存在。 仲間殺しの罪を一身に背負い続けていく【ハンク】の旅路の行き着く先とは？
