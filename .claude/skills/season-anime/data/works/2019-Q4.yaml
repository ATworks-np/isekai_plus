    synopsis: 実家の定食屋「ゆきひら」を手伝いながら料理の腕を磨いてきた幸平創真は、 超エリート料理学校「遠月茶寮料理學園」に入学する。 学園の内外で、様々な料理人たちと出会い、成長を続ける創真だったが、 薙切薊が遠月学園の新総帥の座に就いたことで状況が一変する。 なんと新たに発足した中枢美食機関により、自由に料理が作れなくなるという事態に……。 中枢美食機関のやり方に異を唱え反発した創真たちだったが、 その結果、学園の反逆者とされてしまう。 ――そして迎えた2年生進級試験。 嫌がらせを受けながらも、力を合わせて試験を突破していくが、中枢美食機関の妨害は止まない。 ついには仲間たちが退学処分という憂き目に遭ってしまう！ 追い込まれた創真たちは事態を打開するため、薊政権の新遠月十傑と連隊食戟を行うことを決意する。 初戦を圧勝で収めたものの、彼らの運命を決める激戦まだ始まったばかり。 迎えた2nd BOUT！ 果たして創真たちは十傑の座を奪い、仲間たちを救えるのか！
