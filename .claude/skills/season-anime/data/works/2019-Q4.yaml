    synopsis: 超常能力“個性”を持つ人間が当たり前の世界。憧れのNo.1ヒーロー・オールマイトと出会った“無個性”の少年・緑谷出久、通称「デク」は、その内に秘めるヒーローの資質を見出され、オールマイトから“個性”ワン・フォー・オールを受け継いだ。デクはヒーロー輩出の名門・雄英高校に入学し、笑顔で人々を救ける最高のヒーローになることを目指して、クラスメイトたちと試練の毎日を過ごしていた。 林間合宿での敵＜ヴィラン＞連合による襲撃事件をきっかけに、オールマイトは宿敵オール・フォー・ワンと激突。オール・フォー・ワンを倒すものの、オールマイトは力を使い果たし、プロヒーローを引退。デクはオールマイトの意志を継ぎ、最高のヒーローになることを改めて決意する。新たな必殺技を修得したデクは、難関の「プロヒーロー仮免許取得試験」に挑戦。全国から集まったライバルたちに立ち向かい、見事試験に合格！“最高のヒーロー”にまた一歩近づいた。 そして、次なるステージは、プロヒーローの下での「インターン活動」。そこでデクは、新たな“脅威”と、新たな“使命”に出会うことになる―！
