    synopsis: 肉食獣と草食獣の共存する世界。食肉が重罪とされるなか、名門校・チェリートン学園で演劇部の生徒が食い殺される“食殺事件”が起きる。犯人は見つからず、不安に揺れる生徒たち。そんな中、演劇部では死んだ生徒の代役を巡っていさかいが起きる。次期『ビースター』候補とささやかれ、演劇部のカリスマ的存在であるアカシカのルイに、逆恨みをした肉食獣の部員が襲いかかったのだ。それを庇ったのは、照明係の二年生・レゴシ。『鋭い爪』や『大きな体』など、強そうな外見とは裏腹に、心優しく無口で不器用なオスのハイイロオオカミだ。だが、当のルイはそんなレゴシを偽善的で気に食わないと言い、強引に夜間練習の見張りに任命する。夜。誰もいない講堂裏の裏庭で、ひとり見張りをしていたレゴシの前に現れたのは???小さな白いドワーフウサギの女子生徒・ハル。その匂いを嗅いだ瞬間、レゴシの体を本能が駆け巡る。我を忘れて襲いかかり、気付いた時には、彼女を両腕に抱きすくめていた。腕の中で聞こえる鼓動が自分のものか、彼女のものかもわからない。しかしこのハルと、そして自分の本能との出会いが、静かで穏やかだったレゴシの人生を大きく変えていく。彼女へのこの感情は、恋なのか？　それとも食欲なのか？オスとメス、肉食獣と草食獣。それぞれの痛み、そして強さや弱さに直面しながら、悩めるレゴシの青春がいま始まった
