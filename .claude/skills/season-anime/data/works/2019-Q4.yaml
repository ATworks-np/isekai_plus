    synopsis: 2014年、突如現れた異星人は、人類に対して「交易」を要求。彼らが石灰岩の対価として地球にもたらしたのは、意識制御型汎用ロボット「エグゾフレーム」だった。戦闘機よりも戦車よりも銃よりも安価で、誰でも簡単に乗りこなすことができる「エグゾフレーム」は、またたくまに拡散し、世界を変えていく――。＜異星人の交渉音声＞「現在、すべての電波帯域に、五種類の言語で呼びかけています。我々は政治干渉も文化交流も望みません。ただ通商のみを希望します。石灰岩1,000キログラムにつき1つ、我々のテクノロジーの産物を提供します。国家、民族、思想、その他あらゆる差違について我々は区別いたしません。すべての地球人類に、平等に、均等に、この交換条件を提案いたします」
