    synopsis: 持続可能な戦争（サスティナブル・ウォー）がもたらす新たな支配種“ポスト・ヒューマン”再び組織される草薙素子率いる公安９課、通称“攻殻機動隊”2045年。全ての国家を震撼させる経済災害「全世界同時デフォルト」の発生と、AIの爆発的な進化により、世界は計画的且つ持続可能な戦争“サスティナブル・ウォー”へと突入した。だが人々が、AIによる人類滅亡への危機を日常レベルで実感できるまでには衰退の進んでいない近未来――。内戦・紛争を渡り歩き、廃墟が横たわるアメリカ大陸西海岸において、傭兵部隊として腕を奮っている全身義体のサイボーグ・草薙素子とバトーたち元・公安9課のメンバー。電脳犯罪やテロに対する攻性の組織に所属し、卓越した電脳・戦闘スキルを誇っていた彼女らにとって、この時代はまさにこの世の春である。そんな草薙率いる部隊の前に、“ポスト・ヒューマン”と呼ばれる驚異的な知能と身体能力を持つ存在が突如として現れる。彼らは如何にして生まれ、その目的とは。大国間の謀略渦巻くなか、いま再び“攻殻機動隊”が組織される――。
