      width: 453
      height: 640
    synopsis: “人類”と“獣人”が共存する社会。獣化遺伝子・獣因子を持つ獣人たちは、近現代の自然の消失により住処を追われ、人類の前に姿を現した。各国が共存のための対応に追われるなか、日本では獣人が獣人らしく生きるための獣人特区『アニマシティ』が設置される。それから10年の月日が経ち、『アニマシティ』に17歳のタヌキ獣人・影森みちるがやってくる。普通の人間だったが、ある日突然タヌキ獣人になった彼女は「ここなら自由に生きられる！」と喜ぶが、ひょんなことからオオカミ獣人・大神士郎と出会い、『アニマシティ』にもこの街にしかない危険がたくさん潜んでいることを知る。頑固な性格で過剰に人間を嫌う士郎とは衝突を繰り返しながら、みちるは怪しい女のマリーや、市長のロゼ、獣人生活協同組合のジェムとメリッサなど、たくさんの人々に出会い、それまで知らなかった“獣人”たちの生き様を学んでいく。そして、タヌキの少女とオオカミ男に生まれた絆は、やがて世界を変える鍵になる。なぜ、みちるは獣人になってしまったのか。その謎を追ううちに、予想もしていなかった大きな出来事に巻き込まれていくのだった。
