    synopsis: この世界は【ミミナシ】と呼ばれる謎の生命体により、人類はその生活を脅かされていた。 ミミナシに対抗することができるのは、戦闘メカ【イクイップメント】とプラグインし、操ることのできる【祈手（プレイヤー）】という能力者のみ。 スクラップの街「リバチェスタ」で暮らす少年・エコヲは、10年前、ミミナシと祈手（プレイヤー）との大きな戦い【フェス】で伝説を残した祈手（プレイヤー）・ジミを目撃して以来、密かに祈手（プレイヤー）に強い憧れを抱きつつも、燻り生きてきた。 しかしある日、いつものようにゴミ山で採掘仕事に励んでいたエコヲは、記憶喪失の少女・ミュウと出逢う。 腰にインプットジャックが空いた彼女もまた、祈手（プレイヤー）の一人だった。 やがて二人は、彼女の出自や、フェスの中心人物でありながら謎多き人物・ジミを追う旅に出る──
