      つぎつぎと現れるゴーハ社からの刺客(しかく)や、ゴーハ６小の重騎デュエルクラブとの闘いを繰り広げる遊我たち。
      この闘いを通じてラッシュデュエルの楽しさが、世界中へ広がっていく！
      するとゴーハ社は突然、ゴーハ社が主催する大会「ゴーハ・ラッシュデュエル・チームバトルロイヤル」の開催を宣言する!!
