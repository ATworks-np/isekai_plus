    synopsis: 本のためなら巫女になる！「三度の飯より本が好き」な女子大生・本須麗乃が兵士の娘・マインとして転生した世界には、本がなかった。平民は識字率が低く、羊皮紙で作る本は高価でお貴族様のもの。そこでマインは決意する。「本がなければ作ればいい！」試行錯誤の末、商人のベンノと出会い、商人見習いになるために植物の紙を完成させるが、マインの体は「身食いの熱」に蝕まれていた。貴族が魔力を持つこの世界で、時に魔力を宿して生まれる平民がいる。それが「身食い」。増え続ける魔力を吸い取る魔術具がなければ、生き長らえることはできない。そんな時、洗礼式で神殿の図書室を発見したマインは、巫女見習いになりたいと神殿長に直談判する。すったもんだの末、マインは魔力を奉納する青色巫女見習となることが決まった。しかし、本来、貴族に与えられる「青の衣」を平民上がりのマインが纏うことを快く思っていない者も多く、マインの行く手は前途多難。問題児ばかりの側仕え、神殿の階級社会……。麗乃時代とも下町時代とも異なる神殿の常識がマインの前に立ちはだかる。果たして、マインが心ゆくまで読書できる日は来るのか！？　そして、マインは本を作ることができるのか！？
