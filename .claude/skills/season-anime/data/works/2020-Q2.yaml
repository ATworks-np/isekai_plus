    synopsis: 文豪により綴られてきた数多の本。独創的な世界観や感情揺さぶる物語が記されたそれは文学として人々の心を彩り、世界を豊かにしてきた。しかし、そんな本を黒く染める異形のモノ達が現れる。それは、文学に対する負の感情から生まれた“侵蝕者”と呼ばれる存在だった。本を侵し、この世界から消し去ることを目的とする侵蝕者に対抗できるのは“アルケミスト”の力で転生を果たした文豪達のみ。文豪は侵蝕された本に潜り、侵蝕者を討ち果たすことで本を救う。全てはこの世界の文学を守るため。これは、魂を込めて作品を創ってきた者達が綴る、新たなる文豪譚——
