    synopsis: かつてこの世界には〈光の巨人〉と呼ばれる存在がいた。やがて〈光の巨人〉はその役目を終え、遠い宇宙にある自らの故郷へと帰還し、同化していた地球人はそれまでの記憶を失うことで自らの在るべき場所へと戻っていった。ウルトラマンの存在は過去のモノとなり、科学特捜隊日本支部もその役割を終えて、光の巨人記念館へとその姿を変えていた。 早田進次郎は多感な思春期を過ごす高校生。だが彼は、自分が驚異的な跳躍力や頑丈な肉体といった人間離れした"普通"ではない力を持っていることを自覚していた。 そんなある日、進次郎は父・早田進が、かつてウルトラマンであったことを知る。 そしてウルトラマン無き地球に暗躍する宇宙人たちの存在も。 進次郎は、秘匿組織として健在する科学特捜隊の井手によって開発されたウルトラマンスーツを着用できる数少ない適合者だった。 「単刀直入に言おう――キミにウルトラマンになってもらいたい」
