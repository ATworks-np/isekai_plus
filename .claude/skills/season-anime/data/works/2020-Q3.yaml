    synopsis: 無職で彼女もいないごく普通の青年・好人（ヨシヒト）は、自分が住んでいる一軒家の空き部屋を貸すことで生計を立てていた。 彼は仕事探し中にちょっぴりおバカなおてんば娘・劉莉莉と出会う。彼女が家を探していることがわかると、さっそく好人は莉莉に空き部屋を紹介。お部屋を案内していると、２人は突如現れた吸血鬼・ヴィヴィアンに襲撃される。さらに莉莉は人狼へと変身･･････気が付くと異常生物たちとの謎の共同生活が開始していたのだった。 ひと癖やふた癖もある異常生物の入居者たちとともに、異世界と現世を行き交ってはさまざまな異文明に遭遇し、挙げ句の果てには宇宙にまつわる謎にまで直面することとなり･･････。 果たして、好人は次から次へと発生する無理難解な事件に立ち向かうことができるのか！
