    synopsis: 二千年の時を経て蘇った暴虐の魔王――だが、魔王候補を育てる学院の適性――《不適合》!?人を、精霊を、神々すらも滅ぼしながら、延々と続く闘争に飽き、平和な世の中を夢見て転生した暴虐の魔王「アノス・ヴォルディゴード」。しかし二千年後、転生した彼を待っていたのは平和に慣れて弱くなりすぎた子孫たちと、衰退を極めた魔法の数々だった。魔王の生まれ変わりと目される者を集め教育する“魔王学院”に入学したアノスだが、学院は彼の力を見抜けず不適合者の烙印を押す始末。さらには、伝説の魔王は自分とはまったくの別人という事になっていた。誰からも格下と侮られる中、ただひとり親身になってくれる少女ミーシャを配下に加え、不適合者（魔王）が、魔族のヒエラルキーを駆け上がる!!「摂理だろうと運命だろうと、奇跡だろうと、俺の眼前ではただひれ伏し消えるのみだ。」
