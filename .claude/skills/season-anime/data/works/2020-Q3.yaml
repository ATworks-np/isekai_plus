    synopsis: 再び「弾丸（願い）」は込められた――彼らの前に立ちはだかる過去とは？乾十三は「拡張者（エクステンド）」と呼ばれる身体機能拡張処理を施した者たちがあふれるこの街で、彼らに関する問題を処理する稼業を生業にしている。「亡霊」騒ぎの解決後、「乾相談所」は落ち着きを取り戻したかに見えた。だが、突如何者かに襲撃されてしまう。それは、反拡張技術を掲げるテロ組織・スピッツベルゲンだった。彼らに拉致されたクリスの救出に十三が向かうと、ヴィクター・シュタインベルグという男が立ちはだかる。彼こそメアリーが行方を追い続けていた彼女の実兄だった。時を経て、十三、メアリー、ヴィクター、再び3人の因縁が交錯する。ガンスレイブユニットの秘密、ベリューレンの思惑、そして、鉄朗の運命も大きく動き始める第2期、スタート！
