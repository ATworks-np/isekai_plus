    synopsis: 「これはオレのキャップカクメイだぁぁぁぁっ！」 ボトルマン・・・それは、世界に革命をもたらした、新たなエンターテインメイント！　仮想空間であるドリンクワールドでは、ボトルマンを使った真剣勝負「ボトルバトル」が繰り広げられている！ 本作は主人公・甲賀コータが世界一のボトルキングになるため、相棒となるボトルマン『コーラマル』と出会い、様々なライバルたちとの「熱いバトル」、そしてペットボトルテーマならではのシュワッ！とした「爽快感」を味わうことができるWEBアニメです。 予測不能なバトルで常にクライマックス状態でストーリーは展開し、登場キャラクターの魅力やボトルマンの世界観、ボトルバトルの面白さを発信していきます。
