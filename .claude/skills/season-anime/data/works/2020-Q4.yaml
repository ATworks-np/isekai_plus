    synopsis: お笑い芸人を目指す4人の若き乙女たち19歳（北風ふぶき、凩まふゆ、新谷りん、朝生祇なゆた）は、日夜バイトに明け暮れながらも一生懸命にネタの練習に励んでいる。笑いでみんなを幸せに！　みんなの幸せで私たちも幸せになる、というきれいごとを大義名分に頑張るも、なかなか芽が出ない4人だった。そんな4人には「お笑い界の武道館」、なんばグランド花月の舞台に立つ！　という目標があった。 しかし、とりあえずまずは身近なところからいっとこか、ということで、東京渋谷の無限大ホールのいっちばん最下層、ファームクラスの舞台に立つことを目指して頑張っていくことにした。 彼女たちのライバルであり（勝手に彼女たちが思っているだけ）、まふゆの妹のまなつとその幼なじみの金成かなえの高校の先輩でもある現役女子高生芸人「JKクール」を目標に、まなつとかなえの女子高１年生組も芸人を目指し始める！ 総勢８人、４組による、お笑い日常奮闘記。 “牛乳は吹き出す！笑いは隠せない”
