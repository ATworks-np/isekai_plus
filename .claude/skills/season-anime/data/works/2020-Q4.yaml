    synopsis: 2095年10月31日。未観測の戦略級魔法によって、 一国の軍事都市と艦隊が消滅した。《灼熱のハロウィン》と呼ばれたこの日から、世界は新たな戦略級魔法師の登場に震撼することになる。 中でも「世界最強の魔法部隊」であるスターズを擁する北アメリカ合衆国（USNA）は危機感を募らせ、秘密裏に未観測の戦略級魔法と、 その魔法を使用した魔法師の正体を暴こうと躍起になっていた。 それから約二ヶ月後の12月24日。街がクリスマスの飾りとイルミネーションで賑わっているなか、達也たちは交換留学でアメリカに行くという雫の送別会に集まっていた。 雫がアメリカに行く期間は三ヶ月。 雫によると、 彼女に代わって第一高校に来るのは、 同い歳の女の子だという。
