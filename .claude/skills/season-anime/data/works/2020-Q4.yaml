      width: 453
      height: 640
    synopsis: |-
      網走監獄で繰り広げられた激しい攻防戦の末に、
      離れ離れになってしまった「不死身の杉元」こと杉元佐一とアイヌの少女・アシ(リ)パ。
      アシ(リ)パは「脱獄王」の白石由竹とともに、
      キロランケと尾形百之助によって父の足跡が残る場所・樺太に連れ去られていた。
      アイヌの金塊を強奪した張本人である「のっぺら坊」が死んだ今、
      その秘密を解けるのは娘のアシ(リ)パのみ。キロランケの目的は、
      彼女を連れてかつての仲間である極東ロシアのパルチザンと合流することにあった。
      一方、第七師団の鶴見中尉と手を組んだ杉元と谷垣源次郎は、
      アシ(リ)パを捜索するための先遣隊に志願。
      月島軍曹と鯉登少尉を同行者として樺太を目指す。
      北海道よりさらに北に位置する極寒の地で、
      それぞれの旅路を進む杉元とアシ(リ)パを待ち受けるものとは!?
      新たなサバイバルが幕を開ける!
