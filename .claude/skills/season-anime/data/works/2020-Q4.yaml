    synopsis: 東京、池袋の西口公園。通称“池袋ウエストゲートパーク”近くにある果物屋の息子・真島誠（マコト）は、ヤクザ絡みの犯罪やギャングの縄張り争いなど、警察では手出しできない難事件を次々に解決する“池袋のトラブルシューター”と呼ばれていた。 有象無象な人間が集まる池袋の中で、組織に属さず、誰にでもフラットに付き合うマコトの元には、常に危険で刺激的な依頼が舞い込む。 「誰にでも優しい街、愛と平和の池袋。 …そう、池袋は最高だ」 今日も池袋の秩序を守っていた彼のもとに、街の平和を揺るがす厄介な事件が持ち込まれる――。
