    synopsis: |-
      迷宮都市オラリオの中心に座するダンジョン――数多の怪物（モンスター）が産み落とされるこの大穴は、未だ人類が想像し得ない『未知』を無数に孕んでいる――

      女神ヘスティアと冒険者ベル・クラネルが【ヘスティア・ファミリア】を結成し、はや数ヶ月。幾人かの友を加え、彼らのファミリアは急速に成長の途を辿り、都市の注目を集めていた。

      突如彼らのもとに舞い込んできた『未知』――それは、異端児（ゼノス）と呼ばれる言葉を解する怪物（モンスター）だった――

      『未知』は混乱を誘いざない、常識をも破壊し苦悩と葛藤を喚び起こす――その先にある『可能性』を覆い隠してしまうほどに……

      激動のオラリオで、ベルに決断の時が迫る――これは、少年が歩み、女神が記す、――【眷族の・物語（ファミリアミィス）】――
