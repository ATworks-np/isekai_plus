    synopsis: 正和63年10月。 大廃線により鉄路の殆どが失われてしまった国――日ノ本。 九洲は隈元県御一夜市。疲弊しきった経済の立て直しを蒸気機関車8620とそのレイルロオド・ハチロクとを主役に据えた観光振興により見事成功させ鉄道復興の聖地となった同市はさらなる復興への機運や全国の鉄道事業者・まいてつたちの交流を盛り上げるべく、『第一回まいてつ祭』の開催を企画する。 鉄道車両の運転制御用人型モジュール「レイルロオド」達もそれぞれのマスター達につれられ全国から集う。人間達の連日の会議に刺激され、「自分たちも何かをしたい」と意気投合した彼女たちは、有名レイルロオド「すずしろ」を中心として「レイルロオドサミット」を主催。駅前の「cafe亜麻色」に集合し、「まいてつ祭」へ更なる彩りを加えるべく知恵を絞っていく。
