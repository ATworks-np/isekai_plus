    synopsis: この世の全ての物、万物には神が宿っている。戦う神「ゴウリキシン」と、「親方」と呼ばれる人間が音楽に乗せて行う力比べ、太古から続くその戦いは…『カミズモウ』と呼ばれていた――。 音楽好きの小学生・夢幻ダイは、ある日、空から落ちてきた石の神・ゴウテツと出会う。カミズモウでの優勝を目指し、一緒に戦うパートナーである「親方」を探していたゴウテツは強引にダイに迫る。 突然の展開に戸惑うダイの前に、さらに謎の存在・「ジャリキシン」達が立ちはだかる！「何が何だかわからないけど…やってやるよ、カミズモウ！」決意したダイの前に「神太鼓」が現れ、光に包まれたダイは「親方」へと変身する…！ 叩いて！ノッて！ぶちかませ!!　目指せ最強のゴウリキシン！ カミズモウ！はっけよーい、のこった!!
