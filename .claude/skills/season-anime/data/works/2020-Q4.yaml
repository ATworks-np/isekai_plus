    synopsis: とわ、せつな、もろはは、妖怪と人間の血を引く半妖の少女たちだ。 幼い頃、森の火事に巻き込まれ、離ればなれになった双子の少女、とわとせつな。とわは、時代樹の時空を越えるトンネルをくぐり抜け、戦国時代から現代へとタイムスリップ。かごめゆかりの日暮家の娘として育てられ、武道に長けた女子中学生に成長した。 一方、戦国時代に残された妹のせつなは、妖怪退治屋のお頭となった琥珀の下で妖怪退治を生業にしていた。もろはは、かごめと犬夜叉の娘。賞金稼ぎとして「化け殺しのもろは」の異名を取り、やはり妖怪退治に明け暮れている。 とわとせつなが別れ別れになってから、10年。時代樹の時空を越えるトンネルが再び開かれた。現代に現れたせつなと再会するとわだったが、せつなは何故かとわのことを忘れてしまっていた。 せつなと共に､現代にやって来たもろはも加わり、とわたち「半妖の夜叉姫」が、現代を、そして戦国時代を、縦横無尽に暴れ回る！
