    synopsis: 悠々自適な引きこもりライフを満喫する美少女ユナは、VRMMORPG『ワールド・ファンタジー・オンライン』の廃ゲーマー。 ある日いつものようにログインしてみると、なにか普段と様子が違う。 もしかして......ここってゲームの中？　それとも異世界？ そして、その地に降り立ったユナの装備は『クマの服』『クマの手袋』『クマの靴』で固められていて――んん?　くま......？　クマ......？　熊......？　ベアー......？ 「なんじゃこれはーーーーーーっ!?」 クマっ子、爆誕！ しかもこのクマ、ただのクマじゃない。世界最強クラスの魔法とスキルを秘めた、とんでもなくスーパーなクマだったのだ！ そんな、世界征服だってできちゃいそうな強大な力を手にしたユナの目的――それは!? この世界でも、ひたすら楽しく自由気ままに生きること！　最強無敵なクマっ子による、クマな冒険とクマな日常の物語、始まります♪
