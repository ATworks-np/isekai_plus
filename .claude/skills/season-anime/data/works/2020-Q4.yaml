    synopsis: 体育館の二階。ここが私たちのお決まりの場所だ。今は授業中。当然、こんなとこで授業なんかやっていない。　ここで、私としまむらは友達になった。好きなテレビ番組や料理のことを話したり、たまに卓球したり。友情なんてものを育んだ。　頭を壁に当てたまま、私は小さく息を吐く。　なんだろうこの気持ち。昨日、しまむらとキスをする夢を見た。　別に私はそういうあれじゃないのだ。しまむらだってきっと違う。念を押すようだけど、私はそういうあれじゃない。　ただ、しまむらが友達という言葉を聞いて、私を最初に思い浮かべてほしい。ただ、それだけ。
