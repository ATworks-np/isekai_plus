      width: 453
      height: 640
    synopsis: 東京――『暁特区』。 国が新たに打ち立てた経済特区予定地で、大企業『サキシマホールディングス』に行政権が譲渡された。特区内でのみ適用される課税軽減などの利権を巡り、敵対企業が陰謀を巡らせた結果、大型暴動・暁抗争が勃発。内政は荒れ果て、サキシマホールディングスも解体。暁特区は国の自治も及ばない不管理地域となる。 その無法地帯となった街を守る男たちがいた。 「ディヴァイン・タトゥー」という、荒ぶる神獣の力を封じ込めたタトゥーを持つ人間、通称『スカード』はそれぞれ固有の特殊能力と、全ての攻撃を無力化するほど――銃弾が身体に届く前に弾け飛び、刀は砕ける――の防御力を与える。 タトゥーの能力を生かし、街を守る「ヘリオス」、組織を守る「アルテミス」、秩序を守る「公安特務」たちが新興勢力となり、暁特区に鎮座する。 未だ日常的に、微力ではあるが抗争が続く中で、それでもなお彼らは自らの「正義」を貫く。 これはそんな激動の中を生きる彼らの、当たり前の日常を描いた物語である。
