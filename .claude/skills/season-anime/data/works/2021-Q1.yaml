    synopsis: これも、ある冬の日の物語。山梨の女子高校生である志摩リンは、愛車の原付に乗って一路浜名湖を目指していた。大晦日に始めた、久しぶりのソロキャンプ。山梨を出発して静岡県は磐田へ。年越しを磐田で迎えて、今日はその三日目。かなり距離の長い運転だが、なんだか楽しい。そんな折、立ち寄った海辺でふと思うリン。「やっぱり、一人のキャンプも好きだ私」一方、そんなリンの思いを知ったなでしこにも、新しい気持ちが芽生えていた。みんなとのキャンプは大好き。ご飯を作って、喜んでもらうのも、嬉しい。だけれど。「私もリンちゃんみたいに、ソロキャンプやってみたいな」なでしことリン、二人の出逢いから始まったアウトドア系ガールズストーリーの第二幕がいま、上がる。
