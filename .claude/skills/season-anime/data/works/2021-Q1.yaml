    synopsis: 孤児として育った10歳の少女・アーヤは、なんでも思い通りになる子どもの家で、何不自由なく暮らしていた。 そんなアーヤの前にあらわれたのは、ベラ・ヤーガと名乗るド派手な女と、マンドレークという長身男の怪しげな二人組。アーヤは、彼らの家に引き取られることになる。 「わたしは魔女だよ。あんたをつれてきたのは、手伝いが欲しかったからだ」 「おばさんが私に魔法を教えてくれるなら、おばさんの助手になってあげる」 魔法を教えてもらうことを条件に、ベラ・ヤーガの助手として働き始めるアーヤ。でも、こき使われるばかりで、ひとつも魔法を教えてもらえない。 生まれてはじめてまわりが自分の思い通りにならないアーヤは、魔法の秘密を知る使い魔の黒猫・トーマスの力を借り、反撃を始める……！ 私のどこが、ダメですか？
