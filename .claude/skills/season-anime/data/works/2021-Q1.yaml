    synopsis: ある日突然、人気オンラインゲーム『エルダー・テイル』の世界に、数万人のプレーヤー『冒険者』が閉じ込められた！　モンスターや魔法がリアルに存在する異世界で人々は混乱し、冒険者の街『アキバ』は秩序を失っていた― 人づきあいの苦手な青年・シロエもそんな冒険者のひとりだったが、意を決したシロエは盟友の直継、アカツキ、にゃん太らとギルド『ログ・ホライズン』を結成。さらに、持ち前の知略を武器に冒険者の結束を呼びかけ、自治組織『円卓会議』を立ち上げ、街に平和と安定を取り戻す。 この『円卓会議』を中心に、ゲーム世界のもともとの住人である『大地人』との交流も進み、筆頭貴族コーウェン家の令嬢・レイネシアがアキバに赴任するなど、冒険者と貴族や商人、一般市民などとの外交や取引も活発化していく。 しかし、冒険者たちが異世界に飛ばされた『大災害』から１年が過ぎ、つかの間の繁栄を享受していたアキバの街には、新種のモンスター『典災』の襲来や東西の貴族どうしの権力闘争、冒険者間の格差・思惑の違いなど、多くの火種がくすぶり続けていた。 そして、ついに冒険者の結束の象徴『円卓会議』に決定的な危機が訪れる……。
