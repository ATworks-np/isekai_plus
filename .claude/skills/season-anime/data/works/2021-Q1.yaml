    synopsis: |-
      人に心がある限り、悩みを抱える者がいる。
      そこに“怪”が入り込み、身体に奇妙な症状を引き起こす。

      “怪病”と呼ばれるその病は、人知れず、だが確かに存在している。
      現代医学では治す手立ての見込めないその病に、弟子と共に立ち向かう医者がいた。

      その名はラムネ。

      風貌は決して医者には見えず、どんな時も自由にふるまい、
      さらに口まで悪い。

      けれど
      ひとたび怪病に向き合えば
      患者たちが心の底に隠していた悩みの原因を、瞬時に暴いて治療する。
      そしてその先には――。
