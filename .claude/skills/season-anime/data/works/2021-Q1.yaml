    synopsis: いまだ人と、人ならざるものの世界が、分かたれてはいなかった古の物語。リュドシエル率いる〈光の聖痕（スティグマ）〉と魔神族による聖戦は、ブリタニア全土を巻き込み激化。3つの戒禁を取り込んだエスタロッサは暴走し、エリザベスを連れ去った。キング、ゴウセル、ホーク、そしてサリエルとタルミエルはその後を追い、天空演舞場跡へとたどり着く。一方、キャメロット城では、新たなる魔神王になると決めたメリオダスが、暗黒領域の繭の中で着々と戒禁を取り込み続けていた。メリオダスの魂を救うために自ら煉獄へと身を投じたバンは、常人では決して生きられない瘴気の中を彷徨う。明かされるエスタロッサの正体。決壊するゴウセルの禁呪。数多に絡み合う思惑の行く先は。真の敵は誰なのか。討つべき者は何なのか。“永遠の生”と“永劫の輪廻”という運命に抗い、3,000年の旅を続けてきた、メリオダスとエリザベス。二人の旅路は、どのような結末を迎えるのか──。
