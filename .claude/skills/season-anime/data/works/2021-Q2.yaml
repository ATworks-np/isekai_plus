    synopsis: |-
      著：むらさきゆきや×イラスト：鶴崎貴大による、累計300万部突破の人気ライトノベルが、待望の続編アニメ化！

      ゲーム内の姿で異世界へと召喚されてしまったディアヴロ（本名・坂本拓真）は、「私こそが召喚主」とお互いに主張するシェラ、レムの2人と、ゲームにそっくりな異世界での日々を過ごしていた。

      エルフの王国の精鋭部隊と戦ったり、魔族と戦ったり、復活した魔王クレブスクルムを従わせたり。

      「我はディアヴロ。異世界の魔王であるッ！」と魔王演じながら、強敵に立ち向かっていくディアヴロは、ときには美少女たちに翻弄されつつも、確かな信頼関係を築き上げていた。

      ──そんなある日。湖東の森に出かけたディアヴロたちは、ボロボロになったひとりの少女と出会う。「か、神様……、なのですか？」それは聖騎士に追われた、教会の大主神官・ルマキーナだった……！

      コミュ力ゼロの魔王(演技)が、絶対的な強さで突き進む！　異世界魔王と召喚少女たちが繰り広げる"夢いっぱいの異世界冒険譚"、再び！
