    synopsis: |-
      将来立派な絵師になる夢をもつ、高校１年の岡倉てんこりん。実のところ、気持ちとは裏腹に、やる気ゼロ、才能ゼロ、サボってばかりのダメダメ女子高生だった…。
      そんな彼女の前に突如現れたのが“風神雷神図屏風”の雷神。「あんたの夢をかなえに来たでー」と言って雷神が呼び出したのは、尾形光琳、高橋由一、狩野永徳、などなど…歴史に名を残す日本美術界のスター絵師たち。時空を超え、「夢をかなえるためのとっておきの秘訣」を次々とてんこりんに伝授していく。
      目指すはデッサン甲子園の優勝！果たして、てんこりんは、自らを変えて、夢をかなえることができるのか？！
