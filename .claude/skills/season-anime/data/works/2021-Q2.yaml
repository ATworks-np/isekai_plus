    synopsis: ギアーデ帝国が開発した完全自律無人戦闘機械〈レギオン〉の侵攻に対応すべく、その隣国であるサンマグノリア共和国が開発した無人戦闘機械〈ジャガーノート〉。 だが、無人機とは名ばかりであり、そこには“人”として認められていない者たち――エイティシックス――が搭乗し、道具のように扱われていたのである。 エイティシックスで編成された部隊〈スピアヘッド〉の隊長である少年・シンは、ただ死を待つような絶望的な戦場の中で、ある目的のために戦いを続けていた。 そこに新たな指揮管制官〈ハンドラー〉として、共和国軍人のエリート・レーナが着任する。彼女はエイティシックスたちの犠牲の元に成り立つ共和国の体制を嫌悪しており、“人型の豚”として蔑まれていた彼らに人間として接しようとしていた。 死と隣り合わせに最前線に立ち続けるエイティシックスの少年と、将来を嘱望されるエリートの才女。決して交わることがなかったはずのふたりが、激しい戦いの中で未来を見る――。
