    synopsis: 時は大正十二年、東京の夜に其の者どもは現れた。彼らは闇に紛れて人の生き血を啜る吸血鬼と呼ばれ、古の時代よりこの世界に隠れ住んでいた。それらを取り締まるべく陸軍内部に創設されたのが第十六特務隊、通称『零機関』である。中島中将は近代化著しい列強諸国の情報戦に対抗するためにこの部隊を創設したのだが、目下のところ、零機関の任務は東京の闇に潜む吸血鬼事件の対応にある。それに当たるのが――、人類最強の前田義信大佐。国内最強クラスの吸血鬼にして新人の栗栖秀太郎。インテリジェンスなランク外の山上徳一。江戸の昔から吸血鬼を続けているスワ。老いることのない脳を喜ぶマッドサイエンティストのタケウチ。――以上、零機関の実行部隊の面々である。増え続ける吸血鬼たち。そして裏に暗躍する影と、謎の人工血液「アスクラ」の存在。この事態を冷ややかに見つめるのは、齢300歳を越えているにも拘らず、子供にしか見えないＳクラスの吸血鬼デフロットであった。弱き者、汝の名はヴァンパイア――。零機関が今、大正ロマンの夜を駆け抜ける。
