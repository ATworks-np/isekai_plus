    synopsis: 紀元前、中国西方の秦国（しんこく）に、今は亡き親友と夢見た「天下の大将軍」を目指す若き千人将・信（しん）がいた。 かつて王都で起きたクーデターに巻き込まれ、現在の秦王・嬴政（しんおう・えいせい）と運命的に出会った信は、自身の夢をかなえ、嬴政が目指す「中華統一」をともに成し遂げるため戦場に身を置くことになる。 戦地で散った師・王騎（おうき）の死を乗り越え、蒙恬（もうてん）や王賁（おうほん）ら同世代の隊長たちと切磋琢磨しながら、着実に夢への階段を上ってゆく信。一方、嬴政もまた、壮大な目標に向け、相国・呂不韋（りょふい）から国の実権を奪い返すべく宮廷内での勢力拡大に力を注ぐ。 そんな中、軍事最重要拠点のひとつ山陽（さんよう）の攻略に成功した秦国は、これにより中華統一へ一歩近づくこととなった。だが、七国の勢力図を塗り替えかねないこの一手に危機感を抱く趙国（ちょうこく）の天才軍師・李牧（りぼく）は、楚国（そこく）の宰相・春申君（しゅんしんくん）を総大将に、楚、趙、魏（ぎ）、燕（えん）、韓（かん）、斉（せい）の六国による合従軍を興し秦国への侵攻を開始する！ 未曾有の危機に、秦国は持てるすべての武力を結集して、合従軍を迎え撃つ!!
