    synopsis: 超常能力“個性”を持つ人間が当たり前の世界。憧れのNo.1ヒーロー・オールマイトと出会った“無個性”の少年・緑谷出久、通称「デク」は、その内に秘めるヒーローの資質を見出され、オールマイトから“個性”ワン・フォー・オールを受け継いだ。デクはヒーロー輩出の名門・雄英高校に入学し、“個性”で社会や人々を救ける“ヒーロー”になることを目指し、ヒーロー科1年A組のクラスメイトたちと切磋琢磨する毎日を過ごしていた。 「プロヒーロー仮免許」取得とプロヒーローインターン活動。そこでの少女・エリとの出会いと、そのエリを恐るべき計画に利用する「死穢八斎會」の若頭オーバーホール、エリを救うための死闘。エリや雄英生徒の皆を笑顔にするための文化祭。新たなヒーローランキングの発表…。慌ただしい日々の中、デクは着実に成長を続けていく。その一方で、死柄木弔率いる敵＜ヴィラン＞連合もその力を蓄えていた。 “最高のヒーロー”を目指すデクの次なる試練、それは同じくヒーローを目指す1年B組との、互いのプライドを懸けた対抗戦！体育祭以来の直接対決に、生徒たちの意気は上がる。そんな中、デクの中で新たな“何か”が目覚めようとしていた―。
