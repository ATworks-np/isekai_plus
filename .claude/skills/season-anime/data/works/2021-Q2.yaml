      力を合わせて温氏を討伐することに成功する。
      夷陵老祖である魏無羨は、「射日の征戦」で貢献を果たしたが、
      彼の修めた鬼道は強大な力を持つがゆえに、人々に恐れられ、謗られ、やがてその身の破滅を招いてしまう。
      そして十三年後。
      死んだはずの魏無羨は呪術によって世に蘇り、かつての友、
      姑蘇藍氏の藍忘機、義兄弟である雲夢江氏の江澄と再会する。
      しかし、過去の謎は未だ消えず、世間は再び彼を疑い始めるのだった。
