    synopsis: 流拓馬と山岸獏は、埋立地のゴミの山の上に立っていた。 目の前には、上空から墜落したロボット＝ゲッターD2の機体がある。 世界は荒廃していた。 19年前――。世界は、“蟲”のような謎の敵の襲撃を受ける。 その戦いの中で、主要都市は壊滅状態に陥ってしまう。 各国は戦力をシベリアに集結させ、敵との決戦に挑んだ。 流竜馬たちの乗るゲッターロボも、その中にあった――。 日本、現在。浅間山麓にある早乙女研究所の指令室で、神隼人は戦況を見つめていた。 そうだ、戦闘はまだ続いているのだ。 その隼人のもとに報告が入る。墜落したゲッターD2が動き出したのだ。 モニターに映った見知らぬ若者は「流拓馬」と名乗る。 あの時、ゲッターロボとともに決戦に向かった流竜馬の息子だった。 拓馬は、ゲッターD2を一気に上空へ飛ばし、敵との交戦に入った。 隼人は待機していたパイロット、カムイ・ショウに命じる。 「ゲッターアーク、出撃！」 新たなゲッターロボ、ゲッターアークの機体が大空を切り裂いていく。 ゲッターアークの戦いは、ついに始まった。 この戦いの果てに待っているのは、生存か、消滅か――。
