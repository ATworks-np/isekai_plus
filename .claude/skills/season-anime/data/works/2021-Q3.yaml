    synopsis: 私立結ヶ丘女子高等学校、表参道と原宿と青山という3つの街のはざまにある新設校に初めての入学生がやってきた。 歴史もない、先輩もいない、名前も全く知られていない、ないない尽くしの新設校で、澁谷かのんを中心とした5人の少女たちは"スクールアイドル"と出会う。 私、やっぱり歌が好き！ 歌でなにかを……叶えたい！！　まだ小さな星たちの、大きな想いが重なっていく――。 全てが真っ白で、無限の可能性を持つ彼女たちとの「みんなで叶える物語（スクールアイドルプロジェクト）」。 はばたけ！私たちのラブライブ！
