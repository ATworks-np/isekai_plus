    synopsis: 「――見えた？」 くくるは、そっと、がまがま水族館のヒミツを教える。 「ここではときどき、『不思議なもの』が見えることがある」 夏の日差しが降り注ぐ、沖縄。 那覇市内からバスに乗り1時間あまり揺られた先に、その水族館はある。 沖縄本島南部、美しいビーチのすぐ脇にある、ちいさな、すこしさびれた「がまがま水族館」。 18歳の女子高生・海咲野くくるは、そこでまっすぐ、ひたむきに仕事をしていた。 祖父に替わって「館長」を名乗るほど、誰よりもこの水族館を愛している。 ある日くくるは、水槽の前で長い髪を揺らしながら大粒の涙をこぼしていた女の子・宮沢風花と出逢う。 風花は夢だったアイドルを諦め、あてもない逃避行の先に、東京から沖縄へやってきたのだ。 がまがま水族館に流れる、ゆっくりとした、やさしい時間。 居場所を求めていた風花は、「水族館で働きたい」と頼み込む。 出会うはずのなかったふたりの日常は、こうして動き始めた。 しかし、がまがま水族館は、「不思議」と一緒に、「閉館の危機」という大きな問題を抱えてもいた。 迫りくるタイムリミットを前に、ふたりは立て直しを目指して動き始める。 かけがえのない場所を、あたたかな寄る辺を、守るために。
