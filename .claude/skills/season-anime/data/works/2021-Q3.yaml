    synopsis: 3000万年前、世界を恐怖に陥れた闇。しかし、その闇は光の巨人の手によって遠く宇宙に封印された。力尽き、赤き星で眠りにつく光の巨人。そして時は流れ――。地球平和同盟TPUがエキスパートチームGUTS-SELECTの編成を急ぐ中、マナカ ケンゴは開拓された火星で植物学者として平穏に暮らしていた。しかしその暮らしは、ある日突然終りを告げることになる。超古代で封印された闇が再び息を吹き返したのだ！ 火星の街が謎の怪獣に蹂躙される中、ケンゴは運命に導かれた出会いを果たすこととなる。そう、それは眠りについていた光の巨人との出会い。ケンゴとこの光の巨人との出会いは彼の、そして地球の運命にどう影響を与えていくのか。悠久の時を超えて蘇る光の巨人。その名は――ウルトラマントリガー！
