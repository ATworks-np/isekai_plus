    synopsis: 人間の脳は容量７０％を使用していないといわれている。 人間の持つ不思議な力は、この部分に秘められていると考えられている。 その使用されることのない脳の７０％はこう呼ばれることがあるーー 『ＮＩＧＨＴ ＨＥＡＤ（ナイトヘッド）』 ある森の中。二人の男が目を覚ます。 超能力を持つがゆえに社会から疎外され、 １５年もの間、超能力研究所に隔離されて育った兄弟??霧原直人・直也。 彼らは、自分たちが外に出られたということは、 かつて研究所所長・御厨恭二朗に言われた、能力者が受け入れられる社会が到来したということだと、希望に胸を膨らませる。 しかし、外の世界は、精神エネルギーの存在は完全否定され、超能力はもとより、 超常現象を扱った書物や映像などの創作物すらも思想統制された２０４１年の東京だった。 そんな物理主義を掲げる国家の安寧のため危険思想を取り締まる、国家保安本部。 その精鋭たる特務部隊に、二人の男の姿があった。 幼くして両親に棄てられ、保安隊に預けられた兄弟??黒木タクヤ・ユウヤ。 超常現象を偽物と信じ、思想犯罪者を追う日々に疑問のない彼らは、 ある日、作戦行動中に、謎の少女・双海翔子に出会う。 「結界は破られた」 タクヤ・ユウヤは、翔子のその言葉に導かれるように、 居場所を求めて放浪する直人・直也に邂逅する。 逃げる者と追う者?? 運命に翻弄される二組の兄弟の物語が、今、始まるーー
