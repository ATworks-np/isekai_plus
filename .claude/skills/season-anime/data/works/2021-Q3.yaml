    synopsis: 関東郊外にある星見市。「年に一度やってくる流星群の観測に最も適した町」であることからこの名前が付けられた。そんな星見市にある小さな芸能事務所、星見プロダクション。そこから華々しいデビューを飾ったアイドル・長瀬麻奈は、ライブバトルで連戦連勝を果たし、またたく間にアイドルランキング・VENUSプログラムを駆け上がった。数年後、星見プロダクションは新たなアイドルを見出すオーディションを開催。そこへ現れたのが、麻奈を姉に持つ長瀬琴乃と麻奈そっくりの歌声を持つ川咲さくらだった。ふたりをはじめ、続々とアイドル志望者が集まり、活気づく星見プロダクション。集まった10人は、寮での共同生活を始める。加えて、麻奈を超えんとするTRINITYAiLEや、麻奈に並々ならぬライバル心を抱くLizNoirが彼女たちの前に立ちふさがり、プライドを胸に競い合う。麻奈を取り巻く様々な思いが錯綜する中、アイドルたちは最高峰を目指していく。
