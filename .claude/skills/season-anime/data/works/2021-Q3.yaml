    synopsis: ワラビさんとは：二面性のない人間などいません。日本の家族ものアニメでは、人間の「善」「明部」「良心」を描かれがちですが、ワラビさん一家は、二面性の「裏側」や「心の暗部」「煩悩」の塊です。そして、それでも生きていく業の深い人たちです。反社会的なことや不誠実なことに手を出して間抜けな目に遭いながらも、それでも自らの欲望を抑えきれず、再び同じ失敗を犯してしまう“愛すべきおバカさん”。 しかし、彼らもまた、自分たちの姿であると視聴者に気づかせます。成長はしない。反省もしない。それでも生きていく愚かな家族を、ブラックユーモアで描くアニメです。
