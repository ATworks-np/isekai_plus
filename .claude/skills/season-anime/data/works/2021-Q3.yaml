    synopsis: 毎日の生活に疲れきっていて、癒しを求めていたあなた。自分だって優しく褒められたい、癒されたい。 「幼児は合法的に甘えられていいなぁ…」なんて現実逃避をしていた。 そんなある日、雑貨屋で購入した『青色おしゃぶり』を口にくわえると、謎の光に包まれ5歳児の姿で異世界に転生してしまう！ ―― 転生した先は、魔法使い“保育師”が『よしよしの魔法』を使って育児をする世界『チャイルドチューン』 ―― あなたはプリスクール『きらめきひよこっこ園(通称：きらひよ園)』に通い始めるが、 きらひよ園は入園者減のため閉園の危機に追い詰められていた。 「チャイルドチューンには数十年に一度、青色おしゃぶりを持った子どもが現れる。 その子どもを擁するプリスクールはさらなる飛躍をする。」 …という伝承があり、５歳児のあなたは園長先生から保育師のよしよし魔法のスキルを引き出すために「よしよし魔法をたくさん受けて欲しい」と頼まれるのだった。
