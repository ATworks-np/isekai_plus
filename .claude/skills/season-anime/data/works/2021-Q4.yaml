    synopsis: 殺生丸の娘で、現代育ちの日暮とわは、戦国時代に戻り、双子の妹・せつなの失われた記憶を取り戻すため夢の胡蝶を探していた。その夢の胡蝶に関わると思われる獣王・麒麟丸の姉・是露は、弟を倒すと予言された半妖を敵視し、とわたちを倒そうと画策する。 とわとせつなは、大妖怪の殺生丸を父に人間のりんを母に持つ半妖の少女達であり、とわ達の仲間になったもろはも、半妖と人間の間に生まれた四半妖で、犬夜叉とかごめの娘だった。是露は、とわ達が生まれた直後から、三人の命を狙っていたのだが、とわは現代に送られ、せつなは半妖の里へ身を寄せ、もろはは妖狼族の元で庇護され、生き延びたのだ。 犬夜叉とかごめは、十四年前に麒麟丸との戦いに巻き込まれ、黒真珠に隠された犬の大将（殺生丸と犬夜叉の父）の墓に送り込まれてしまっていた。 半妖ながら見事にその力を発揮するとわとせつなともろはに対し、麒麟丸も本気で立ちはだかる。しかし、その戦いで、せつなは麒麟丸に倒されてしまう。 深く悔いるとわの前に現れた殺生丸は、天生牙を渡し、「試してみるか？」と問いかける。しかし、癒やしの刀と呼ばれ、ひと振りで百の命を救うという天生牙は、その刃を折られてしまっていた。 折れた天生牙に何が出来るのか？　失われたせつなの命を呼び戻すことは出来るのか？　雨の中で佇むとわが見出す答えとは……？
