    synopsis: 西暦2019年、改元を目前とした日本。 その上空に突如現出した異次元の裂け目。そこには天地逆転した異世界「真国日本」があった。 かつての軍国主義を維持したまま、永世昭和の世を続ける並行世界は、 現行兵器を無効にするガス兵器「幻霧」と巨大人型兵器「伽藍」を駆使し、私たちの日本を軍事的侵略。瞬時に政府を掌握し、事実上の征服を果たす。 我らに「令和」という時代は訪れなかった......。 ―――それから十年後。真国の属国として生まれ変わった幻国・日本。 厳しい検閲の中、かつて隆盛を誇った マンガ、アニメ、アイドル等のサブカル文化は完全に死に絶えた......かに見えた。 しかし、Otaku is not dead! サブカル文化を守るため真国に真っ向から抗う集団が存在した。 その名も秘密結社「アラハバキ」。そして主力兵器「ガランドール」と、その動力源となり戦う少女たち。 人は彼女たちを称してこう呼んだ…、 電池少女と…。
