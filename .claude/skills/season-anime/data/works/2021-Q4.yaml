    synopsis: 国の豊かさ、 抱えている強者どもの数、そして王様自身がいかに勇者のごとく強いか、それらを総合的にランキングしたもの、それが“王様ランキング”である。 主人公のボッジは、王様ランキング7位のボッス王が統治する王国の第一王子として生まれた。 ところがボッジは、生まれつき耳が聞こえず、まともに剣すら振れぬほど非力であり、家臣はもちろん民衆からも「とても王の器ではない」と蔑まれていた。 そんなボッジにできた初めての友達、カゲ。 カゲとの出会い、そして小さな勇気によって、ボッジの人生は大きく動きだす――――。
