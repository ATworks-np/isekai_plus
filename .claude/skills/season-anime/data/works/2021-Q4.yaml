    synopsis: これは、ある少女の記憶から始まる物語。 18世紀、大西洋。 父と船旅へ出ていたフェナ・ハウトマンは海賊に襲われ、たった一人小型ボートで漂流し、命をつなぎ留める。 フェナが漂着したのは、国家が黙認する娼婦・男娼の島＜シャングリラ＞だった。 10年後──。 雪のような肌と白銀に光る髪を持ち、美しく成長したフェナは、初めての“仕事”を目前に控えていた。 だが、それを受け入れることはできず、幾度となく想像してきた島からの脱出を決心する。 迫りくる追っ手に絶体絶命のフェナは、真っ赤な鎧に鹿の角の兜をまとった青年・雪丸に救われる。 雪丸は、フェナを「見つけ出す」と約束した少年だった。 そして2人の“再会”は、フェナ自身に眠っていた言葉を呼び起こす。 炎に包まれ、沈みゆく船。 「必ず俺が見つけ出す！」と約束した少年。 そして最愛の父が叫んだ、あの言葉──。 「＜エデン＞に向かえ！」 フェナはその真意を知るべく、雪丸たちと共にの謎を解く船旅へ出る。
