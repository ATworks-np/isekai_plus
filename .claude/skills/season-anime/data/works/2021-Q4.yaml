    synopsis: 人類史上初の宇宙飛行士は、吸血鬼の少女だった―― 世界大戦 の終結後、世界を二分する超大国、東のツィルニトラ共和国連邦、西のアーナック連合王国は、その領土的野心を宇宙 へと向けた。 両国は熾烈な開発競争を繰り広げ、そして今―― 東歴１９６０年。 共和国連邦最高指導者ゲルギエフは、成功すれば人類初の快挙となる有人宇宙飛行計画『ミェチタ（夢）計画』を発令する。 そんな折、宇宙飛行士候補生の補欠、レフ・レプスは、ある極秘任務を命じられる。 『ノスフェラトゥ計画』――有人飛行に先立つ実験として吸血鬼を飛ばす計画――その実験体、イリナ・ルミネスク を24時間監視し、訓練で鍛えろというのだ。 レフとイリナ、人間と吸血鬼、監視役と実験体――種族の壁や国家のエゴに翻弄されながらも、宇宙への純粋な想いを共有し、2人は共に宇宙を目指すこととなる。
