    synopsis: 心の絆でパックをつなげっ！！ 日光市に本拠を置くアイスホッケーチーム、ドリームモンキーズ。そのドリームモンキーズが開催する体験教室の門を叩いたのは、地元に住む中学生、愛佳と彼女に強引誘われた妹の彩佳、幼馴染みの薫子と真美。同じ参加者には梨子と尚実の姿もあった。 練習後、皆、すっかりアイスホッケーに魅せられてしまい。「来週も参加しようよ」と言うまでになっていた。やがて監督の羊子から誘われて、愛佳、彩佳、薫子、そして梨子と尚実はドリームモンキーズに正式に所属することになる。 そんな中、強豪チーム釧路スノウホワイトに所属していた有名選手、優がチームを辞めるだけでなくアイスホッケーさえも辞める決意を固め祖母の住む日光へとやってくる。 「もう二度とリンクに立つことはない」そう思っていた優を再びリンクに引き戻したのは、羊子と愛佳達だった。こうして優を迎えた愛佳達ドリームモンキーズ新人チーム。 練習試合、合宿などを経て、皆、それぞれ成長していき、またチームも一丸となっていく。 「心の絆でパックをつなげっ！」を合言葉に、大会に臨む愛佳達ドリームモンキーズ。果たして、その結果は！？ これは少女達の、汗と涙の成長物語なのである。
