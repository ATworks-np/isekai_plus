    synopsis: “コミュ症”とは── 人付き合いを苦手とする症状。またはその症状を持つ人を指す。 留意すべきは── 苦手とするだけで、他人と係わりを持ちたくない、とは思っていないことだ。 桜舞う高校1年、極度のコミュ症である古見さんが出会ったのは、“普通すぎる”クラスメイト・只野くん。 人前で緊張してしまう古見さんの夢は、「友達を100人作る」こと。 古見さんの「1人目の友達」になった只野くんは、残り99人の友達づくりを手伝ってくれることになりました。 個性派ぞろいの高校で、古見さんの夢は叶うのでしょうか？ 伝えたい、でも伝えられない…そわそわ、どきどき、思わずにやにや でも時折、胸にチクリと突き刺さる？ 沈黙の美少女・古見さんのコミュ症コメディーです。
