    synopsis: ごく平凡なオタク大学生・岩谷尚文は、 図書館で出会った1冊の本に導かれ異世界へと召喚されてしまう。 与えられた使命は、剣、槍、弓、盾をまとう四聖勇者の一人「盾の勇者」として、 世界に混沌をもたらす災い「波」を振り払うこと。 大冒険に胸を膨らませ、仲間とともに旅立った尚文。 ところが、出発から数日目にして裏切りに遭い、金も立場もすべて失ってしまう。 他人を信じられなくなった尚文は奴隷の少女・ラフタリアを使役し、 波に、世界に、立ち向かおうとするが―。 果たして、この絶望的状況を打破することはできるのか? すべてを失った男の成り上がりファンタジー、開幕。
