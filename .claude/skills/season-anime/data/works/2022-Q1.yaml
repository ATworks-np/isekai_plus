      亡者が見える目を持つ男・平重盛は、未来（さき）が見える目を持つ琵琶法師の少女・びわに出会い、「お前たちはじき滅びる」と予言される。
      貴族社会から武家社会へ―― 日本が歴史的転換を果たす、激動の15年が幕を開ける。
