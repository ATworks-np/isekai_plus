      その昔、とある国に隕石が落ち、そこに特殊な力を授かりし者たちが現れた。彼らは『忍者』と呼ばれ、乱世の時代、大名に仕え、諜報活動を中心とする様々な任務に当たった。

      しかし時が流れ、いつしか忍者は不要な存在に。そうして忍者たちは追われるように海を渡り、世界各地へと散っていった。

      時は流れて現代。

      忍者の子孫たちは自分たちの持つ特殊な能力、シノビの力を存続させるため、世界忍者協会「WNA」を設立。

      そして『WNA』は身体の中に眠るシノビの力をより強力に引き出すことができる「ニンジャガム」の研究開発に成功するのだった。

      最強のシノビの力を持つ忍者を探し出すため、ニンジャガムを使ったエクストリームニンジャ競技大会「ニンジャラ」が開催されるが、その大会の裏ではニンジャガムを巡る事件、陰謀、そして未知なる生物の存在が交錯していた…。
