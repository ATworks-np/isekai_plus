    synopsis: 異世界に召喚された相馬一也は、エルフリーデン王国の王位を譲られて以来、辣腕を発揮し、王国の政治・財政を立て直していった。そして、三公の反乱とアミドニア公国の侵略を鎮圧したソーマは今、新たな問題に直面していた。 アミドニアの首都ヴァンを失い敗走した公太子ユリウスが復権を狙い、人類宣言の盟主たるグラン・ケイオス帝国に助けを求めたのである。始まる女皇マリアの妹ジャンヌ･ユーフォリアを代表とする帝国との交渉。それはエルフリーデン、アミドニアだけではなく、大陸全体の運命をも左右するものとなろうとしていた――。
