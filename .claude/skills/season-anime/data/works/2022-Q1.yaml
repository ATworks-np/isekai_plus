    synopsis: 夜の警視庁警察学校。桜が舞い散る中、敷地内では降谷零と松田陣平が殴り合う音が響いていた。松田は警察学校にいるにもかかわらず「どうしても警察官になりたい」という降谷が気に入らないという。二人の争いは一歩も引かずに続いた。夜中の2時、諸伏景光が悪夢で飛び起きると、ドアをノックする音がする。そこには傷だらけの降谷の姿があった。降谷の様子を見ていた諸伏は「その相手とは仲良くやっていけそうか？」と質問するのだった。朝礼の際、傷だらけになっている降谷と松田の横には、同期の諸伏、萩原研二、伊達航が並んでいた。初任科鬼塚教場教官・鬼塚八蔵は、二人の傷の理由を問うが伊達が機転を利かせて嘘を付く。警察が嫌いだという割に、警察官の心得についてはしっかりと答えることができる松田の姿に疑問を持った降谷は、彼の過去について調べ始める。
