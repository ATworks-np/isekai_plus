    synopsis: |-
      時は戦国時代、日ノ本。突如現れた“鬼神”により、覇権を争っていた戦国武将はことごとく討ち死にし、人の世は終わりを告げる。

      それから150年、鬼神による支配に抗い、自由を求めて戦い続ける者たちがいた――その名は“武士団”。
      幼い頃、小次郎の父から聞かされた武士の姿に憧れた武蔵と小次郎は、“最強の武士団”結成の夢を誓い合う。

      しかし、鬼を神と崇める町で、人々にとって武士は悪とされる存在。武蔵は周りの空気に合わせ「武士になりたい」と声に出せず、小次郎もまた武士の子として人々から疎まれていた。

      自分の生き方に葛藤を抱えていた武蔵がある日、目にしたのは無感情に人間を引き裂く鬼の姿。その真実を前に、武蔵は小次郎との夢を叶えるため、圧倒的な力を誇る鬼に立ち向かう…！
