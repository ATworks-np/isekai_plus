    synopsis: 無限の可能性が広がるVRMMO-RPG『アーク・アースオンライン』。プレイヤーによって建国されたアルカイト王国の九賢者が一人、威厳あふれる老齢の召喚術士ダンブルフもまたプレイヤーの一人だった。 ある日、彼は世界の異変に気づく。ゲームでは無かった味覚や臭覚が生まれ、ログアウトもできない。さらに、NPCが実に人間くさい反応を見せる。――それはゲームが紛れもない現実となった証であった。しかもこの世界では、30年もの月日が経っているというのだ。 そして何ということか、ダンブルフは諸事情により幼くも美しい少女の姿になっていた！　急変した世界の謎を解き明かすため、ダンブルフは賢者の弟子ミラを名乗り旅立つのであった。冒険の果てに待ち受けているものとは――。
