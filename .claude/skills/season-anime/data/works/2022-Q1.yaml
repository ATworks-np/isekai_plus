    synopsis: かつては、人間と妖怪とが共存する平和な世界だった桃源郷。 しかし、500年前に闘神 ナタク太子によって、天竺国の吠登城に葬られた大妖怪「牛魔王」を禁断とされている「化学と妖術の合成」によって復活を目論む者が現れた。 　 その影響である「負の波動」が桃源郷全土に広がり、妖怪達は突如として自我を失い、凶暴化して人間を襲い始め混沌と化す桃源郷。 事態を重く見た観世音菩薩は三仏神を通じ、玄奘三蔵に孫悟空、沙悟浄、猪八戒らを連れて西へ行くように命じる。 「牛魔王」蘇生実験の阻止のため、4人の旅が始まった。 　 旅の最中、四人は西から来たという謎の異国人ヘイゼル=グロースとその従者ガトという人物に出会う。 妖怪の魂を使用して、人間を蘇生する不思議な術を使うヘイゼル達と成り行きで行動を共にする三蔵一行。 　 だが、そこに彼らにとっての因縁の人物・烏哭三蔵法師が忍び寄る―――。
