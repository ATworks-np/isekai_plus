    synopsis: 2045年、コーラップス液によって世界中が汚染された地球。 人類は最も原始的な欲求である住居や食料を巡って、全世界を巻き込んだ第三次世界大戦が勃発。 終戦後の世界は、もはや荒廃しきっていた。 文明が滅びる寸前まで追い込まれる一方で、戦争とそれに伴う労働力の不足は機械技術の進歩を促し、その結果人間を模した“人形”が創り出された。 人間への各種サービス提供を目的にしたその見た目は人間の少女と何も変わらないが、 人間を遙かに超越した能力を持つ機械生命体。それが“人形”である。 そして技術が更に発展するにつれ、人形にマッチする銃を持たせた「戦術人形」があらゆる軍事組織で採用された。 そうした中、軍需企業「鉄血工造」のAIが突如人類へ反旗を翻し、 それを調査・阻止しようとする民間軍事会社「グリフィン」の戦術人形たちとの戦いが幕を開ける。 「グリフィン」に所属する最高級の戦術人形で構成された「AR小隊」のメンバーは、人間の指揮官とともに各地の秩序を取り戻し、人類の安全を守ると同時に、その戦争の背後に潜む巨大な謎を解き明かしていくこととなる。 戦術人形たちが紡ぐ、壮絶な戦いの末に待っているものとは、いったい……。
