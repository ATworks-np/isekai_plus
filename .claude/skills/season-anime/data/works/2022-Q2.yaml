    synopsis: 中華三国時代を生き、中華統一を目指し散っていった英雄たちの魂をそのまま封じ込めた装身具“勾玉”。それを引き継いだ者たちが“闘士”として戦いを繰り広げている現代日本。 関東の覇権争いはようやく収拾の兆しを見せ始めたが、関西を支配する大和学院の卑弥呼（ひみこ）が関東の闘士の勾玉を狙って「勾玉狩り」を始動する。 そんな中、関東・南陽学院に新たな闘士、孫権仲謀（そんけんちゅうぼう）が転入。 孫権は頭首である姉・孫策伯符（そんさくはくふ）不在による学院からの洗礼を受ける。加えて卑弥呼によって差し向けられた刺客・山田朝右衛門（やまだあさえもん）と因達羅（いんだら）が校内に侵入し絶体絶命の危機。執拗に狙われる仲謀に隠された秘密とは…？ 一方、伝説の闘士修験の地「徐福院」へと導かれる孫策。しかし、そこはすでに霊界の扉が開き、死者が溢れ出す“地獄”と化していた…。そして徐福院の地下では呂蒙子明（りょもうしめい）が目を覚ます。 家族のため、頭首のため、それぞれの想いが交差する新章が今、はじまる！
