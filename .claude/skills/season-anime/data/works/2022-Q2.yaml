      「ジョブロイド」と呼ばれる高性能アンドロイドが、安全なネットワーク「SOFIA システム」に接続され、人間の仕事を手伝っていた。

      ジョブロイドのさらなる活用のため、「ブレイバープロジェクト」とよばれる新たな取り組みが始まった。人類と共に歩んできた「働く乗り物」の特性をジョブロイドに付与し、能力向上を実現する「ジョブレイバー」に変形させるシステムである。「ブレイバープロジェクト」と適合する新型ジョブロイドが考案され、警察・消防・救急および民間企業で試験運用が行われることになった。

