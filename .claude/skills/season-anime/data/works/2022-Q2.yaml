    thumbnail:
      url: https://img2.animatetimes.com/2022/03/6232d4656c7ec_49c352408f2959d7edafec69e3ee946d.jpg
      width: 444
      height: 640
    synopsis: |-
      【第一部ストーリー】

      西暦2061年、日本は支配された。
      4つの世界主要経済圏によって分割統治されるに至り、
      日本人は隷属国の人間として虐げられる日々を送っていた。
      日本は各経済圏が投入した人型特殊機動兵器 AMAIM が闊歩する世界の最前線となった。
      機械好きの少年、椎葉アモウは、ある日、自律思考型AI「ガイ」と出会う。
      これをきっかけに、アモウは日本を取り戻すための戦いに身を投じることになる。
      自ら組み上げた AMAIM「ケンブ」に乗って。

      【第二部ストーリー】

      ゴーストと戦った隠岐の島戦から8ヶ月後。
      日本を舞台にした戦乱はいまだ終わりを迎えていない。

      他勢力に先んじて軍事用自律思考型AIの実用化に成功した北米同盟は、他３勢力との境界線を越え、支配領域を拡大させていった。

      この日本人の存在を無視したパワーゲーム――に怒り、抗う者たちがいる。
      レジスタンス組織『八咫烏（やたがらす）』は、ケンブを失った苦しい状況でありながら、いまも日本を取り戻すため戦い続けていた。
