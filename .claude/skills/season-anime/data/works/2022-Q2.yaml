      六葉町に住む双子の兄妹・王道遊飛と王道遊歩は、ちょっぴりアヤシイ宇宙人駆除業社・UTS(宇宙人トラブル相談所)を経営する小学生。

      遊飛が作った謎の装置で宇宙人を探しては、ムダに苦労する毎日を送っていた......そう、あの日までは!!

      できたてほやほやのミステリーサークルで、ついにホンモノの宇宙船を見つけた遊飛と遊歩。おそるおそる宇宙船に足を踏み入れた2人は、その船の中ではるか彼方のベルギャー星団から来たという宇宙人・ユウディアスと遭遇!!

      故郷の星団を追われた仲間を、新たな未来へ導くといわれる“ラッシュデュエル”を求めて地球までやってきたユウディアスだったが、それがどんなものかは知らない様子。そんな初心者のユウディアスにひと肌脱いでやろうとラッシュデュエルを挑む遊飛。

      こうして小学生と宇宙人による初めての異星間交流は、ラッシュデュエルで行われることに......!!

      今、遠い銀河の果てから来た1人の宇宙戦士が、ラッシュデュエルという新たな戦場を駆け抜ける!
