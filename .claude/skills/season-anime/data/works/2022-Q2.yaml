    synopsis: 田舎育ちの女子高生・涼海ひより。好きなことは走ること。得意種目はハードル走。そんな陸上一直線女子のひよりは、陸上部のある学校に進学するため、地元を離れ、東京の桜丘高校へと入学することに。偶然クラスメイトになったのは超人気高校生アイドルユニット『LIP×LIP』の染谷勇次郎と柴崎愛蔵。街中の大型ビジョンで流れる華やかな姿とは裏腹に、ひよりは険しい顔でにらみ合う２人を目撃してしまう。アイドルなんて興味もないし、あんな怖い人たちと関わりたくない。そう思っていたはずなのに・・・。「どうして私が、この２人のマネージャー見習いに！？」新しく出会った友達、服部樹里や中村千鶴との楽しい学校生活。上京の目的だった部活動。そして、右も左もわからないアイドル業界で、マネージャー見習いとしても奮闘するひよりは大忙し。眩いステージで輝く高校生アイドル×努力と根性の陸上系ヒロインの、新しい青春が始まる――。
