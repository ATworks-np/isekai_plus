    synopsis: |-
      世界中で大人気となっているシューティングホビー、ボトルマン。主人公・甲賀コータは、謎の新型ボトルマン「コーラマルＤＸ」を偶然、手に入れたことからボトルバトルの世界に飛び込み、次第に夢中になっていく。
      一方、英才教育を受けつつも、あることをきっかけにボトルマンを憎んでいたもう一人の主人公・帆狩リョウもまた、とある目的のためにボトルバトルの世界へ戻ってくる。
      時に対立し、時に協力しながら、ボトルバトルを戦っていくコータとリョウ。すべてのボトルバトラーの頂点・ボトルキングの座を狙うライバルや、一筋縄では行かない仲間たち。
      コーラマルDXに備わった画期的な機能と、それを狙う謎の組織。ボトルキング失踪の謎……などなど、様々な出来事を経て、コータとリョウが目指すのはボトルキングか？　はたまた、まったく別の未来か？　謎と爽快感に満ちた、まったく新しいボトルバトルが今、シュワッと開幕する――！
