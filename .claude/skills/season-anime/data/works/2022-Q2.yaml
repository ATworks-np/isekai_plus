      また異なる世界より『私立かぎなど学園』に現れたのは新たな綺羅星なのか、それともきらめく星々を覆い尽くす暗雲なの
      か。
      彼女たちは否定する――この世界を。
      彼女たちは抗う――この世界を作った何者かに。
      だが、彼女たちが世界の秘密に触れる時、この世界を愛する者たちが立ちはだかる。
      今、世界を揺るがす戦いがはじまる――!?
