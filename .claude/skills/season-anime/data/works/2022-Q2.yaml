    synopsis: |-
      おばあちゃん子で名古屋訛りが露骨な愛知県出身の女子高生八十亀最中（やとがめもなか／CV:戸松遥）と東京都から引っ越してきた陣界斗（じんかいと／CV:市来光弘）、最中と同じ高校に通う岐阜県出身の只草舞衣（ただくさまい／CV:若井友希）、三重県出身の笹津やん菜（ささつやんな／CV:小松未可子）の4人の個性的なキャラクターを通じて、名古屋や中京圏の方言や文化、県民性に触れることができるコメディー作品です！

      更に、2期、3期では、静岡県出身の初内ララ（しょないらら／CV:南條愛乃）や、大阪府出身の一天前紫春（いてまえしはる／CV:黒木ほの香）、京都府出身の輿安七帆（こしやすななほ／CV:伊藤彩沙）といったキャラクターも登場！

      中京圏だけでなく、その広がりは近畿地方にまで達しました。『八十亀ちゃんかんさつにっき』第4期でも、作品を通じて名古屋市はもちろん、東海地区やその他の地域の魅力や独自の文化を“愛あるディスり”を交えながらさらに発信していきます。
