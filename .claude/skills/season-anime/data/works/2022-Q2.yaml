    synopsis: 『空間震』という未曾有の災害を伴い、隣界より顕現する少女たち――精霊。災厄とまで呼ばれるほど圧倒的な能力を有した彼女たちに対して、人類は対処に追われ続けていた。 精霊に対抗するに当たり、人類に可能な手段は、武力をもって精霊を殲滅する、もしくは―― 『デートして、デレさせる』！ デレて好感度ＭＡＸに達した精霊とキスをすることで、彼女たちの霊力を封印し、己の力にも転換できる――そんな異能の力を持った五河士道。精霊たちを闘争のスパイラルへと巻き込む元凶となっている強大すぎる霊力を抑え、ときに彼女たちを守るためその力を行使することで、士道は夜刀神十香を始めとした精霊たちを次々と救っていった。 人類の前に初めて精霊が出現して数十年。人類と精霊の関係性や対処法も人知れず変容していた…… 士道に救われた数々の精霊たちと、まだ見ぬ精霊たち。 そして、士道を含む＜ラタトスク＞とは異なる手段を以て、精霊たちと対峙する者たち。つかの間の静寂を破り…… 士道たちの戦争＜デート＞が、また始まる――
