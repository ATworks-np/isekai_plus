      width: 452
      height: 640
    synopsis: |-
      「王」によって統治されている都市「新京都」　この新京都では、願いを叶えるために「王」に挑戦する戦い「リビルドバトル」が行われていた。

      しかしその真実は、新京都とは仮想都市であり、都市を動かすプログラムと融合するためのメインＣＰＵとして据えられるビルディバイドの実力者を選定することなのだった。そして照人の戦いとは、ＣＰＵとして囚われていた菊花を救うことだったのだが……

      ―時は流れ、３年後―

      新京都はかつての街並みを失い、崩壊した都市となっていた。民衆はＫＵＧＥ と呼ばれる王の使いによって捕獲され、呪力を奪うための「樽 」へと送られている。すべては「王」を維持するためにそんな中、ＫＵＧＥに追われるひとりの少女が……

      少女はかつての王、蔵部菊花。新京都の歴史の中で一番強いとされていた菊花だが、そんな彼女でもなすすべなくＫＵＧＥに追われ続けている。菊花の手元にはビルディバイドのデッキがなかったのだ。

      『これは罪、これは罰。私には二度と光は訪れない……』

      様々な後悔と共にひたすらに逃げ続ける日々　絶望の淵に沈む彼女に救いの手を差し伸べるのは――

      ―もう一度会いたい―

      『照人に』『師匠に』

      崩壊した都市「新京都」を舞台に、少女と少女が手を取り合う　大切な人に会いに行くため、彼女たちの戦いが今始まる。
