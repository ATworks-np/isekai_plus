    synopsis: 20世紀初頭から世界各地に突如出現し始めた個性豊かな怪獣達。 当初は抵抗を試みた人類であったが、 その巨大な力を前に、 完全なる駆逐は不可能であるとの結論に達し、 怪獣を監視・分析することに叡智を集結させた。 そして誕生したのが国連怪獣監視団（通称：クーロンズ）である。 不屈のリーダー海堂勇一郎事務局長を筆頭に、 怪獣生態学の権威である小林丸兆治、 怪獣機能分析学の才媛クレア・コールマン、 怪獣防災学の異端者ケニー御子柴、 対怪獣戦略学の貴公子ニキータ・タルコフスキー、 怪獣言語学の道を切り拓いた新世代ルル・ドゥ・ピカード、 そして怪獣生命科学の重鎮ギレルモ・マルケス。 怪獣科学のエキスパートたちが数百体にも及ぶ怪獣達を監視・分析し、 怪獣と人類が共に生きる世界を模索し続けるのであった。
