    synopsis: |-
      「黒の騎士団」を先鋒とした日本人の一斉蜂起事件「ブラック・リベリオン」から1 年。決戦場となったトウキョウ租界も復興し始めていた。アッシュフォード学園に通う主人公ルルーシュは体育教師ヴィレッタに補習で追い掛け回されるような日常を送りながらも、戻りつつある平穏にどこか冷めたものを感じていた。

      ある日、ルルーシュはそんな日常に刺激を求め、弟のロロと共にバベルタワーにある賭けチェスに赴く。しかしタワー上空にはC.C.ら黒の騎士団残存部隊が乘る飛行船が近づいていた。

      神根島で放たれた銃弾の結末は？果たしてルルーシュとスザクに何があったのか？
      偽りの日常を取り戻したかに見えたエリア11 に、再びゼロが舞い戻る！
