      width: 640
      height: 909
    synopsis: |-
      東京都高度育成高等学校。

      進学率、就職率100％を誇り、毎月10万円の金銭に相当するポイントが支給される楽園のような学校だが、その内実は一部の成績優秀者のみが好待遇を受けられる実力至上主義の学校だった。

      問題児の集まるDクラスに配属された綾小路清隆は、Aクラス昇格を目指すクラスメイトの堀北鈴音に協力。無人島でのサバイバル試験を終え、豪華客船で束の間の休息を堪能するのだが……。

      そこでは各クラスが入り乱れた新たな特別試験が始まろうとしていた。

      クラスのためか、グループのためか、あるいは個人のためか――。他クラスが不穏な動きを見せる中、まとまりに欠けるDクラスは窮地に立たされる。

      信頼と疑念の狭間で揺れ動く生徒たちは、真実を看破できるのか。新たな学園黙示録が今、再び幕を開ける。
