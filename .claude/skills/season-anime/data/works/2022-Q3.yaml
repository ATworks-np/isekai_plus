    synopsis: |-
      商店街の福引で入園チケットが当たり、閉園間近の遊園地・ナカスギランドにやってきたカオルさんとリラックマたち。

      リラックマの目当ては園内のスタンプラリーで手に入るスペシャルホットケーキ！

      一方、カオルさんは、後で合流する予定のハヤテくんのために張り切って作ったお弁当を、行きのバスの中に忘れてしまったことに気づく。

      お弁当を取り戻すためにバスを待つカオルさん＆コリラックマは、お昼に待ち合わせすることにして、リラックマ、キイロイトリ、トキオの三人は先に園内へ。

      この日、園最後のパレードをむかえる予定のナカスギランドには、世界的プロゲーマーを目指す少女、エミリとその両親や、人員不足のためひとり何役もこなし走り回っているスタッフのお姉さん、園のアイドル・スズネに恋するピエロの青年、そして閉園に向かってちょっとカリカリしている園長と、古くから園を支えてきた技術スタッフの永治などがいて…。
