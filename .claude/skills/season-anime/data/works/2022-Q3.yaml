    synopsis: |-
      ごくふつうの町で、穏やかに満たされた生活をおくる人々がいた。しかし彼らは、それが、偽りの平和であることを知らなかった。知られざる真実…地球はすでに、滅んでいるということを…。

      宇宙からの謎の異星人勢力の攻撃を受け、人類は 99.9 ％が死滅。その敵は 『ドラクター』 と名付けられた。やがて地球には大きな穴があけられ、異星人の居住に適した環境にテラフォーミングされた。人類は彼らの目を逃れ、シェルターに身を潜めるしかなかった。いつ訪れるかわからない、復活の日を待ちながら…。

      シェルターイクシアの住人たちは、滅びの日の記憶を消され、何も知らず普通の生活を送っていた。しかし、その中の一部の『選ばれし者』 たちは、パイロットとなり、『ローグ』と呼ばれる巨大ロボットを駆り、異星人と戦っていた。そして、今日もまた、新たなパイロットが選出される…
