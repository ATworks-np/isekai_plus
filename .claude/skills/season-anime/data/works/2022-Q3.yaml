    synopsis: 「頼んだぜ、アンちゃん。」帝の崩御から始まったヤマトの動乱。ヤマトの皇女・アンジュの毒殺未遂の嫌疑から追われる身となった右近衛大将・オシュトル。彼は戦いの末、仮面＜アクルカ＞の力を使い果たし、肉体と魂は世界の一部と化した。その別れ際、友であるハクにアンジュとネコネの未来を託す。オシュトルから仮面と意思を託されたハクは、ハクとしての人生を捨て、唯一事実を知るネコネを除いた皆に正体を偽り、仮面とともにオシュトルとして生きることを選んだ。そしてエンナカムイに逃れ、回復の兆しを見せたアンジュは、父である帝が残した皇女の地位を取り戻したいと立ち上がる。一方、ヤマトでは混乱に乗じて、八柱将であるライコウが偽の皇女を擁立し、国を掌握しようとしていた。やがてヤマト軍の侵攻は、本物の皇女を排除すべくエンナカムイへも及び……。ヤマト全土を巻き込む戦乱が、幕を開ける。「うたわれるもの」シリーズ最終章。全ての謎が、今解き明かされる。
