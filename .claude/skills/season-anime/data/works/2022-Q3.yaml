      width: 640
      height: 450
    synopsis: |-
      「ベイロンシティ」――どこの国にも属さない、太平洋に浮かぶメガフロート型の都市。

      新エネルギー資源「オルゴニウム」を採掘し、世界でもっとも注目されるこの都市では、「Ｄ災害」と呼ばれる、「悪魔」の引き起こす特殊な事件が多発していた。

      一部の人間にのみその存在を知られるＤ災害。対処を行うのは、「ＰＭＣ（民間軍事会社）」。

      ベイロンシティで暮らす青年・シュウはそのひとつを運営しているが、会社の規模は零細。おまけに仕事も選ぶので、資金繰りは常に苦しい。
      そんな彼の生活を公私に渡り献身的に支えているのは、ベイロンシティの学校に通う美少女高校生・キサラ。

      そしてもうひとり、シュウがかつて所属していた大手ＰＭＣの社員で、元恋人であるアヤノも、何かと彼を気にかける。キサラにとってはおもしろくない。

      キサラのシュウに対する、強い執着。その根幹にあるのは二人の「契約」。
      彼女の正体は悪魔なのだ。

      キサラはシュウの生活を支え、契約に基づき悪魔退治にも協力する。
      その代償は甘く危険な「キス」。

      愛と契約、二人の危うい絆。その運命は、どこへ向かう――。

      『冴えない彼女の育てかた』の丸戸史明×『デート・ア・ライブ』のつなこ×『かぐや様は告らせたい～天才たちの恋愛頭脳戦～』のA-1 Picturesによるオリジナルアニメ、予測不能のラブコメディ、ここに開演。
