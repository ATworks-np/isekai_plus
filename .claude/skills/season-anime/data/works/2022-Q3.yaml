    title: メイドインアビス 烈日の黄金郷
    workTagId: 13762
    workUrl: https://www.animatetimes.com/tag/details.php?id=13762
    seriesTitle: メイドインアビス
    seriesTagId: 6534
    format: TVアニメ
    cours:
      - 2022-Q3
    episodes: 全12話
    schedule: |-
      2022年7月6日（水）～2022年9月29日（水）

      TOKYO MX・AT-Xほか
    thumbnail:
      url: https://img2.animatetimes.com/2021/11/624a5c6e9e73c_45f90c730a412566d4d1ef36f6b621aa.jpg
      width: 640
      height: 904
    synopsis: |-
      隅々まで探索されつくした世界に、唯一残された秘境の大穴『アビス』。
      どこまで続くとも知れない深く巨大なその縦穴には、奇妙奇怪な生物たちが生息し、今の人類では作りえない貴重な遺物が眠っている。
      「アビス」の不可思議に満ちた姿は人々を魅了し、冒険へと駆り立てた。
      そうして幾度も大穴に挑戦する冒険者たちは、次第に『探窟家』と呼ばれるようになっていった。
      アビスの縁に築かれた街『オース』に暮らす孤児のリコは、いつか母のような偉大な探窟家になり、アビスの謎を解き明かすことを夢見ていた。
      ある日、母・ライザの白笛が発見されたことをきっかけに、アビスの奥深くへ潜ることを決意するリコ。
      リコに拾われた記憶喪失のロボット・レグも自分の記憶を探しに一緒に行くことを決意する。
      深界四層でタマウガチの毒に苦しむリコ。
      リコを救ったのは成れ果てのナナチだった。
      ナナチを仲間に加え、ボンドルドの待つ深界五層へと三人は冒険を進める。
      そこで、出会ったプルシュカと名乗る女の子は、ボンドルドに育てられ外界を知らずにいた。
      リコの冒険話に夢中になり一緒に冒険に行きたいと願うが、あえなくボンドルドの実験に利用されてしまう。
      しかし、プルシュカは形を変えリコの白笛となり、一同は深界六層「還らずの都」へと進む。
      そこには、成れ果てが独自の価値観を持って生活している「成れ果ての村」が存在していた。
