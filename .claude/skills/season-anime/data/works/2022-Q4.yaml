      width: 640
      height: 905
    synopsis: |-
      「君との婚約は破棄させてもらう」
      きらびやかな夜会で突然放たれた婚約破棄の言葉。アイリーン・ローレン・ドートリシュはそのショックで前世の記憶を取り戻し、現状を把握した。
      ここは、前世でハマった乙女ゲーム『聖と魔と乙女のレガリア』の中。自分はゲームのヒロインの恋路を邪魔する、悪役令嬢・アイリーンであることを！
      前世の記憶だと、アイリーンのこの先は雑な死に方をする破滅ルートだけ。
      破滅フラグの起点であるラスボスの魔王・クロードを攻略して恋人にしてしまえば、フラグが回避できるかもしれない！
      そう考えたアイリーンは、美しき魔王に宣言する。
      「結婚していただきたいの！」
      一発逆転、幸せを掴み取るためのアイリーンの旅が始まる――。
