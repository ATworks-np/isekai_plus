      width: 454
      height: 640
    synopsis: |-
      忍者は、存在しない。…と、我々は思っている。

      仮に忍者が存在したところで、忍者はその姿を我々に晒すことはない。だからこそ、忍者は『表向きには』存在しないのだ。

      主人公、櫻羽一時は、我々と同じく忍者は存在しないと思っている、普通の男子。彼には普通の、幸せで輝かしい日々が約束されている…はずだった。

      ある日、一時は命を狙われ、それが甲賀忍者の仕業であると聞かされる。

      なぜ一時は命を狙われたのか？　それは…彼が由緒正しき、伊賀忍者第１９代正当後継者だったからなのだ！

      伊賀と甲賀は長年対立しており、甲賀は伊賀を侵略しようとしている。一時が生きるためには…自らも忍者になるしかない！

      こうして、誰も知らない忍者の世界に身を投じる一時。一人前の忍者となるべく学び、戦い、苦難に立ち向かう。だがそれは、一時が辿る過酷な運命の、ほんの序章でしかなかった…。

      『アルドノア・ゼロ』『アイドリッシュセブン』のTROYCAが放つ、先の読めないオリジナルニンジャアクション、2022年放送開始！
