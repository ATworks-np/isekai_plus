      身の丈を超える長大な剣を自在に操り、強大な敵をいとも簡単に倒すガッツ。そんな彼に目をつけたのが、傭兵集団“鷹の団”を率いるグリフィス。
      美しい姿からは想像もつかない統率力を持ち、大いなる野望を秘めたグリフィスは、自らの夢を叶えるためにガッツを決闘で制し、鷹の団に引き入れる。
      数々の激戦を共にくぐり抜けるうちに、信頼で結ばれていく仲間たち。なかでもグリフィスとガッツの絆は、今や特別なものとなっていた。
      やがて鷹の団はミッドランド王国の正規軍にのし上がるが、それはグリフィスの目指す頂点へのはじめの一歩にすぎなかった。
      一方ガッツは、グリフィスの「夢」に取り込まれ剣を振り回すだけの人生に疑問を抱き始める。
      だが、ガッツはまだ知らない。果てなき夢が二人に与えた、恐るべき宿命を──。
