      width: 454
      height: 640
    synopsis: |-
      ぷにるんず。それはぷにっとやわらかい、とっても不思議な……いいえ、“ぷ”しぎないきもの。みんな、ぷにぷにされるのが大好き。心をこめてお世話をしてあげると、ぷにっとかわいく成長していきます。
      そっとまわりを見渡してみれば……ほら、ここにも、あそこにも！　ぷにるんずは、もしかしたらあなたのすぐそばにいるかも知れません。
      “あいるん”は明るくて好奇心旺盛、とっても食いしんぼうなぷにるんず。人間の世界に興味しんしんで、いろんなことにチャレンジするけど、いつもなにかがへんてこりんです。
      そんなあいるんのお世話をしているのは、あいるんと同じく明るくて好奇心旺盛、そして、パンやおかしを作るのが大好きな小学４年生の女の子“ゆかちゃん”。
      ２人は大のなかよし。なにをやるにもいつも一緒です。
      とってもエネルギッシュな“えねるん”、ラブラブパワー全開の“らぶるん”、うるうる泣き虫な“うるるん”、クールビューティな“くーるん”。ゆかいなぷにるんずにかこまれ、あいるんとゆかちゃんのぷにぷに楽しい毎日はつづいてゆきます。
      “ぷ”しぎないきもの・ぷにるんずの日常を、あなたも“ぷにっ♪”とのぞいてみませんか？
