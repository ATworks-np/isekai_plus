      width: 640
      height: 906
    synopsis: |-
      街に出て、あたりを見渡せば一人は視界に入るだろう平凡な男子高校生・柏樹朝(かしわぎ・あさひ)。

      代わり映えのしない毎日に何の疑問も持たずに出かけた学校への道のりで、朝は様々な災難に見舞われる。それは出かける前に何の気なしにつけたテレビでやっていた奇妙な占いの通り。

      次々と起こるトラブルの中で、5人の少女たちと最悪とも言える出会いを果たした朝。

      身も心も疲れ果て、やっとの思いでたどり着いた学校で、彼が目にしたのは、転校生や新任の教師としてやってきた5人の少女たちの姿だった。

      必死に顔を隠す朝だったが、隠し通せるわけもなく......。

      自称・朝の親友を名乗る伊集院好雄(いじゅういん・よしお)から、5人との関係を聞かれる朝。

      5人の少女たちとも一緒に過ごすうちに全てが誤解であることがわかり、少しだけ打ち解けていく。

      そして放課後、家に帰ろうと靴箱をあけると、そこには一通のラブレターが。

      差出人不明のラブレターには校舎裏の桜の木の下で待っていますと書かれていた。これもまた占いの通り。こうなったら全てを確かめてやろうと、朝は桜の木の下へと向かう。

      桜舞う季節、5つの恋の風が吹き抜ける淡く切ない青春ラブストーリーが今、幕を開ける。
