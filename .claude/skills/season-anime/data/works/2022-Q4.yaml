    synopsis: 『我が名はシャドウ。陰に潜み、陰を狩る者……』 みたいな中二病設定を楽しんでいたら、まさかの現実に!? 主人公でも、ラスボスでもない。 普段は実力を隠してモブに徹し、物語に陰ながら介入して密かに実力を示す「陰の実力者」。 この「陰の実力者」に憧れ、日々モブとして目立たず生活しながら、力を求めて修業していた少年は、事故で命を失い、異世界に転生した。 これ幸いと少年・シドは異世界で「陰の実力者」設定を楽しむために、「妄想」で作り上げた「闇の教団」を倒すべく（おふざけで）暗躍していたところ、どうやら本当に、その「闇の教団」が存在していて……？ ノリで配下にした少女たちは勘違いからシドを崇拝し、シドは本人も知らぬところで本物の「陰の実力者」になっていき、そしてシドが率いる陰の組織「シャドウガーデン」は、やがて世界の闇を滅ぼしていく――。
