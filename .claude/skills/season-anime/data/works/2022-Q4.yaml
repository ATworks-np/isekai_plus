      旅を続ける二人は、霧に覆われた不吉な町「義城」にたどり着き、曉星塵(シャオ・シンチェン)と名乗る盲目の道士と出会う。
      そして魏無羨と藍忘機は、かつてここ義城で曉星塵と薛洋(シュエ・ヤン)、宋嵐(ソン・ラン)、阿箐(アージン)に起きた凄惨な事件を知ることになるのだった。

      鬼腕の正体、仙界に渦巻く陰謀、真の黒幕―――
      全ての謎が解き明かされ、物語はついに結末へ。
