    synopsis: |-
      「…俺の青春、これでいいんだろうか」

      若手ながらギルド１の討伐数を誇る狩人キクル。

      幼いころから訓練に明け暮れ一流の狩人となった彼の望み、…それは仕事を辞めること！？

      失われた青春の1ページを取り戻すため、一刻も早く引退したいキクルの最優先ミッションは後任の育成！

