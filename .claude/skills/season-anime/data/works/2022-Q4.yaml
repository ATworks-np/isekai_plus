    synopsis: |-
      西暦2011年、アメリカ・フロリダ州
      空条徐倫は、罠に嵌められ、無実の罪で州立グリーン・ドルフィン・ストリート重警備刑務所――別名「水族館」に収容される。

      徐倫を救い出そうと面会に訪れた父・空条承太郎だったが、それこそがすべての策略の首謀者・謎のスタンド「ホワイトスネイク」の目的だった。

      かつて承太郎によって倒されたDIOが求めた『天国へ行く方法』。その記憶をホワイトスネイクは求めていたのだ。

      ホワイトスネイクのスタンド攻撃により、承太郎は「記憶」と「スタンド能力」をDISCとして奪われ、活動停止状態になってしまう。徐倫は父のDISCを取り戻すため、刑務所に留まることを決意する。

      エルメェス・コステロ、フー・ファイターズ、エンポリオ・アルニーニョ、ウェザー・リポート、そしてナルシソ・アナスイ。

      徐倫は新たに出会った仲間達と共に、ホワイトスネイクの正体、そして父の記憶とスタンド能力を取り戻すため、刑務所内に潜むスタンド使い達と戦い続ける。

      100年以上に及ぶジョースター家とDIOの因縁に終止符を打つ最後の戦い、激化する新章開幕！！
