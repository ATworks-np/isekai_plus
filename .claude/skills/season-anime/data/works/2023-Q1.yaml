      女神の加護を受け『神騎士』となり、巨大な王国を打ち立てた英雄王・イングリス。

      やがて年老いて天に召される直前、「国と民に尽くした一生では、自分自身の武は極められなかった。次の人生では、自分のために生き、限界まで鍛え抜いてみたい」と強く望む。

