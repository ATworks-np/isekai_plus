    synopsis: |-
      Ｕ.Ｃ.0097――。『ラプラスの箱』が、『ラプラス事変』と呼ばれた争乱の結果として世に示されて一年が経過した。だが、ニュータイプの存在とその権利に言及した『箱』＝『宇宙世紀憲章』の存在が明かされても、世界の枠組みに大きな変化はなかった。

      一方、『ラプラス事変』において、ネオ・ジオン残党軍『袖付き』は一時的に瓦解し、活動は停滞。また争乱における主役となった“ユニコーンガンダム”と呼ばれる２機のモビルスーツは、人智の及ばぬ能力を発揮したことで危険視され、秘密裏に封印されていた。

      しかし、２年前に消息不明となり、歴史から抹消されていた RX-0 ユニコーンガンダム３号機が、地球圏に再びその姿を見せる。“フェネクス”と呼ばれるその機体を巡り、再び動き出す人々。フェネクス争奪戦には、地球連邦軍や『袖付き』だけでなく、アナハイム・エレクトロニクス社とも関連の深い大企業、ルオ商会も介入する。新たなモビルスーツ「ナラティブガンダム」を投入した彼らの真の目的とは……。
