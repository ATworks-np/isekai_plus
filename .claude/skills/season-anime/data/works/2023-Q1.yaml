      width: 707
      height: 1000
    synopsis: |-
      砂嵐吹き荒れる大地。
      そこは地球よりはるか遠く、5つの月が輝く、灼熱の星・ノーマンズランド。
      人類の生き残りは、あらゆる物質をゼロから生み出す生態動力炉“プラント”を頼りに異形の生物蠢く不毛の地で、血肉を削り暮らしていた。

      その過酷な世界に一人、
      懸賞金600万$$を懸けられた、“関われば必ず災厄に見舞われる”
      人間台風（ヒューマノイドタイフーン）と呼ばれるトラブルメーカーがいた。
      名を、“ヴァッシュ・ザ・スタンピード”という──。

      新人記者のメリル・ストライフは、飲んだくれのベテラン記者・ロベルト・デニーロと共に人間台風という一大スクープを求め、1人の深紅のコートに包まれたガンマンにたどり着くが、出会ったのは「決して人を殺さない」、誰よりもお人よしの風来坊だった！？

      無頼の葬儀屋ニコラス・D・ウルフウッドを道連れに、悪に染まったヴァッシュの双子の兄ミリオンズ・ナイヴズを追う旅が始まる。

      立ちはだかる無数の刺客たちと、ナイヴズの恐るべき計画とは。
      全ての謎が明らかになる時、世界を賭けた戦いが始まる！
