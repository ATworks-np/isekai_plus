    synopsis: |-
      ―――世界最強と謳われる“冰剣（ひょうけん）の魔術師”―――

      その称号を受け継いだ少年・レイ＝ホワイトは強大すぎる自身の力に苦悩し、極東戦役を収めたのを最後に、深い心の傷と共に戦場から姿を消した……。

      時は流れ、3年後。

      世界中からエリート魔術師が集まるアーノルド魔術学院に入学したレイ。学院始まって以来、初めての一般家庭出身（オーディナリー）である彼を待っていたのは、貴族出身の魔術師からの侮辱と軽蔑の眼差し。そして、学院で出会ったかけがのない仲間をも巻き込む数々の陰謀だった。

      今、最強魔術師の友情と波乱に満ちた学園生活が幕を開ける。
