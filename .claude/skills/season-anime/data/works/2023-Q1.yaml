    synopsis: |-
      イコは、小学3年生。

      4人の兄と館山にある古い家で暮らしている。

      イコの家には両親がいない。

      兄の話では、母親は東京で働き、歳の離れた兄たちがイコを育ててくれている。

      ちょっと変わり者だけれど、自分を大切にしてくれる兄たちが、イコは大好きだ。

      しかし、彼らには秘密があった。

      実は、彼らは、永遠に近い刻を生きる「魔法使い」だったのだ。

      なぜ、彼らはここへ来たのか。なんのためにイコの兄になったのか。

      これは、魔法使いたちの世界に巻き込まれながら、海辺の街で楽しく暮らす家族の、なつやすみの物語である。
