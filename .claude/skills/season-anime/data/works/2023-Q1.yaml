    synopsis: |-
      日本を代表するホラー漫画の鬼才・伊藤潤二は、2021年に世界で最も権威のある漫画賞のひとつであるアイズナー賞を2部門同時受賞する日本人初の快挙を成し遂げるなど、日本国内だけでなく海外でも高い評価を得ている。

      そんな伊藤潤二の傑作ホラーが2023年にNetflixシリーズとしてアニメ化。数多の作品から「狂気」「狂人」をコンセプトに選定した「富江・写真」「四重壁の部屋」「首吊り気球」「侵入者」など珠玉の20タイトルがアニメとなる。Netflix配信だからこそのホラーを追求した映像を楽しみにして欲しい。
