    synopsis: |-
      『⽼後に備えて異世界で８万枚の⾦貨を貯めます』の、原作は⽇本最⼤級の Web ⼩説投稿サイト「⼩説家になろう」で累計 1 億 2,000 万PV 超えした⼩説。18歳でありながら中学⽣に⾒られてしまう童顔⼩柄な少⼥・ミツハが両親と兄を事故で失い天涯孤独になるところから物語が始まる。

      ショックによる⼤学受験失敗、両親の保険⾦を狙う輩、進学か就職か、家の維持費や⽣活費など数々の出費・・・これからの⽣活に悩んでいたミツハはある⽇、謎の存在から「こちらの世界」と「異世界」を“⾏き来”できる能⼒を与えられる︕ そこから彼⼥が思いついた将来設計とは、⼆つの世界で10 億＋10 億の合計 20 億円＜8 万枚の⾦貨＞を貯めるというもの︕ そう、頼れる者のいない彼⼥の安泰な⽼後のために︕！
