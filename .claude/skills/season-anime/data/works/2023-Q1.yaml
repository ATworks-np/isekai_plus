      width: 640
      height: 904
    synopsis: |-
      ストリートを根城に気ままに暮らしていたフィンは恩のある孤児院が資⾦難で閉鎖の危機に陥っていることを知り⼀攫千⾦を狙ってカジノヘ乗り出す。

      しかし、そこで待っていたのはツキをほしいままにする男が持ったカードを巡って繰り広げられる銃撃戦にカーチェイス、悪夢のような修羅騒ぎだった。やがて、フィンは知ることとなる。世界の秩序を守るも混乱に陥れるも、意のまま。選ばれし者に⼈知を超えた異能⼒を与える52枚の《エスクプレイングカード》の存在を。

      そして、幼い頃から肌⾝離さず⼤切にしていた〝相棒〟に秘められた⼒を――。⾼級⾃動⾞メーカー・ピノクルに勤務する表の顔を持ちながら真には、フォーランド国王直々に王国中に四散してしまったといわれるカードを回収する任務を命じられたプレイヤー集団《ハイカード》。

      その第5のメンバーとしてスカウトされたフィンはイカした仲間たちとともに、危険なミッションに当たる。「必要なのはマナーと気品、そして命を張れる覚悟。それだけです」対するは、悪名⾼きマフィア・クロンダイクファミリーとピノクルを打ち負かすことに執念を燃やすライバルメーカーのフーズフー。⼤義、欲望、復讐を抱き、カードに魅せられたプレイヤーたちによるすべてを賭ける狂騒争奪戦が、今、幕を上げる！

      Are you ready？

      Itʼs Showdown!!
