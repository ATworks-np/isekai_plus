      殺し屋バディの子育て奮闘記！？
      狙ったターゲットは逃さない。
      そんな男２人の殺し屋バディが、4歳の女の子を引き取るハメに。
      新たに始まったのは、ホット＆クールな男２人組と天真爛漫な女児との家族生活。
      どんな仕事もこなす２人でも、１人の娘に悪戦苦闘。食事の世話から遊びの相手、保育園の送迎などに大慌て。それでも仕事の依頼は断れない。
