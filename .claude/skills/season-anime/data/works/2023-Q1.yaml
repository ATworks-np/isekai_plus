      width: 640
      height: 905
    synopsis: |-
      ボーイッシュな女の子×鈍感な幼なじみが織り成す、青春ラブコメディ。

      世界からの熱いラブコールを受け、まさか待望のアニメ化決定！

      2015年、Twitterでの連載開始以来、ボーイッシュな主人公と幼なじみの織り成す不器用ながらも真っ直ぐな恋愛模様が多くの読者に支持され、2019年に惜しまれつつ完結したコミック『トモちゃんは女の子！』。

      「第2回 次にくるマンガ大賞」Webマンガ部門第1位受賞し、今なお多くのファンの根強い人気を誇り、国内に留まらず、海外のファンからも熱い支持を集める本作が遂に待望のアニメ化！

      幼なじみの久保田淳一郎に恋するボーイッシュな女子高校生・相沢智（トモちゃん）は、淳一郎に“女の子”として見てもらいたいがいつも空回り。果たして、トモちゃんの不器用な乙女心は淳一郎に届くのか…！？

      観ればきっと、あなたも二人の恋を応援したくなる――。

      2023年――トモちゃんと個性豊かな仲間たちが繰り広げる“青春ラブコメディ”が世界を虜にする！
