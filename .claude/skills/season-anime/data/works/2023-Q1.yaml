    synopsis: 宇宙世紀0079、地球連邦とジオン公国が戦った一年戦争の末期、サイド４のスペースコロニー群、ムーアはジオン軍の攻撃により破壊され、多くの住人が命を落とした。破壊されたコロニーや、撃沈された戦艦の残骸が無数に漂う暗礁宙域では、ぶつかり合い帯電したデブリによって絶えず稲妻が閃くようになり、いつしかそこは、『サンダーボルト宙域』と呼ばれるようになった。ムーア市民の生き残りで構成された地球連邦軍所属部隊、ムーア同胞団は、故郷であったサンダーボルト宙域の奪還を悲願とし、宙域のジオン軍を殲滅せんとしていた。連邦の進軍を足止めせんとするジオン軍も、義肢兵の戦闘データ採取を目的に設立されたリビング・デッド師団を展開。ムーア同胞団に所属しながら、故郷や自身の出自に束縛される事を疎ましく思うイオ・フレミングと、過去の戦闘により両足を失い、今はリビング・デッド師団でエーススナイパーとして活躍するダリル・ローレンツは、戦場で対峙した時、互いに悟るのだった。ふたりは、殺し合う宿命なのだと……。
