      コロニーの下層エリアに住む少年・トムラ颯也（そうや）もまた、運命に導かれるように、憧れの『逃走中』の世界へと足を踏み入れる。

      このゲームを手がける『クロノス社』の若きゲームマスター・月村サトシは、そんな颯也に興味を抱く。

      いまだかつてない壮大なステージに転送された颯也は、襲い来る“ハンター”の脅威や過酷なミッションに取り組みながら、くせ者ぞろいの逃走者たちと共に、逃走成功を目指して“本気”で走り始める！
