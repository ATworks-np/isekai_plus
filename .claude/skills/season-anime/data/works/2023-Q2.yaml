    synopsis: |-
      “ぼさぼさ” だっていいじゃない――。

      家族に愛されて生活している動物たち。そんな動物たちにも、普段は見せない素の自分が出る瞬間がある。ぼさぼさ姿で、思った事を喋りはじめる動物たち “ぼさにまる”。

      ある日突然姿が変わった新米 “ぼさうさ” の「さくら」。

      マイペースなベテラン “ぼさねこ”の「キャシー」。せっかちな性格の“ぼさはむすたー”の「蘭」。

      思わず“ぼさる” 自分に動揺する「さくら」だったが、「キャシー」や「蘭」と過ごしていく中で、次第にそんな自分を受け入れ始め…。

      TVアニメ「ぼさにまる」は、そんな「さくら」を中心に繰り広げられる、日常ぼさぼさストーリーです。
