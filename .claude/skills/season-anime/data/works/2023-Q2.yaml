    synopsis: |-
      舞台は、２０４１年の地球――――

      最新のＤＮＡ複製技術によって恐竜を蘇らせた人類の前に、宇宙から地球征服を目論む≪機械恐竜帝国≫が忍び寄る・・・。

      主人公・ジン（山下誠一郎）がひょんなことから出会ったのは、伝説の恐竜・ティーレックス“赤竜”と、地球を秘密裏に守る≪Ｄアーマー≫のセナ（佐倉綾音）、ハンギョル（榎木淳弥）ら少年少女たち。

      彼らは武装化した恐竜“アーマードサウルス”のパイロットたちであった。特殊な才能を見出され、≪Ｄアーマー≫の一員となったジンと相棒のティーレックス“ブルズ（赤竜）”の前に次々と襲いかかる機械恐竜たち。

      共同生活を送る≪Ｄアーマー≫たちの間で巻き起こる事件、衝突、芽生える友情、そして裏切り・・・。果たして、ジンたち≪Ｄアーマー≫は、≪機械恐竜帝国≫から地球の平和を守りきれるのか――！？
