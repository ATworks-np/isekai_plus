      突然、謎の死を迎えた「凛子」は、小説の中の富豪の娘「レリアナ」として転生する。

      しかし、レリアナは脇役であり、近いうちに命を落とす運命だった。

      レリアナを殺害するのは、婚約者である「ブルックス」である。そのことを小説のストーリーで知っている「レリアナ／凛子」は、彼との婚約破棄を目論む。

