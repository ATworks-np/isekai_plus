      width: 441
      height: 640
    synopsis: |-
      かつて、ウルトラマンが倒れた「あの戦い」。

      それを「悪夢」に見た進次郎（ULTRAMAN）は、しだいに、自分の《力》が抑えられなくなり、制御できなくなってきていることに気づく。その力が暴走し、街を破壊し、人々を傷つけるとき、ウルトラマンは「人類の厄災」と呼ばれ、糾弾される存在となる…。

      変身を封じられ、追われる身となった進次郎に対し、科特隊は非情の命令を下す。

      「科特隊、ウルトラマン（進次郎）を捕縛せよ！」

      大切なものを失い、孤独の中を逃走する進次郎を待ち受ける運命の嵐！その混乱の影で、暗躍する最凶の異星人軍団！

      光を継ぐ者たちが次々に葬られていくなか、進次郎に《更なる覚醒》の時が迫る。

      それは、人類にとって福音か、それとも破滅の叫びとなるのか。進次郎の前に姿を表す、宿命の敵の正体とは・・・！？

      すべての謎を解く鍵は、かつてウルトラマンが倒れた「あの戦い」にあった…。
