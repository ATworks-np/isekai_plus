    synopsis: |-
      思春期症候群――
      多感で不安定な思春期だけに起こると噂される、不思議な現象。

      たとえばそれは、梓川咲太の目の前に現れた野生のバニーガール。彼女の正体は、高校の上級生にして活動休止中の女優、桜島麻衣先輩だった。魅惑的な彼女の姿は、何故か周囲の人間の目には映らない。

      謎の解決に乗り出した咲太は、麻衣と過ごす時間の中で、彼女の秘める想いを知って……

      次々と咲太の周囲に現れる、“思春期症候群”を抱えたヒロインたち。空と海が輝く町で、心揺れる不思議な物語が始まる。

      ――『さくら荘のペットな彼女』コンビが描く、思春期ファンタジー。
