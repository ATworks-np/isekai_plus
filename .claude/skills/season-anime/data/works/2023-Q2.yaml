      優れた女性達は『アクトレス』と呼ばれた。

      やがて時が経ち、対ヴァイス組織として設立された『AEGiS』から認可された
      民間企業のアクトレスが、ヴァイス駆除を行うようになっていた。

      これは、『アリスギア』を纏いし少女たちが、
      宇宙を放浪する人類を救う物語である！
