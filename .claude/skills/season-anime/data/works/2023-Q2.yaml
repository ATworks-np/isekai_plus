      その名は『逃走中』。

      限られたエリアの中に解き放たれた逃走者たちが、制限時間のカウントがゼロになるまで、追跡アンドロイド“ハンター”から逃げ切れば、高額賞金を得られるというエンターテインメントサバイバルゲームだ。
