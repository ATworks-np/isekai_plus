      width: 453
      height: 640
    synopsis: |-
      「47 年間、一度も刑法を犯さずに生きてきた。だけど、今日から殺人鬼だ。ああ……」
      人が人を殺してしまうとき、一体どんな気持ちでいたのかを、しがない会社員、47歳の鳥栖哲雄は、ふつふつと煮えていく死体を前に思っていた──。
      さかのぼること、わずか数時間前。哲雄は、反抗期の娘・零花に煙たがられながらも、愛する妻・歌仙と共に、彼女の成長を誰よりも願い、日常を送っていた。
      ある日、哲雄が一人暮らしを始めた零花を訪ねると、その顔に殴られたようなアザがあることを見つける。問い詰めても零花は答えない。意を決した哲雄は零花の家に忍び込み、クローゼットに身を隠す。
      そこで目にしたのは、零花に手を上げた“半グレ”彼氏・麻取延人。さらに延人は元カノを殴り殺した過去を持ち、ヤクザと共に、零花を貶める“ある計画”を進める超危険人物だった──！
      「零花だけは守らなきゃ。たとえ僕たち夫婦に、最悪の結果が訪れても……‼」
      愛する家族のため、“ただの弱いおじさん”は、裏社会の猛者たちを相手に、命と知力を賭けた闘いを始める！
