    synopsis: 彼氏がネトゲで知り合った女性と浮気し、そのまま別れを告げられてしまうというサイアクな出来事に直面した女子大生の木之下茜。話を合わせるためにネトゲをはじめていた茜の元に残ったのは、彼氏との愛と共に育んでいたはずのキャラだけだった……。ストレス発散のため、ネトゲの狩り場で暴れていた茜は、たまたま遭遇した同じギルドの「山田」に失恋の愚痴をこぼすものの、「興味はないすね」と、そっけなく返されてしまう。だが、キレイになって元彼を見返そうと参加したオフラインイベントで、再びその言葉を耳にする。それが“山田”との、運命的な出会いだった――！
