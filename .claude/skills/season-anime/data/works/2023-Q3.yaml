    synopsis: |-
      「小説家になろう」で日間・週間・月間・四半期１位を獲得した人気タイトルが、待望のTVアニメ化！

      ブラック企業に勤めるサラリーマン・佐藤亮太は、ある日ふと気がつくと、見知らぬダンジョンの中にいた……！　そこは、あらゆるものがモンスターからドロップされる不思議な世界だった。

      偶然出会った少女・エミリーの助けで自身のステータスを確認するも、体力や魔力などのステータスはすべて【F】(最弱)！　さらにレベルは固定で【１】（最低）！

      絶望の淵に立たされた亮太だったが、最強のユニークスキル【ドロップスキル・オールS】の持ち主であることが判明！！　はたして亮太は、この不思議な世界で生き延びられるのか！？

      最弱で最強の冒険が、今始まる──！
