    synopsis: 偶然か、あるいは必然か――とある出会いから死神の力を手にし《死神代行》となった黒崎一護は、現世で死した魂魄が集う場所・尸魂界（ソウル・ソサエティ）の動乱に巻き込まれ、熾烈な戦いの中、仲間と共に大きく成長を遂げてきた。そんな一護の暮らす空座町（からくらちょう）で異変が起こる。新たなる死神と、新たなる敵の出現。そして救いを求める声。一護は再び斬魄刀を取り、戦場へと旅立つ。一方、尸魂界では、現世における突然の虚（ホロウ）の連続消失が観測され、この地へ導かれた魂が暮らす流魂街での住民達の失踪が発生、さらには死神たちの住む霊屋・瀞霊廷が賊軍に襲撃される。賊軍の正体は、滅却師（クインシー）の始祖・ユーハバッハが率いる《見えざる帝国（ヴァンデンライヒ）》。《見えざる帝国》は、死神たちに宣戦布告する。「5日後、尸魂界は"見えざる帝国"により殲滅される」千年の長きにわたり死神たちが背負っていた因縁。その宿業と秘められた真実がついに紐解かれる。全ては終焉へ。黒崎一護の、最後の戦いが始まる――。
