    synopsis: 「チート能力を授けて、異世界に転生させます！ 第⼆の人生を謳歌してね！？」突如女神にこう告げられ、所謂引きニートだった俺は、異世界の王子の赤ちゃんとして目覚めたのだった。魔力が絶対的なこの世界、圧倒的な魔力と王族の地位を得た俺なら「悠々自適の引きこもりライフが満喫できるじゃないか！」と思った瞬間。あっさりと、遠くの森に捨てられた…。いきなりの大ピンチを迎えた、俺の目の前に現れたのは、とある勘違いから俺の従者になるフレイムフェンリルの「フレイ」と、辺境伯の「ゴルド・ゼンフィス」だった。それから９年、拾われたゼンフィス家で何不自由なく育った俺は、可愛い妹「シャル」をはじめ、前世では考えもしなかった家族というものに囲まれて、再び引き籠もりライフのための計画を図るのだが…。最強！？の俺に、平穏な生活は果たしていつ訪れるのでしょうか？
