      変わらぬ決意を胸に、転生した世界でもお菓子作りに励むペイストリー。

      だが、若き少年に数々の苦難と試練が降りかかる。

      領地を襲撃する盗賊に、一癖も二癖もある腹黒貴族たち、さびしい懐事情に、水も乏しく枯れ果てた土地と前途多難……。

      立ち向かう武器は、持ち前の知略とお菓子作りへの愛情。果たして、ペイストリーは幸せ溢れる領地を作れるのか！？

      甘くておかしな王道スイーツ・ファンタジー開演！
