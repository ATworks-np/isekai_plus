    synopsis: |-
      これは、私たちの未来の物語――。

      21世紀に始まったAIの圧倒的な進歩は、社会の発展に寄与する一方、高い知性を持つ機械を道具として使う是非を、人類に突きつけた。

      そして22世紀後半。人々は「産業AI」とは別格の存在として、人権を持った「ヒューマノイド」を当たり前に受け入れ、共に暮らしている。

      須堂光は、ヒューマノイドを治す新医科の医者として、ヒトとAIの共存がもたらす「新たな病」に向き合っていく。

      時に、裏の顔も使いながら……。
