    synopsis: 2012年から小説投稿サイト「小説家になろう」で連載が開始されて以来絶大な人気を誇る“なろう系ラノベのパイオニア”『無職転生 ～異世界行ったら本気だす～』。理不尽な孫の手の著による本作は、多くの作品が生み出されている「異世界転生系ラノベ」「なろう系小説」のまさに先駆者的作品であり、幅広いファンを獲得している当ジャンルの代表作。働きもせず他人と関わりもせず、ただ部屋に引きこもってゲームやネットに明け暮れるだけの34歳のニート男が、ある日交通事故に遭い死亡…したと思った次の瞬間、剣と魔法の異世界に生まれたばかりの赤ん坊として転生！少年ルーデウスとして生まれ変わった男が、前世の記憶と後悔を糧に、出会いや試練に直面しながら「今度こそ本気で生きていく」姿と壮大な冒険が描かれる大河ファンタジー。
