    synopsis: |-
      君がいて、みんながいて。僕らのピースが揃っていく。

      シリーズ累計800万部を突破した人気漫画「ホリミヤ」。2021年に待望のTVアニメ化、そして2023年7月、前作では描かれなかった原作の人気エピソードなどをキャスト・スタッフが再集結し、新作アニメの放送が決定!!

      堀京子は、美人で成績も良く学校ではクラスの中心的存在。

      ある日ネクラなクラスメイトの宮村は、ケガをした堀の弟創太を家に送り届けたことで堀と距離が縮まり…堀をきっかけに同級生達とも交流を深めていく宮村。

      みんなと繋がることで鮮やかに変わっていく日々。そんな毎日は、青春が詰まった超微炭酸系スクールライフ！
