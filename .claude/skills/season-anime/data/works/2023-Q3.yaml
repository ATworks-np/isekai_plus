    synopsis: |-
      勇者マックスが魔王を倒して、早10年――。
      急速に発展した社会のお荷物となったマックスは、 自堕落な生活がたたり、見るも無惨なおっさんに成り下がっていた。
      そんな男の前に現れたのは、10年の時を経て復活を果たした魔王だった！力の大半が戻らず幼い姿となった魔王は、くすぶる男のために決意する。
      「余がそなたの面倒を見てやると言っておるのだ！」
      どん底勇者と最弱魔王が繰り広げるドタバタなワンルームライフ！ところが、その裏ではかつての勇者パーティが世界規模の陰謀を企ていて……!?
      行き着く先は再度の死闘か、あるいは――。
