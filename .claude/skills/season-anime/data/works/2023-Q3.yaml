    synopsis: この社会は平等であるか否か。真の『実力』とは何か――。東京都高度育成高等学校。それは徹底した実力至上主義を掲げ、進学率・就職率100％を誇る進学校である。そこに入学して1年Dクラスに配属された綾小路清隆だったが、学校は実力至上主義の看板とは裏腹に、生徒に現金と同価値のポイントを月10万円分も与え、授業や生活態度についても放任主義を貫く。夢のような高校生活の中で、散財を続け自堕落な日々を送るクラスメイトたち。しかし、間もなく彼らは学校のシステムの真実を知り、絶望の淵に叩き落とされるのだった……！落ちこぼれが集められたDクラスから少年少女たちが見出すものは、世界の矛盾か、それとも正当なる実力社会か。
