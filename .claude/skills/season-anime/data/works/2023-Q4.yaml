    synopsis: 科学技術が高度に発達した機械仕掛けの理想郷「帝国」。超常の力を駆使し、“魔女の国”と恐れられる「ネビュリス皇庁」。百年にわたる戦争を続けてきた両国には、二人の英雄がいた。 最年少にして帝国の最高戦力となったイスカ。 ネビュリス皇庁の王女にして“氷禍の魔女”の異名を持つアリスリーゼ。戦場でめぐり逢った二人は、命を賭して戦う宿敵となった。国を、家族を、仲間を守るため、決して譲れない矜持と矜持をぶつけ合う。 しかし、激闘の中で互いの素顔に触れた二人は、その生き方に、その理想に惹かれてしまう。 ともに歩むことはできず、残酷な運命に翻弄されるとわかっていても。……そんな二人を嘲笑うかのように、世界の緊張はなおも高まり、大国の謀略が交錯しようとしていた。 分断された世界、それでも少年と少女は想いを募らせていく――。
