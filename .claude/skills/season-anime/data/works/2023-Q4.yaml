    synopsis: |-
      心優しい悪魔・ニールは、人間界で暮らすことを夢見て、親友の吸血鬼・アイラに誘われ万聖街にやってくる。1031号室の同居人は、天使にミイラと“人ならざる者たち”だった。

      くせ者ぞろいの同居人との共同生活だけでも波乱万丈なのに、実はニールに魔王の力が眠っていて――。その力を巡って、狼人間や兄の悪魔も人間界にやってくる。果たしてニールは、人間界での日常生活を過ごせるのか……？！

      これは、あくまで何気ない日常のお話。
