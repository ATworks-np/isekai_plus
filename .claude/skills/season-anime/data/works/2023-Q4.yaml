    synopsis: 「陰の実力者」に憧れた少年は、道半ばで命を失い、シド・カゲノーとして異世界に転生した。新たな世界で「陰の実力者」設定を楽しむことにしたシドは、陰に潜み、陰を狩る者――シャドウを演じ、付き合いのいい配下の少女たちと闇の教団に対抗する「シャドウガーデン」を組織する。すべては妄想の産物……そのはずだった。ところが世界の闇たる「ディアボロス教団」は実在し、シドの知らぬところで「シャドウガーデン」は教団との抗争を繰り広げていた。次なる舞台は「血の女王」「妖狐」「暴君」の三勢力が統治する無法都市。そこは、ならず者がはびこる弱肉強食の世界だった。吸血鬼たちの支配者「血の女王」の討伐のため、姉のクレアに連行されてきたシドは、またとない「陰の実力者」ムーブの機会に心を躍らせるのだが……。「血の女王」を巡る陰謀が動き出し、無法都市は三つの勢力が入り乱れる。さらに姉のクレアも騒乱に巻き込まれ、シャドウガーデンも独自に行動。混沌を極める中、シドは人知れずシャドウとして暗躍しようとする。赤き月は昇り、覚醒の刻は来た――！
