    synopsis: |-
      出生はまったくの謎だが、のちに「ミナライ」と呼ばれる主人公。

      恩人「オヤカタ」に連れてこられたのは「全力工務店」という名の建設会社。

      全力工務店のメンバーは個性豊かであり、初めは自分を出せずにいたミナライだったがまさに現場見習いとなり、とにかくがむしゃらに全力で仕事に取り組む。その姿勢にほどなく先輩らにも認められ、いつしか職場を超える大切な存在になっていた。

      「何ごとにも全力」「全力で生きる」がモットーである全力工務店のウサギ達の涙と感動の物語。主人公「ミナライ」の成長とともに感動と元気を届けます。
