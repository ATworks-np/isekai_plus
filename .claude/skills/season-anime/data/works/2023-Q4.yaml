      聞き慣れない言葉に戸惑いつつも、彼は＜聖剣学院＞に入学することに。

      魔術の失われた未来世界で、最強魔王と美少女たちの織りなす聖剣と魔剣の学園ソード・ファンタジーが幕を開ける！
