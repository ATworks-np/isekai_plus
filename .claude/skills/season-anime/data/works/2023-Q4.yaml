      765PRO ALLSTARSのライブチケットを偶然もらった未来は、会場で同じ中学2年生の最上静香と出会う。

      幼い頃からアイドルに憧れていた静香。そして客席には伊吹翼の姿も。

      3人が見つめる中、ステージの幕が上がる！
