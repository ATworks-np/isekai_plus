    synopsis: 憧れ、執着、焦がれる想い、己では止められない気持ちが溢れた時、人は＜鬼＞になる―――。栄華を誇る平安京。都を騒がす怪事件を解くべく、醍醐天皇の孫で雅楽家の源博雅は陰陽寮を訪れる。そこで出会ったのは、人らしからぬ空気を身にまとった男、稀代の陰陽師・安倍晴明であった。俗世に興味がなく乗り気ではない晴明に手を焼く博雅であったが、二人は事件の元凶である＜鬼＞たちと対峙していく。そして＜鬼＞の影に潜む、流れの陰陽師・芦屋道満に辿り着く。博雅の笛の師である敦美親王、帝付きの陰陽師・賀茂保憲、そしてとある事件をきっかけに晴明と博雅ともに行動を共にすることになる露子、絡みあう糸のようにそれぞれの想いが交わる中、晴明と博雅は都の平穏を取り戻せるのか。図らずも運命を共にすることとなったタイプの異なる平安凸凹バディの試練が、いま始まる。
