    synopsis: 人はみな　誰にも見せぬ自分を　持っている―― 世界各国が水面下で熾烈な情報戦を繰り広げていた時代。 東国(オスタニア)と西国(ウェスタリス)は、十数年間にわたる冷戦状態にあった。 西国の情報局対東課〈WISE(ワイズ)〉所属である凄腕スパイの〈黄昏(たそがれ)〉は、東西平和を脅かす危険人物、東国の国家統一党総裁ドノバン・デズモンドの動向を探るため、ある極秘任務を課せられる。 その名も、オペレーション〈梟(ストリクス)〉。 内容は、“一週間以内に家族を作り、デズモンドの息子が通う名門校の懇親会に潜入せよ”。 〈黄昏(たそがれ)〉は、精神科医ロイド・フォージャーに扮し、家族を作ることに。 だが、彼が出会った娘・アーニャは心を読むことができる超能力者、妻・ヨルは殺し屋だった！ 3人の利害が一致したことで、お互いの正体を隠しながら共に暮らすこととなる。 ハプニング連続の仮初めの家族に、世界の平和は託された――。
