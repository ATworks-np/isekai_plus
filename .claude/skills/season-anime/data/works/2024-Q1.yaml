      ハンターはその力を使い、ゲート内のダンジョンを攻略し対価を得ることを生業としているが、強者揃いのハンター達の中で、「水篠 旬」は人類最弱兵器と呼ばれる低ランクハンターとして生活していた。

      ある日、低ランクダンジョンに隠された高ランクの二重ダンジョンに遭遇し、瀕死の重傷を負った旬の目前に謎のクエストウィンドウが現れる。

