      width: 452
      height: 640
    synopsis: |-
      「あいつが……俺の家族を……！」

      国中に四散したカードの回収を命じられている王家直属のスパイ組織《ハイカード》。
      その一員であるフィンには断片的にしか過去の記憶がない。
      覚えているのは燃え盛る家……息絶えた家族……
      そして、黒い甲冑を纏った騎士の姿だけ。

      あの騎士はなぜ家族の命を奪ったのか？
      真実を知るために、フィンはバディであるクリス、リーダーのレオ、
      ウェンディ、ヴィジャイと一緒にハイカードの活動を続ける。

      ところが、フィンの前に再び黒騎士が姿を現したことで運命の歯車は大きく動き出す。
      また、フォーランドいちのマフィア組織、クロンダイクファミリーとの抗争も激化。
      王家の戴冠式までにカードを回収しなければならないハイカードだったが、
      ここにきてチーム史上最大の危機を迎える。

      ピノクルのＣＥＯセオドールとクロンダイクのＢＯＳＳバンの因縁が引き起こした悲劇と邂逅。
      散り散りになる仲間と新たなファミリーの存在。
      ベールに包まれたカード誕生の秘密と伝説の魔術師――

      世界の秩序を守るも混乱に陥れるも、意のまま。
      選ばれし者に人知を超えた異能力を与える《エクスプレイングカード》を巡り、
      すべてを賭けるプレイヤーたちの狂騒争奪戦（ゲーム）が、再び、幕を上げる！

      Are you ready?
      It's “TRUTH” Showdown!!
