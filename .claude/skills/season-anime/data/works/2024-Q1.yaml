      平凡な高校生・兎里 健（ウサト）は、帰宅の途中、生徒会長の犬上鈴音（スズネ）、クラスメイトの龍泉一樹（カズキ）とともに突如現れた魔法陣に飲み込まれてしまう――。

      気づくと、そこは異世界。
      3人は王国に攻め込んでくる魔王軍に対抗できる『勇者』として召喚された……はずが、勇者の適性を持っていたのはスズネとカズキのみ。
