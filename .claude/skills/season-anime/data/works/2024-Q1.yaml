      しかし勇者の横暴により、ルードはパーティーを追放されてしまう。その理由はルードの〝使えないスキル〟とされたが……。
      故郷への帰還中、助けた少女により、ルードの未知なるスキルが判明。

      それはとてつもない強力なスキルだった！

      【最高値の外皮9999】と【唯一無二のスキル】を駆使した最強タンク・ルードの冒険譚――。ここに開幕！
