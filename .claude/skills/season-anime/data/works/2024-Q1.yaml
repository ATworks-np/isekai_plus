      かつて世界支配をもくろんだ古の大魔法使いダーク・シュナイダー。彼が封印されてから15年後、世界は破壊神アンスラサクスの復活を目論む闇の反逆軍団の脅威に晒され、メタ＝リカーナ王国にもその侵略の手が迫っていた。

      そんな中、大神官の娘であるティア・ノート・ヨーコの魔法によって、ダーク・シュナイダーの封印が解かれる。

      圧倒的な魔力で次々と敵を退けていくダーク・シュナイダーであったが、闇の反逆軍団・四天王の一人、アビゲイルとの壮絶な戦いの末、メタ＝リカーナ王国は崩壊。大爆発の中、すべての者は光の中に消え、行方不明となった。

      それから2年後――。

      四天王の一人、カル＝スはその圧倒的な力で「氷の至高王（ハイ＝キング）」として君臨し、十二魔戦将軍を率いて 大軍を編成、破壊神復活の最後の鍵を握る王女シーラを探し求めていた。それに反発する形でア＝イアン＝メイデ王国の残党は侍を中心とした反乱軍を組織。各地で魔戦将軍と侍軍団は衝突を繰り返していた。そしてその侍軍団の中 に、2年前の大戦を生き延びた、ティア・ノート・ヨーコの姿があった…。

      アンスラサクスの最後の封印をめぐる聖戦、ダーク・シュナイダーとカル＝スによる宿命の戦い、原作でも人気を博した「地獄の鎮魂歌編」が、いよいよアニメ第2期として製作決定！
