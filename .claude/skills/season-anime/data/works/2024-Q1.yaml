    synopsis: 時は永禄七年(1564年)、人の営みの傍らに闇（かたわら）と呼ばれる魑魅魍魎・妖怪変化たちが息づく戦国時代。齢200年を生きる人間好きの妖狐・たまと、縁あって義姉弟となった、人間嫌いの仙道（仙術使い）の少年・迅火は「世直し姉弟」を名乗り、人に仇なす闇・障怪（さわり）退治の旅をしていた。旅の最中、障怪退治を生業とする僧兵集団・断怪衆（だんがいしゅう）と関わった姉弟は、彼らが障怪に対抗するため、人と闇を人為的に融合した存在・霊力強化改造人間を擁していることを知る。人と闇を辱める所業に、義憤の念に駆られたたまと迅火は、その行いを糾すため、武者修行中の自称浪人・兵頭真介と、断怪衆から脱走した霊力強化改造人間の少女・灼岩と共に、断怪衆総本山へと乗り込む。姉弟たちと敵対する形となった断怪衆は、その討伐のため「闇喰い人」を自称する剣士・雷堂斬蔵と、霊力強化改造人間の精鋭・四獣将を差し向ける。
