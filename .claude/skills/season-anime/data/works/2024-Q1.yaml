    synopsis: |-
      公爵令嬢リーシェ・イルムガルド・ヴェルツナーには秘密があった。それは『20歳で命を落としては５年前の婚約破棄の瞬間に戻る』こと。

      商人、薬師、侍女、騎士など様々な生き方を存分に満喫してきたが、７回目を迎えた今回の人生こそ長生きしてごろごろすると決心する。

      しかし、決意を胸に城を飛び出そうとしたところ、残虐と名高いガルクハイン国の皇太子アルノルト・ハインと邂逅。

      彼こそ騎士人生でリーシェを殺した張本人だが、妙に気に入られ――「願わくはどうか――どうか、俺の妻になってほしい」

      生き残るため、戦争を起こさせないため、過去に得た経験を駆使し、敵国の花嫁となったリーシェの７回目の人生が始まる。
