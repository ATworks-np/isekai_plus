      しかし無限に増殖し続ける＜機械生命体＞を前に、戦いは膠着状態に陥る。
      人類は最終兵器として、新型のアンドロイド＜ヨルハ＞部隊を地球へ派遣。
      新たに地球へと派遣された＜2B＞は先行調査員の＜9S＞と合流し、任務にあたるが、その最中で、数々の不可解な現象に遭遇し……。

