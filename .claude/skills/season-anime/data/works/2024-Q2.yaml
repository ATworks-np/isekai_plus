    synopsis: |-
      なにもかもが平凡な中学生の並平凡は、未来からやってきたT・P（タイムパトロール）隊員の少女リーム・ストリーム、不思議な生き物ブヨヨンと出会う。歴史に影響しない、不幸な死を迎えてしまった人間を救う活動をしているというT・P 隊員。任務を遂行する中でリームたちを見た人間の記憶は消されることになっているが、とあることから記憶が消えされなかった凡は、やむをえずタイムパトロールの見習い隊員として迎えられる。

