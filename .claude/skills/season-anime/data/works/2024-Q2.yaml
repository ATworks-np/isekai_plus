    synopsis: |-
      最強の天才殺し屋...でも殺してはいけない?

      幼少期から殺し屋としての英才教育を受け、
      どんな敵も 6 秒以内に鮮やかに葬り去る、
      無敵の殺しの天才・通称“ファブル”。
      ある日、組織のボスから
      「1年間誰も殺してはならない」
      という突然の指令を受けた彼は、
      人殺しをしない全く新しい生活を送ることになる。

      佐藤明と名乗り、プロとして初めて過ごす普通の生活。

      しかし、平穏な日常の中に蠢く、不穏な空気が明を放っては置かない...。
      果たして、この最大にして至難のミッションを遂行することはできるのか!?

      寓話と呼ばれし無敵の殺し屋“ファブル”の、 カッコよく、滑稽で、
      そして少し風変わりな 1 年間の殺し屋休業生活が始まる!
