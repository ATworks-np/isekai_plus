      原作：秋氏によるライトノベル。WEB 小説サイト「小説家になろう」にて2017年4月より連載が開始、そして、電撃文庫（KADOKAWA刊）より2018年3月から刊行。

      現在までシリーズ累計部数は220万部を突破している大人気小説。イラストはしずまよしのりが担当。2020年7月にTVアニメとして第1期の放送が開始し、これまでにない主人公の圧倒的な存在感や魅力的なヒロインたちは、国内外で多くの反響を得ました。2023年には前作から2年の時を経て《大精霊編》が放送開始。

      平和をもたらした暴虐の魔王は、 地底に広がる未知の世界で行われる神の代行者を選ぶ戦い《選定審判》に巻き込まれていく。それは、あらゆる理不尽をものともしない《不適合者》の失われた記憶を辿る物語。そして過去は世界の理へ導かれる——。
