    synopsis: 原因不明の海面上昇によって、地表の多くが海に沈んだ近未来。幼い頃の事故によって片足を失った少年・斑鳩夏生は、都市での暮らしに見切りを付け、海辺の田舎町へと移り住んだ。身よりのない彼に遺されたのは、海洋地質学者だった祖母の船と潜水艇、そして借金。夏生は“失った未来”を取り戻すため、祖母の遺産が眠るという海底の倉庫を目指して潜る。そこで見つけたのは、棺のような装置の中で眠る不思議な少女――アトリ。彼女は、人間と見紛うほどに精巧で感情豊かなロボットだった。海底からサルベージされたアトリは言う。「マスターが残した最後の命令を果たしたいんです。それまで、わたしが夏生さんの足になります!」
