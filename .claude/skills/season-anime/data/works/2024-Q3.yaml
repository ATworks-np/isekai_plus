    synopsis: 猫だけで営むお店『ラーメン赤猫』、そこにバイトの面接で訪れた人間の珠子。正直に犬派と答えた彼女はあっさりと採用が決まり、任されたお仕事は猫たちのお世話係。ブラッシングを通じて垣間見える猫模様に、様々なお客様が織りなす人間模様。身体も心も温まる『ラーメン赤猫』、愛しさ大盛り、召し上がれ。
