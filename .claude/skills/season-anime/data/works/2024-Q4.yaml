      width: 640
      height: 905
    synopsis: |-
      絵本作家の夕闇ほたるは、愛犬・はなこを亡くした。

      何もできなかった自分を悔やんでも悔やみきれない、暗くて深い悲しみの底にいた。

      そんなある日、庭の雪柳の下にまピンク色のきのこが生えていることに気づく。

      彼がぼんやり眺めていると、それは突然動き出し、しっぽをぶんぶん振って寄ってくる。

      「きのこの...犬?」

      疑問に思いながらも、この謎の生きものと一緒に暮らすことに。

      すると、描いちゃいけないところにお絵かきして、メロンパンもたこ焼きも全部食べちゃって、散らかし放題気まま放題。だけど、とぼけた様子がなんだか憎めない。

      幼なじみの編集者こまこちゃんやきのこ研究所の矢良くんたちも巻き込んだ、きのこいぬと過ごす毎日は、少しずつほたるの表情を変えていく。

      いろいろ謎すぎるきのこいぬとほたるとみんなの、いっしょにいるとなんだか楽しい笑える日々を描く、ちょこっと不思議ほんわかアニメーション。
