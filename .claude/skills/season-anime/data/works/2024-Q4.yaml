      width: 454
      height: 640
    synopsis: |-
      1984年から「週刊少年ジャンプ」で約10年半にわたって連載され、常にトップを走り続ける日本を代表する漫画『DRAGON BALL』。
      コミックスは全世界累計2億6000万部超と驚異的な記録を叩き出し、連載終了後も、テレビアニメ・映画・ゲームなど様々なメディアミックスでファンを魅了しながら、全世界で桁外れの人気を誇っているモンスタータイトル。
      その勢いはとどまる所を知らず、2013年には17年ぶりの劇場版シリーズが復活し立て続けに大ヒットする中、2015年に原作者・鳥山明原案によるシリーズ「ドラゴンボール超」がスタート。
      2022年には、映画「ドラゴンボール超 スーパーヒーロー」が公開、国内初週末興行収入1位はもちろん、全米初登場興行収入1位を獲得。
      連載開始から40周年を目前にして、さらなる高みを目指し進化し続けてきた『DRAGON BALL』の歴史に、新たに刻む新シリーズ「ドラゴンボール DAIMA」が 2024年10月、世界に向けて展開!
