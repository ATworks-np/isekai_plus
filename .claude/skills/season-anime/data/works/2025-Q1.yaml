      3人は旅の途中で命を失い、4人は敵に寝返り皇帝を裏切ったとされ討たれた。だが、それは栄誉を我が物にしようとした7人の仲間の裏切り行為であった。

      帝都に凱旋した彼らは“七英雄”と称され、帝国の民の尊敬を集め栄華の座に上りつめたが、一方で、武勲を奪われ“裏切りの槍”の汚名を着せられた一人の剣士・アシェリートが、妖精の血肉を食らい生き延びていた。

