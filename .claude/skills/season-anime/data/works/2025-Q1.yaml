    synopsis: |-
      『FAIRY TAIL』の真島ヒロがキャラクター＆モンスターデザインを担当したコンシューマーゲーム『FARMAGIA(ファーマギア)』がアニメ化！

      モンスターを種から育て収穫し共存する平和な魔界フェリシダに訪れる危機。強大な敵に、少年少女たちはどう立ち向かうのか……

      仲間と種(モンスター)と紡ぐ叛逆のファンタジーが今、始まる。

      魔界フェリシダ――。

      そこには「魔界人」と呼ばれる人々が、モンスターたちと共生していた。

      ５大陸の１つ、アウリオン大陸に住む少年・テンもその⼀人であった。

      彼は、モンスターたちを種から育て収穫し、使役する「ファーマギア」であり、各大陸を治める領主・竜顎六柱将(オラシオンセイス)になるため最強のモンスターの種を育てていた。

      そんなある日のこと……、突如としてもたらされた「魔王・ディルクロム」の死によって世界は⼀変する――。

      人々の悲しみも束の間、新魔王となった竜顎六柱将(オラシオンセイス)の⼀人、グラーザによる支配が始まるのだった。

      大切な人たちを守るため、最強のファーマギアになるため……

      テンは仲間のファーマギアとモンスターと共に竜顎六柱将(オラシオンセイス)に立ち向かう！
