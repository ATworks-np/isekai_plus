      BS日テレ・日本テレビほか
    thumbnail:
      url: https://img2.animatetimes.com/2025/05/5aa330a4f7cea4f26f6984ac44a8c052682439088d3779_87031040_a86c88be1d5018ccc88579ac27e0067bf0b54763.jpg
      width: 452
      height: 640
    synopsis: |-
      「抜けさせてもらう！」――
      赤魔道士のユークはそう啖呵を切って、5年間在籍したAランクのパーティ「サンダーパイク」を離脱した。彼は、他のメンバーから過小評価、否、バカにされていたことに耐えきれず、ついにその地位を捨てたのだ。
      パーティを探していたユークはマリナ、シルク、レインという元教え子3人と再会し、彼女たちのパーティに加入した。「先生」と慕ってくれる彼女たちに励まされ、ユークはその規格外の魔法力とスキルを存分に発揮し、マリナたちの能力を見事に引き出すことで次々にクエストを達成。そして、配信用魔法道具（アーティファクト）「キャメラット君」による“冒険配信”を通じて、パーティ「クローバー」は世間に名を馳せていく。
      そんな「クローバー」の夢は最難関迷宮【無色の闇】の踏破。それを叶えるため、様々な迷宮（ダンジョン）に挑戦するが、徐々に世界を揺るがす混沌へと巻き込まれていく――

      ユーク率いるCランクパーティ「クローバー」は、拠点であるフィニスを離れ、交易都市ドゥナに到着した。

      彼らは活動再開の場として、複数のパーティがレース形式でクエストを行う国選依頼(ミッション)に参加することになったのだ。

      まだ名前も付いていない新しいダンジョンへ挑む「クローバー」だが、そこで目にしたのは、「グラッド・シィ＝イム」と呼ばれる

      不穏な王都で――。“黄昏”の危険な光に包まれたこの街で、「クローバー」は想像を絶する事態に巻き込まれる！
