      燐は、育ての父である藤本獅郎と実の母であるユリ・エギンの足跡を辿っていくが、二人が生きた道筋は、想像を超える過酷なものだった――

      なぜ、悪魔の神であるサタンと人との間に仔が生まれたのか。
      〝青い夜〟とは何だったのか。
      すべてを知ったとき、燐が出す答えとは……。
