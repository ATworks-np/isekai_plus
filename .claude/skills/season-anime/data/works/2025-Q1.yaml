    synopsis: |-
      アラフォーの独身男・ケンイチは、突如として異世界に転移してしまう。わけもわからず危険な森をさまよう中で、巨大ネット通販サイト「シャングリ・ラ」が使えることに気づく。

      それは異世界のアイテムを換金し、現代日本の商品を購入できる“チート能力”だった！

      能力を駆使して商売を始めたケンイチは、瞬く間に商人として頭角を現していく。

      「目指すは、異世界でのスローライフ！」

      街はずれの森で自由気ままな自給自⾜の生活を送ろうとするが……。

      才気溢れるケンイチに惹かれた少女たちが押し寄せ、さらには次々とトラブルに巻き込まれ――

      アラフォー男は、念願のスローライフを実現できるのか!?

      異世界ファンタジーここに開幕！
