      height: 640
    synopsis: |-
      小柄で物静かな女の子、 阿波連れいなさん。
      人との距離をはかるのが少し苦手。

      そんな彼女の隣の席に座るライドウくんは、
      阿波連さんとの間に距離を感じていた。

      だが、ある日、阿波連さんが落としてしまった消しゴムを
      ライドウくんが拾ったことをキッカケに、ふたりの距離は急接近！！

      学校生活を送る中で「遠すぎたり」と「近すぎたり」を繰り返し、
      付き合い始めた阿波連さんとライドウくん。

      それから迎えた新学期、
      今度は転校生との距離がはかれない！？

      色んな意味で、『はかれない』密着系？
      青春ラブコメディの幕が再び上がる！！
