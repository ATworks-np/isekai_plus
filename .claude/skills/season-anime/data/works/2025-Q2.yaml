      働いているのは、ホテリエロボットのヤチヨを中心に、各部署で働く従業員ロボットたち。オーナーの帰還と、再び人類を迎える時を待ちながら、宿泊客のいないホテルでひたすら業務を行う、永遠とも思われる日々。

