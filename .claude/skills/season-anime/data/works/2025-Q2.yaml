    synopsis: 女神様の計らいで不老不死の魔女となって異世界に転生したアズサ。過労死した前世の反省からスローライフを願い、生活費の足しにと日課でスライムを倒すこと300年――。気づけばレベルMAXの世界最強になっていた！最強の噂は広まり、静かだった高原の家に事情を抱えたドラゴン娘やスライムの精霊、エルフや幽霊といった娘たちが押しかけてくる。彼女たちの悩みやおかれた状況を見過ごせないアズサは奔走し事態を解決、家族として迎え入れ、みんなとの新しいスローライフを始めることにする。しかしその新生活は、スローライフというには少し賑やかなもので――！？レッドドラゴンの故郷に行って温泉に入ってみたり、魔族の国の式典に行ってみたり、世界樹と呼ばれる巨大ダンジョンを攻略したり。今日も楽しい一日が始まります！
