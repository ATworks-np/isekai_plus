      height: 620
    synopsis: |-
      かつて「厄祭戦」と呼ばれる大きな戦争があった。その戦争が終結してから、約300年。

      地球圏はそれまでの統治機構を失い、新しい支配体系をもって新たな世界が構築されていた。仮初めの平和が訪れる一方で、地球から離れた火星圏では、新たな戦いの火種が生まれつつあった。

      主人公の少年、三日月・オーガスが所属する民間警備会社クリュセ・ガード・セキュリティ（以下：ＣＧＳ）は、地球の一勢力の統治下にある火星都市クリュセを独立させようとする少女、クーデリア・藍那・バーンスタインの護衛任務を受ける。しかし、反乱の芽を摘み取ろうとする武力組織ギャラルホルンの襲撃を受けたＣＧＳは、三日月ら子供たちを囮にして撤退を始めてしまう。少年達のリーダー、オルガ・イツカはこれを機に自分たちを虐げてきた大人たちに反旗を翻してクーデターを決意。オルガにギャラルホルンの撃退を託された三日月は、CGSの動力源として使用されていた「厄祭戦」時代のモビルスーツ、ガンダム・バルバトスを用いて戦いに挑む。
