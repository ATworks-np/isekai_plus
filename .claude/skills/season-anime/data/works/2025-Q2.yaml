    synopsis: 遠い先の未来に人類によって作られたロボット「MIRU」。武器を持たず、時空を超えタイムリープし、様々な時代に訪れる。時代も場所もパラレルな世界でありながら、どの時代にもいる、必死に生きている人達に出会い、その人々の悩み、苦しみに寄り添い、新たな人生への一歩を後押しする。人類は「MIRU」と出会う事で、希望に向かって歩き始める。なぜそのロボットは作られたのか、ディストピアに向かう地球の未来を救えるのか？「MIRU」そのものも完璧ではなく、人との出会いによって悩み、学んでいく。人類は新たな友「MIRU」を得て明るい未来への一歩を踏み出していく、歩幅の小さい一歩だが、その一歩が「バタフライエフェクト」のように大きな変化を生み、再生に向けた一歩になっていく。「未来は自分たちの手でつくれる」そんな思いを込めたアニメです。
