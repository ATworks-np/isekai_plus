      見たことのない新たなバズリウムチェンジにみんなで挑戦！

      そんな中、謎のお姫様『リング・クローバー姫』と執事のシツムゥが『アイプリコンテスト』の開催を宣言！

      優勝すると、あこがれの『エターナルアイプリ』になれると聞いたひまりとみつきはやる気満々、気合いも十分！

      だけどリング姫には、とっても大きな『ひみつ』があるみたい……。
