    thumbnail:
      url: https://img2.animatetimes.com/2025/01/b641527125624da8f2f63170199389f867905260f307f2_80363238_bf54cc8ec27598ce5e55834694aaecc28244342b.jpg
      width: 453
      height: 640
    synopsis: |-
      隆盛を極めた科学技術が衰退し、法力という新たなエネルギーが動かす時代。人類は、禁断の生体兵器「ギア」を生み出した。生まれてきたギア達は、やがて人類に反乱を起こすこととなる。

      のちに聖戦と呼ばれる生存戦争は、辛うじて人類が勝利を得るも、その犠牲は大きく、終結から十数年の時が流れても人々の心の傷が癒えきることはなかった。人とギアの間に生まれた子――シン＝キスクは、父カイと母ディズィーの結婚式に向かっていた。

      それは禁忌の中の禁忌であった人とギアとの結婚。平穏な世でも長い時をかけて実現に至った式であった。多くの感情が交錯するも、祝福に包まれていた結婚式。そこに突如、謎の少女が現れる――

      ギアの血を継ぐ宿命の子。そしてギアを憎む謎の少女。両者の邂逅は、世界に激震をもたらすのであった。
