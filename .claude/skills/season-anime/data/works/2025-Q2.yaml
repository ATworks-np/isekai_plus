      width: 453
      height: 640
    synopsis: |-
      時は天保十一年（1840年）。大飢饉により人心が乱れた世において、鬼が人の姿に化け、戯れに人をたぶらかすようになっていた。江戸の街から遠く離れた山間の集落・葛野（かどの）。この集落に、甚太と鈴音という兄妹が暮らしていた。幼い頃に、ある理由から葛野に来たよそ者の二人だったが、皆に受け入れられ仲睦まじく日々を過ごしていた。集落には、「いつきひめ」と呼ばれる巫女がおり、成長した甚太は巫女の護衛役を務めるように。そしてある日、甚太は鬼の討伐に赴いた森で、遥か未来を語る不思議な鬼に出会う――
      巫女の護衛役として死と隣り合わせの甚太、その身を心配しつつも健気に明るく兄を送り出す鈴音、巫女「いつきひめ」として責務を果たす中、鬼に命を狙われる白夜。三人の運命の歯車が重なり、そして狂う時。人と鬼、長きに渡り時代をも巻き込む大きな災いが降り注ぐ。江戸から平成へ。刀を振るう意味を問い続けながら百七十年という途方もない時間を旅する鬼人の物語を描く、和風大河ファンタジー。
