      何故か中学校の教室。なんとここで教師をするというのだ。
      人知を超えた能力を持ち、軍隊でも殺せないその怪物の暗殺を、
      各国首脳はやむをえずそのクラス … 椚ヶ丘中学校三年E組の生徒に委ねる事になる。
