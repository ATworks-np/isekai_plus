    synopsis: |-
      人類は詠唱をなくして、魔術を使うことができない。
      ところが、その不可能を可能にしてしまった、ひとりの少女がいた。

      リディル王国における魔術師の頂点・七賢人がひとり
      〈沈黙の魔女〉モニカ・エヴァレット。
      史上、初めて無詠唱魔術を生み出した若き天才である。

      しかし…
      極度の人見知りであがり症の彼女は、
      使い魔の黒猫と山奥に引きこもり、
      数式の本に囲まれて、ひっそりと魔術の研究に打ち込んでいた。

      そんな彼女のもとに、
      七賢人の同僚である〈結界の魔術師〉ルイス・ミラーが訪ねてくる。
      戸惑う彼女にルイスはひとつの王命を告げた。
      それは――貴族の集う名門校に潜入し、
      第二王子を護衛する極秘任務だった……。
