      人並みの青春を目指して、
      高校デビューで軽音部への入部を試みるも
      臆病な性格が災いし大失敗。

      失意の中、ウタが出会ったのは
      人間の声だけで作られる音楽【アカペラ】だった。

      歌声を重ね合わせることでしか繋がれない
      少女たちの不格好な青春がそこにはあった。

      ――輝かなくても、青春だ。
