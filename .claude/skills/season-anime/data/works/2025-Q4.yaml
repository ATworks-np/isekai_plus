    synopsis: |-
      舞踏会での婚約破棄。
      それはよくある“悪役令嬢”への断罪シーンとなるはずでした ――
      舞踏会の最中、婚約をしていた第二王子・カイルから、
      いきなり理不尽な婚約破棄を告げられた公爵令嬢・スカーレット。
      さらには“新しい婚約者”がいると告げられ、ありもしない罪まで着せられてしまう。
      幼少期から続いていたカイルの数々の嫌がらせにも
      “婚約者”ということで耐え続けてきたが、ついに我慢の限界を迎えてしまい…
      「私の最後のお願いです。
      このクソアマをブッ飛ばしてもよろしいですか？」
