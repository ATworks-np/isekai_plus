    synopsis: 大人気キャラクター漫画「クレヨンしんちゃん」の公式スピンオフとして、しんちゃんの父・野原ひろし（35）の昼メシにまつわる出来事を塚原洋一が描いたメシ漫画がアニメ化！「クレヨンしんちゃん」シリーズでは描かれていない、サラリーマンとして家族のために働くひろしの束の間の息抜き＝昼メシを、限られたお小遣いと時間の中でこだわりにこだわり抜く姿＜昼メシの流儀＞を描き、累計発行部数（紙／電子）は80万部超え、さらに「まんがクレヨンしんちゃん.com」での累計PV数は、440万PV数を超え注目を集めている話題作。「クレヨンしんちゃん」原作ファンには嬉しいギャグとシュールな笑いも盛り込まれ、「熱い」、「辛い」、「甘い」など料理ごとに見せる様々なひろしの「顔芸」も魅力の一つ！そして、制作はアニメ「秘密結社 鷹の爪」などで知られるディー・エル・イーが担い、フラッシュアニメーションで制作。普段はあまり見ることのできない働く男・野原ひろしの昼ドキの顔！はたして、どんな「昼メシ」が登場するのか！そして、ひろしが大事にする「流儀」とは一体！？
