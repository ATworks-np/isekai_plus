      陰に忍んで悪しき闇を討たんとする、“忍者（にんじゃ）”。
      孤⽴した者の居場所となり悪事（わるさ）を重ねる、“極道（ごくどう）”。

      江⼾時代、明暦の⼤⽕の裏で刻まれた忍者と極道の因縁（カルマ）が、現代に再び燃え盛ろうとしていた――。

      トラウマにより笑顔を失った忍者・多仲忍者（たなか しのは）と、表向きはエリート会社員ながら裏社会（ウラ）を取り仕切る極道・輝村極道（きむら きわみ）。

      ⼥児向けアニメの話題で意気投合した⼆⼈は、互いの正体を知らぬまま友情を深めていくのだが……。
      忍者と極道、両者の戦争が激化する中、その“運命（さだめ）”が交錯する。

      決めようか、忍者と極道、何⽅（どちら）が⽣存（いき）るか死滅（くたば）るか!!!
