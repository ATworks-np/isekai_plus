      width: 452
      height: 640
    synopsis: |-
      “あやかし”が見える女子大生・津場木 葵は、ある日突然、隠世《かくりよ》にある老舗宿〈天神屋〉へと攫われてしまう。

      祖父が遺した莫大な借金。隠世で交わされていた“約束”。
      借金のカタとして迫られたのは、大旦那――鬼への“嫁入り”だった。

      ところが葵は、その運命をはねのける。
      ――働いて、返す。自分の力で。

      借金を返済するため、天神屋のかたすみに食事処〈夕がお〉を開き、
      真心を込めたおもてなしで、あやかしたちの空腹と心を満たしていく。
      ときには悩みながらも突き進み、葵は隠世の住人たちと絆を育む。
      あの日交わした“約束”は、やがてかけがえのない〈居場所〉へと変わっていく。

      南の地の宿〈折尾屋〉での試練を越え、〈夕がお〉へと帰ってきた葵。
      しかし、穏やかな日々は束の間――〈天神屋〉に、かつてない危機が迫っていた。

      守りたい居場所がある。信じてくれる仲間がいる。
      幾多の出会いと絆に育まれ
      ――物語は再び、動き出す。
