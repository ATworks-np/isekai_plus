    synopsis: |-
      呪われた侯爵との結婚が運命を変える…極上のすれ違いロマンス
      「あなたに愛されなくても助けたかった」
      ペルセポネー伯爵家の令嬢・ルーニアは、父に疎まれ、異母兄からも道具扱いされ、孤独な日々を送っていた。

      そんな中、神官からクロノア公爵家の
      当主ハーデュスとの婚約者として選ばれ、呪われた公爵家に嫁ぐことを決める。

      “冥王”と恐れられるクロノア公爵家には皇帝が選ぶ花嫁と結ばれないと短命になるという呪いがかかっていた。

      しかし、ハーデュスはルーニアを愛するつもりはないと告げる。

      私は呪いを解くためだけに存在する…

      ルーニアはハーデュスを生かすためにハーデュスを騙して一夜を共にし、彼の子を身ごもったとも知らず姿を消した―。

      7年後、ハ―デュスはなぜかルーニアを探し出し、子供と一緒に連れ帰ろうとして……
