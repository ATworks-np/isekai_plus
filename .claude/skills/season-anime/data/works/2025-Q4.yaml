    synopsis: |-
      不滅の存在であるフシ。

      それに対抗するのは⼈間を襲い滅ぼそうとする敵対勢⼒、「ノッカー」。

      攻防の末にノッカーとの戦いには勝利したが、フシはまだ⼈々を守り続ける必要があった。
      ⾃らの体を広げ、樹⽊のごとく抵抗の根を張り巡らせた。

      数百年後、そこは現代世界。
      かつてないほどの平和な世界。

      新しい友⼈･･･新しい家･･･
      全てが満ち⾜りた世界でフシは幸せを謳歌できると思っていた。

      しかし不穏な影が、再びフシに迫る。

      その影は、⼈の⼼の隙間に分け⼊る宿敵。

      そして、⾃分を⽣み出した観察者の真の⽬的。

      フシに与えられる新たな試練。彼に⼤いなる選択の時が迫る。

      不死⾝のフシの物語、「現世編」が幕を開ける。
