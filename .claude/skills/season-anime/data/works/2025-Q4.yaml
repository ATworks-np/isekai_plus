    synopsis: |-
      物語の舞台は漂流する宇宙船。

      “人間に化けて人間を襲う未知の敵”─── 「グノーシア」が船内に紛れこんだことを受けて、乗員たちは疑心暗鬼の中、毎日１人ずつ疑わしい者を投票で選び、コールドスリープさせることを決める。

      グノーシアを全てコールドスリープさせることができれば人間の勝利。

