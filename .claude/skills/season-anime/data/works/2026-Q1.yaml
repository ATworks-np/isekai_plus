      多聞くんのアイドルとしての「オン」の顔と、陰キャな「オフ」の素顔。
      ギャップのジェットコースターに振り回されながらも、全力で彼を推し続けるうたげ。
      ファンと推しという一方通行なはずの関係から始まった2人は、思わぬかたちで距離を縮めていく――

      笑える展開に共感の嵐！きゅんきゅんが止まらない！
