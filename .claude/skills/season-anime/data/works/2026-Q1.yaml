    synopsis: |-
      時は幕末——。
      動乱巻き起こる京の街に集う若者がいた。

      壬生浪士組、通称“ミブロ”。
      のちに「新選組」となる彼らは、街の平穏を守るため命を懸ける。

      ひとりの心やさしい少年「にお」が加わったミブロは、
      戦いの日々を通して、絆を深めていく。

      「京を守るためにはまず安住を捨てて、新たに前に進むべきです。」
      におの一言から、新たな仲間を募集し、組織の拡大に挑むミブロ。

      しかし、筆頭局長である芹沢鴨の存在により、
      隊内に亀裂が生じようとしていた。

      譲れない正義が交錯した末に、儚き暗殺が動き出す——。

      青のミブロ—芹沢暗殺編—、開幕。
