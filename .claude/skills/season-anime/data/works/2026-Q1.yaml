    synopsis: |-
      推しを糧に生きる高校生の木下うたげは、大人気アイドルF/ACEのセクシー＆ワイルド担当・福原多聞くんをこよなく愛する熱狂的なファン。

      ある日家事代行のバイトで訪れた先は、なんと推しの多聞くんの家だった！
      しかし、そこでうたげが見たのは、ステージ上の完璧な姿とは真逆の、自己肯定感が低く、ジメジメとした超絶陰キャな多聞くんで…！？

