      その身一つで、芸を極めよ――

      幼い頃から噺家の父・阿良川志ん太（あらかわしんた）の背中を見て
      その魔法のような落語に魅せられていた桜咲朱音（おうさきあかね）は
      父が真打昇進をかけて挑んだ大一番の舞台で、衝撃的な事件を目撃する。

      6年後――そこには、落語界の最高位“真打”を目指して突き進む
      高校生になった朱音の姿があった。

      話芸の極致で噺家たちが鎬を削る、本格落語ものがたり――ここに開幕!!
