    synopsis: 最強の配信者を目指す承認欲求強めな女の子と、彼女を支える「ピ」の30日間を描いたマルチエンディングアドベンチャー『NEEDY GIRL OVERDOSE』。2022年1月にSteam配信にてリリースされた本作は、累計300万本ダウンロードを記録。関連楽曲の再生数は4億回を突破し、インターネットカルチャーを代表するインディーゲームとなった。そして2026年4月。この混沌とした令和のインターネットを照らす、一筋の光となった女の子──「超絶最かわてんしちゃん」、通称「超てんちゃん」が、遂にテレビアニメデビュー。アニメーション制作は『アークナイツ』、『ブルーアーカイブ』を手がけるYostar Pictures。監督は『ブルーアーカイブ』や『New PANTY & STOCKING with GARTERBELT』の絵コンテ・演出、そして『NEEDY GIRL OVERDOSE』ショートアニメを手がけてきた中島政興（Yostar Pictures 所属）が担当し、アニメーション独自の物語とキャラクターを描き出す。登録者1000万人を記録するトップ配信者の少女、超絶最かわてんしちゃん──通称「超てんちゃん」の活躍を見ない日はない。インターネット、テレビ、ライブを問わず、彼女はファンの歓声の中にいる。そんな超てんちゃんに追いつこうとしているのは、３人の少女による配信者ユニット・カラマーゾフ。そして、そんな配信者たちの活動とは遠く離れたところに、ヒモの彼氏と同棲しながらコンセプトカフェで働く少女、かちぇの姿がある。星のように輝く少女と、輝きに手を伸ばす少女たちが紡ぐ、世界を魅了した“インターネット・エンジェル”の物語と、画面の向こうにいる“あなた”の物語が、ここに幕を開ける――
