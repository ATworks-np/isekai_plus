    synopsis: |-
      同じ高校に進学した浅葱優希也と桜みくは、“両片想い”の幼なじみ。

      自分の想いに気づいているのに…。
      今にも「好き」があふれそうなのに…。
      …でも、素直になれない!!

      近すぎて、遠すぎる、優希也とみく。
      ふたりをつなぐのは、小6のときにはじまった「愛してるゲーム」。
      交互に「愛してる」といって照れたほうが負け。
      今でもずっと続ける、意地の張り合い。

      愛してるゲームに勝てたら、告白したい――。
      愛してるゲームに勝って、「好き」を認めさせたい――。

      両片想いを卒業するための、
      ありったけの想いを込めた“恋のゲーム”がはじまる!!
