    synopsis: 統一暦1923年6月。金髪碧眼の幼女、ターニャ・デグレチャフは北方軍管区ノルデン戦区の第三哨戒線で上空からの観測任務にあたっていた。ターニャは帝国の士官学校で航空魔導師としての研修を終えたばかり。危険も何もないただの観測任務は何事もなく無事に終わるはずだった。しかし協商連合の越境侵犯をきっかけに帝国と協商連合は戦争状態に突入し、事態は一変する。協商連合による奇襲が発生し、ターニャは敵の魔導師中隊と単独で交戦しなければならない事態に陥ってしまう。多勢に無勢で味方が到着するまで持ちこたえることなどできるわけもなく、しかし逃げようものなら敵前逃亡で死罪は免れないという絶望的な状況。何としても生き延び、上層部に対して最善を尽くしたとアピールするため、ターニャはとある作戦に打って出るのだが……。
