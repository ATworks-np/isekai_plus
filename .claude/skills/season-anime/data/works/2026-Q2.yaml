    synopsis: 広い庭に建つ、旧い日本家屋に家族と暮らす高校生・飯嶋律。律の母親・絹は家で茶道教室を開いている。ある日の午後、教室が終わり生徒たちが帰った後、律と絹は、玄関先に見知らぬ一足の草履が残っているのを見つけた。来なかったはずの"客"の気配はそのまま家にとどまり、律は広く暗い家のあちこちで花模様の着物を着た何者かの"気配"を感じる。亡くなった祖父ゆずりの妖しいモノたちを視る力を持つ律に対して、本性を隠し律の父親の姿を借り飯嶋家で暮らしながら彼を守護する妖魔・青嵐は、その気配について放っておくよう律に忠告する。不穏な空気のまま数日が過ぎたある日、律の白昼夢の中に祖父が現れ「荒川絹代」という名を示す。はたしてそれは誰の名なのか？　そして飯嶋家を訪ねてきた律の従姉・司をも巻き込み、恐怖の目隠し鬼が始まる――。
