      人間であることを隠しながら悪魔学校バビルスに通う鈴木入間。悪魔のオトモダチも増え、いつしか魔界生活を楽しむようになり、様々な行事で大活躍！魔界での位階（ランク）を駆け上がり、学内外で注目の的になりつつあった。

