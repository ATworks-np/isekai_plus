    synopsis: |-
      転生先は…
      「ハーレムかつハッピーエンドなチート勇者、の肋骨」！？
      アニメーションの常識を覆す、異世界転生アニメが誕生！

      舞台は転生先を自由に選べる世界。
      ――しかし近頃は転生希望者の数が増えすぎて
      「チート持ちハーレム勇者」は待ち時間が５万年！
      「魔王」への転生すら千年単位の待ち時間が当たり前。
