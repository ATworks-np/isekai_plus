      普通の男子高校生・真名部響生は、ある日突然、魔物も潜む異世界の広大な草原に転移してしまった。見たこともないファンタジー世界を、あてもなく彷徨っていたヒビキだが、自身に『鑑定』というスキルと、職業『鑑定士(仮)』が与えられている事に気が付く......。(仮)って......!?

