      所属する問題児（アブノーマル）クラスの13人全員で「位階（ランク）４」達成という前人未到の無茶振りが学校から課される中、最後の昇級チャンスとなる音楽祭での優勝は絶対条件。
      しかし、クラスメートに「目立つことを許されない悪魔」が1人…。

      果たして入間たちは13人全員で舞台に立つことが出来るのか――!?
