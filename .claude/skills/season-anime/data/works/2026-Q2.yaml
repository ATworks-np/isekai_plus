    synopsis: 清楚可憐な“レンタル”彼女（レンカノ）・水原千鶴のことを家族にも友人にも“本当”の彼女だと紹介してしまった、ダメダメ大学生・木ノ下和也。嘘だと言い出せないまま“偽り”の関係を続ける和也は、さまざまなイベントを一緒に乗り越えるなかで、次第に千鶴への“本物”の想いを募らせていく。映画制作のクラウドファンディングを無事成功させ、ついに和也は千鶴への“覚悟”を決める。一方、やや強引なところがある彼女(仮)・更科瑠夏が、これまで以上に超積極的に和也に迫る……！さらに、和也と千鶴の“本当”の関係を知る小悪魔的な元カノ・七海麻美が千鶴に急接近する、緊迫した事態も発生！？周囲を巻き込み、物語はますますヒートアップ！そして、舞台はハワイアンズへ！！たった一度の“レンタル”から動き出した和也の“リアル”。“偽り”の彼女が“本物”になる日は、はたして訪れるのか──！？
