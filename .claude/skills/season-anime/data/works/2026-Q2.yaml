    synopsis: |-
      てにをは×りいちゅで贈る、掟破りミステリー。

      殺された。やっぱりまた殺された。
      伝説の名探偵を父に持つ追月朔也は、半人前の高校生探偵。
      今日も依頼を受け、意気揚々と浮気調査や猫探しなど地味な仕事にいそしむが、なぜか行く先々で殺人事件に巻き込まれてしまう。
