      「私に食べられるなんて、とても光栄なことよ。感謝しなさい、下等生物」
      ところが……なぜか供犠クンと恋人契約を結ぶことに!? 数千年生きて初恋も未経験の純情なカナンには、毎日がドキドキの連続！　一緒に帰る!?　手を繋ぐ!?　デート!?　初××!?!?!?!?
