      width: 452
      height: 640
    synopsis: |-
      大ヒット作『ダンジョンに出会いを求めるのは間違っているだろうか』の大森藤ノが創る原作を、気鋭の漫画家、青井 聖がダイナミックに描く、“剣と魔法”の学園ファンタジーコミック『杖と剣のウィストリア』。2024年に放送されたTVアニメシーズン1に続き、いよいよシーズン2が今春開幕。

      魔法が使えない落ちこぼれの魔法学院生・ウィルは、幼馴染のエルファリアとの約束を守るため、魔導士メイジの頂点“至高の五杖マギア・ヴェンデ”を目指していた。杖の代わりに剣を執り、少しずつ学院内でもその実力を認められていく。学年トップのリアーナたちと挑んだダンジョンでの総合実習では、謎の魔導士から襲撃を受けるも、仲間と共に辛くも退け、ついに卒業試験に臨む。
      ウィルは『塔』で待つ少女のもとへ辿り着けるのか？

      シーズン1で監督を務めた𠮷原達矢は総監督に就任し、新たに監督として中野英明、シリーズ構成として木村 暢が参加。キャラクターデザインおよび総作画監督の小野早香と、音楽の林 ゆうきが再集結。制作プロダクションも引き続きBN Pictures×アクタスの共同体制で制作。

      落ちこぼれの少年が使える唯一の魔法とは―――。
      杖と剣が交わる魔剣譚 第二章の幕が開く
