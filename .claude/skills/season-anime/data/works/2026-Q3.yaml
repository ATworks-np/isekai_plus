    synopsis: |-
      かつて「週刊少年チャンピオン」で連載スタートした、西条真二による料理漫画『鉄鍋のジャン』。主人公は、相手を打ち負かすためならどんな手段も厭わない、悪魔のような中華料理人“ジャン”。

      常識を超えた料理の数々と、倫理観を吹き⾶ばす超個性的なキャラクターたちが、料理を魔法のようなエンターテインメントに変えていく手に汗握る物語。画期的な料理漫画として熱狂的なファンを生み出した伝説の作品が、ついに初のTVアニメ化となる！

      『鉄鍋のジャン！』がこれまでアニメ化されなかった理由は誰にもわからない。しかし2026年、企画は突如として実現に向かって動き出した。危ない料理の数々ははたして放送できるのか!？ ジャンのぶっ⾶んだ⾔動は令和の人々に理解されるのか……？ コンプラ遵守の現代に、ジャンが究極の料理で勝負を挑む！！！
