      なぜ洋輔は「二十世紀電氣目録」を追い求めるのか。
      そして、洋輔と清六だけが知る「二十世紀電氣目録」の“秘密”とは。

      「二十世紀電氣目録」を巡り、少年少女の夢が再び動き出す―
