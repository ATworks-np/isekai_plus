    synopsis: |-
      “電氣の時代”を夢見る少年たちがいた。
      「二十世紀電氣目録」に、思い描く電氣の発明を書き込む主人公・坂本喜八。
      憧れの兄・坂本清六と共に夢の実現を誓う喜八だったが、
      清六は「二十世紀電氣目録」を持って戦争に行き、帰らぬ人となる。

      月日は流れ、酒造の娘・百川稲子との出会いによって、
      失われたはずの「二十世紀電氣目録」が喜八の前に現れる。
      それを狙うのは、稲子との政略結婚を進める蒸気の財閥御曹司・三添洋輔。
