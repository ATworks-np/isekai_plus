      url: https://img2.animatetimes.com/2026/02/c73376aa775e21c85e1b005efb3ecc09699a80e3af87a9_81087331_6ab6d38a27a7c592124325726562b8b3191cd545.jpg
      width: 453
      height: 640
    synopsis: |-
      東京西部に位置する巨大な『学園都市』。
      総人口230万人を数え、その約8割を学生が占めるこの都市では、超能力開発のための特殊なカリキュラムが実施され、学生たちの能力は『無能力(レベル0)』から『超能力(レベル5)』までの六段階で評価されていた。

      世間の常識をはるかに凌駕する科学技術を誇り、誰もが科学的な能力を与えられて安全に暮らしていける夢のような教育機関――その平和の裏側には、決して表沙汰されることのない汚れ仕事を請け負う『暗部』組織が存在する。

      『アイテム』――四人の少女で構成された精鋭部隊。

      窒素を自在に操り、鉄壁の防御を担う絹旗最愛。
      爆発物とトラップを駆使し、戦場を翻弄するフレンダ＝セイヴェルン。
      能力者が発する微弱な力を読み取り追跡する、滝壺理后。
      そして、学園都市に七人しかいない『超能力者(レベル5)』の一角、麦野沈利。

      そんな彼女たちの前に現れた「五人目」の少女。
      彼女との出会いが、『アイテム』を新たな闇へといざなうことに――。

      これは、暴力と非道と背徳にまみれた、かなり変わった能力者の少女たちの日常と絆と、深い深い『闇』を描く物語。
