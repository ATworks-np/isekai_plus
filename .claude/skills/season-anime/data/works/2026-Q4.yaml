      銀行は――最高の「賭場」になり得る。
      新人銀行員・御手洗暉は、突然聞き慣れない部署――特別業務部へ異動を命じられる。
      新たな上司に導かれて足を踏み入れたのは、銀行が運営する賭博場。
      その異様な光景の中にあってなお、圧倒的な異彩を放つギャンブラー・真経津晨。
      真経津に魅入られた御手洗は、退屈に腐り果てた日常を捨て、命を削る情熱の世界へ飛び込んでいく。
      熱狂、絶望、悦楽、破滅、憧憬――ここには全てが詰まっている。
      銀行員×ギャンブラー
