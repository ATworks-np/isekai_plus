    synopsis: 舞台は『シャングリラ・フロンティア』から、『ギャラクシア・ヒーローズ：カオス』へ大人気エピソードがついに開幕！サンラク、ペンシルゴン、オイカッツォが最強のプロゲーマー集団に挑む！『シャングリラ・フロンティア』では、プレイ開始早々に、ユニークモンスター「七つの最強種」の一角、夜襲のリュカオーンと戦い「呪い」持ちとなってしまったサンラク。しかし、強力な魔法を操る NPC、エムルを相棒にし、その親姉弟たちとも協力関係を結び、持ち前のゲームスキルを武器に邁進。クソゲー仲間のアーサー・ペンシルゴンとオイカッツォと共闘して、リュカオーンと同じく「七つの最強種」の墓守のウェザエモンを撃破。今ではシャンフロをプレイするゲーマー、ゲームを作ったユートピア社の面々に知れ渡る存在に。仲間との出会い、宿敵との邂逅を経たサンラクは、シャンフロに少しの間“お休み”を告げ、魚臣慧（オイカッツォ）に誘われ助っ人参戦するゲームの祭典「グローバル・ゲーム・コンペティション』へ。同じく助っ人参戦の天音永遠（ペンシルゴン）らと共に、シャンフロエンジン採用の新作 VR 格闘ゲーム『ギャラクシア・ヒーローズ：カオス』で、全米最強のプロチーム「Star Rain」戦いを挑む！“悪逆非道”一歩手前（!?）の戦略とゲームスキルで、綺羅星の如きトッププロゲーマーたち相手に勝利を掴め！
