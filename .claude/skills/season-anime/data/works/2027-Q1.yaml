    synopsis: |-
      紀元前4世紀。
      豊かな知識と教養を備えた青年・エウメネスは、
      偉大な哲学者・アリストテレスと出会い、ともに
      都市国家カルディアを目指していた。
      そこはエウメネスの故郷であり、 “始まり”の場所――。

      名家の次男として育てられたエウメネスは、
      幼少期より類い希なる才能を開花させる。
      ギリシアの書物に通じるだけでなく、鋭い観察眼と判断力を備え、
      幼いながらに周囲の大人たちから一目置かれるほどであった。

      しかし、カルディアで起こったある事件をきっかけに、
      エウメネスは自らの運命と向き合うことになる。

      航海、放浪、そして新たな出会い……。
      のちに、アレキサンダー大王の書記官となるエウメネスの
      長き“旅(オデッセイ)”がここから始まる。
