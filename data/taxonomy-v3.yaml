version: 3

# 作品がこのサイトのどこに属するか。タグではなくフィールド。
# 異世界ファンタジーというタグが43作品に付いていた状態を置き換える。
scope:
  - key: isekai
    label: 異世界もの
    note: 転生・転移・召喚のいずれかで異世界に来る
  - key: native-fantasy
    label: 現地ファンタジー
    note: 異世界だが、誰も転生していない。葬送のフリーレンなど
  - key: game-fantasy
    label: ゲーム世界
    note: 舞台がゲームの中。VRMMO、乙女ゲーム
  - key: modern-fantasy
    label: 現代ファンタジー
    note: 現代が舞台で、異世界要素が入り込む

axes:
  - key: arrival
    label: 世界への来方
    required: true
    note: "どうやってその世界に来たか。全作品が判定対象"
  - key: power
    label: 力・世界のルール
    required: false
    note: "強さがどう決まるか。数値・技能・魔法の扱い"
  - key: profession
    label: 主要人物の生業
    required: false
    note: "何をして生きているか。身分ではなく生業"
  - key: circumstance
    label: 境遇・物語の駆動
    required: true
    note: "何が主人公を動かすか。題材もここ"
  - key: world
    label: 世界の部品
    required: false
    note: "舞台に繰り返し出てくる仕組み・組織・場所"
  - key: character
    label: キャラクター
    required: false
    note: "外見・種族・肩書き・関係。キービジュアルとキャラ紹介で判定"
  - key: mood
    label: 手触り
    required: true
    note: "どう感じるか。構成要素ではないので類似度では軽く扱う"

# 必須の軸は「タグを必ず1つ付ける」ではなく「必ず判定する」。
# 該当なしと未確認を区別できないと、埋め忘れが永久に見えない。
